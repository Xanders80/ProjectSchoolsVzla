services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ProjectSchoolsVzla-app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    environment:
      - SPRING_PROFILES_ACTIVE=${APP_ENV:-production}
      - APP_ENV=${APP_ENV:-production}
      - SERVER_PORT=9000
      - DB_HOST=shared-mariadb
      - DB_PORT=3306
      - DB_NAME=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_URL=jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_DATABASE}?useUnicode=yes&characterEncoding=UTF-8&serverTimezone=UTC
      - DDL_AUTO=${JPA_DDL_AUTO:-update}
      - JPASHOW_SQL=${JPA_SHOW_SQL:-false}
      - SERVER_COMPRESSION_ENABLED=true
      - JAVA_OPTS=-Xms256m -Xmx512m -XX:+UseContainerSupport -Djava.security.egd=file:/dev/./urandom
    networks:
      - docker-shared-services_projects-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    volumes:
      - app-logs:/app/logs

  nginx:
    image: nginx:1.25-alpine
    container_name: ProjectSchoolsVzla-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - docker-shared-services_projects-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  docker-shared-services_projects-network:
    external: true

volumes:
  app-logs:
    driver: local
  nginx-logs:
    driver: local
