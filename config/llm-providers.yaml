# LLM Providers Configuration
# Configuración de proveedores LLM para SMS

version: "1.0.0"

providers:
  openai:
    enabled: true
    models:
      gpt-4o:
        capabilities: [code_generation, code_review, planning]
        max_tokens: 8000
        cost_per_1k_input: 0.01
        cost_per_1k_output: 0.03
        use_for: [master_orchestrator, tech_lead]

      gpt-4o-mini:
        capabilities: [quick_tasks, validation, simple_generation]
        max_tokens: 4000
        cost_per_1k_input: 0.00015
        cost_per_1k_output: 0.0006
        use_for: [syntax_validator, type_checker, lint_enforcer]

  anthropic:
    enabled: true
    models:
      claude-sonnet-4:
        capabilities: [code_generation, code_review, planning, analysis]
        max_tokens: 8000
        cost_per_1k_input: 0.003
        cost_per_1k_output: 0.015
        use_for: [backend_specialist, frontend_specialist, qa_specialist, product_manager]

      claude-opus-4:
        capabilities: [complex_reasoning, architecture, critical_decisions]
        max_tokens: 8000
        cost_per_1k_input: 0.015
        cost_per_1k_output: 0.075
        use_for: [software_architect, master_orchestrator]

  fallback:
    provider: "anthropic"
    model: "claude-sonnet-4"
    trigger_on: [rate_limit, api_error, cost_exceeded]

routing:
  code_generation: "anthropic/claude-sonnet-4"
  architecture: "anthropic/claude-opus-4"
  code_review: "anthropic/claude-sonnet-4"
  planning: "anthropic/claude-sonnet-4"
  quick_validation: "openai/gpt-4o-mini"
  simple_tasks: "openai/gpt-4o-mini"
