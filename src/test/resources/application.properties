# Test Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway in tests (Hibernate ddl-auto manages schema in H2)
spring.flyway.enabled=false

# Mail configuration for tests (dummy SMTP)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=

# Business logic defaults for tests
app.school.name=Test School
app.promotion.average-threshold=70.0
app.promotion.max-failed-courses=2
app.promotion.max-failed-courses-retain=4
app.attendance.alert-threshold=80
app.hr.late-threshold=09:00
app.mail.from=test@school.test
app.mail.enabled=false
app.signature.secret=test-secret-key-for-hmac
app.upload.dir=/tmp/school-test-uploads