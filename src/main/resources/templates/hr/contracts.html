<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Contratos de Personal - Sistema de Gestión Escolar</title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>

  <body id="page-top" role="main">
    <div id="wrapper" role="region" aria-label="Contenedor principal">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>

      <div
        id="content-wrapper"
        class="d-flex flex-column"
        role="region"
        aria-label="Contenido principal"
      >
        <div id="content" tabindex="-1">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>

          <div class="container-fluid" role="main">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
              role="heading"
              aria-level="1"
            >
              <h1 class="h3 mb-0 text-gray-800">
                <i class="fas fa-file-contract mr-2 text-primary"></i>Contratos
                Laborales
              </h1>
              <button
                class="btn btn-primary"
                data-toggle="modal"
                data-target="#contractModal"
                aria-label="Nuevo Contrato"
              >
                <i class="fas fa-plus" aria-hidden="true"></i> Nuevo Contrato
              </button>
            </div>

            <div th:if="${successMessage}" class="alert alert-success">
              <span th:text="${successMessage}"></span>
            </div>

            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Listado de Contratos
                </h6>
              </div>
              <div class="card-body">
                <div class="table-responsive">
                  <table
                    class="table table-bordered"
                    id="dataTable"
                    width="100%"
                    cellspacing="0"
                  >
                    <thead>
                      <tr>
                        <th>Personal</th>
                        <th>Cargo</th>
                        <th>Tipo</th>
                        <th>Inicio</th>
                        <th>Fin</th>
                        <th>Salario</th>
                        <th>Estado</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr th:each="contract : ${contracts}">
                        <td
                          th:text="${contract.staff.firstName + ' ' + contract.staff.lastName}"
                        >
                          Nombre
                        </td>
                        <td th:text="${contract.position}">Docente</td>
                        <td th:text="${contract.contractType}">FULL_TIME</td>
                        <td th:text="${contract.startDate}">2025-01-01</td>
                        <td th:text="${contract.endDate ?: '-'}">-</td>
                        <td th:text="${contract.salary}">1000.00</td>
                        <td>
                          <span
                            th:if="${contract.active}"
                            class="badge badge-success"
                            >Activo</span
                          >
                          <span
                            th:unless="${contract.active}"
                            class="badge badge-secondary"
                            >Inactivo</span
                          >
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            <!-- Modal -->
            <div
              class="modal fade"
              id="contractModal"
              tabindex="-1"
              role="dialog"
              aria-hidden="true"
            >
              <div class="modal-dialog" role="document">
                <div class="modal-content">
                  <form
                    th:action="@{/hr/contracts/save}"
                    method="post"
                    th:object="${newContract}"
                    class="needs-validation"
                    novalidate
                  >
                    <div class="modal-header">
                      <h5 class="modal-title">Registrar Contrato</h5>
                      <button
                        type="button"
                        class="close"
                        data-dismiss="modal"
                        aria-label="Close"
                      >
                        <span aria-hidden="true">&times;</span>
                      </button>
                    </div>
                    <div class="modal-body">
                      <div class="form-group">
                        <label class="font-weight-bold"
                          >Personal <span class="text-danger">*</span></label
                        >
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text"
                              ><i class="fas fa-user-tie text-primary"></i
                            ></span>
                          </div>
                          <select
                            class="form-control"
                            th:field="*{staff}"
                            required
                          >
                            <option value="">Seleccione personal...</option>
                            <option
                              th:each="s : ${staffList}"
                              th:value="${s.id}"
                              th:text="${s.firstName + ' ' + s.lastName}"
                            ></option>
                          </select>
                        </div>
                      </div>
                      <div class="form-group">
                        <label class="font-weight-bold"
                          >Cargo / Puesto
                          <span class="text-danger">*</span></label
                        >
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text"
                              ><i class="fas fa-briefcase text-primary"></i
                            ></span>
                          </div>
                          <input
                            type="text"
                            class="form-control"
                            th:field="*{position}"
                            placeholder="Ej: Docente de Primaria"
                            required
                          />
                        </div>
                      </div>
                      <div class="form-group">
                        <label class="font-weight-bold"
                          >Tipo Contrato
                          <span class="text-danger">*</span></label
                        >
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text"
                              ><i class="fas fa-file-contract text-primary"></i
                            ></span>
                          </div>
                          <select
                            class="form-control"
                            th:field="*{contractType}"
                          >
                            <option value="FULL_TIME">Tiempo Completo</option>
                            <option value="PART_TIME">Medio Tiempo</option>
                            <option value="HOURLY">Por Hora</option>
                          </select>
                        </div>
                      </div>
                      <div class="form-group row">
                        <div class="col-6">
                          <label class="font-weight-bold"
                            >Fecha Inicio
                            <span class="text-danger">*</span></label
                          >
                          <div class="input-group">
                            <div class="input-group-prepend">
                              <span class="input-group-text"
                                ><i class="fas fa-calendar-alt text-primary"></i
                              ></span>
                            </div>
                            <input
                              type="date"
                              class="form-control"
                              th:field="*{startDate}"
                              required
                            />
                          </div>
                        </div>
                        <div class="col-6">
                          <label class="font-weight-bold border-bottom-0"
                            >Fecha Fin (Opc.)</label
                          >
                          <div class="input-group">
                            <div class="input-group-prepend">
                              <span class="input-group-text"
                                ><i
                                  class="fas fa-calendar-check text-primary"
                                ></i
                              ></span>
                            </div>
                            <input
                              type="date"
                              class="form-control"
                              th:field="*{endDate}"
                            />
                          </div>
                        </div>
                      </div>
                      <div class="form-group">
                        <label class="font-weight-bold"
                          >Salario Base Mensual
                          <span class="text-danger">*</span></label
                        >
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text"
                              ><i class="fas fa-dollar-sign text-primary"></i
                            ></span>
                          </div>
                          <input
                            type="number"
                            step="0.01"
                            class="form-control"
                            th:field="*{salary}"
                            placeholder="0.00"
                            required
                          />
                        </div>
                      </div>
                    </div>
                    <div class="modal-footer justify-content-end">
                      <button
                        type="button"
                        class="btn btn-secondary px-4"
                        data-dismiss="modal"
                      >
                        <i class="fas fa-times mr-1"></i> Cancelar
                      </button>
                      <button
                        type="submit"
                        class="btn btn-primary px-4 shadow-sm ml-2"
                      >
                        <i class="fas fa-save mr-1"></i> Guardar
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
            <!-- Cierre del modal -->
          </div>
          <!-- Cierre del container-fluid -->
        </div>
        <!-- Cierre de #content -->

        <!-- FOOTER: Movido fuera de #content, directamente dentro de #content-wrapper -->
        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
      <!-- Cierre de #content-wrapper -->
    </div>
    <!-- Cierre de #wrapper -->

    <a class="scroll-to-top rounded" href="#page-top"
      ><i class="fas fa-angle-up"></i
    ></a>
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
    <script th:src="@{/vendor/datatables/jquery.dataTables.min.js}"></script>
    <script
      th:src="@{/vendor/datatables/dataTables.bootstrap4.min.js}"
    ></script>
    <script th:src="@{/js/demo/datatables-demo.js}"></script>

    <script>
      (function () {
        "use strict";
        window.addEventListener(
          "load",
          function () {
            var forms = document.getElementsByClassName("needs-validation");
            var validation = Array.prototype.filter.call(
              forms,
              function (form) {
                form.addEventListener(
                  "submit",
                  function (event) {
                    if (form.checkValidity() === false) {
                      event.preventDefault();
                      event.stopPropagation();
                    }
                    form.classList.add("was-validated");
                  },
                  false,
                );
              },
            );
          },
          false,
        );
      })();
    </script>
  </body>
</html>
