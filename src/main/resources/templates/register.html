<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Registro - Sistema de Gestión Escolar</title>

    <!-- Custom fonts -->
    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />

    <!-- Custom styles -->
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>

  <body class="bg-gradient-primary">
    <div class="container">
      <div class="card o-hidden border-0 shadow-lg my-5">
        <div class="card-body p-0">
          <!-- Nested Row within Card Body -->
          <div class="row">
            <div class="col-lg-5 d-none d-lg-block bg-register-image"></div>
            <div class="col-lg-7">
              <div class="p-5">
                <div class="text-center">
                  <h1 class="h4 text-gray-900 mb-4">¡Crear una Cuenta!</h1>
                </div>

                <div
                  th:if="${param.error}"
                  class="alert alert-danger"
                  role="alert"
                >
                  Error al crear la cuenta. Por favor intente nuevamente.
                </div>
                <div
                  th:if="${param.success}"
                  class="alert alert-success"
                  role="alert"
                >
                  Cuenta creada exitosamente. Por favor inicie sesión.
                </div>

                <form class="user" th:action="@{/register}" method="post">
                  <div class="form-group">
                    <select class="form-control form-control-user" name="userType" id="userType" required onchange="toggleFields()">
                      <option value="">Seleccionar Tipo de Usuario</option>
                      <option value="STUDENT">Estudiante</option>
              <body class="bg-gradient-primary" role="main">
                      <option value="TEACHER">Profesor</option>
                  <div class="card o-hidden border-0 shadow-lg my-5" role="region" aria-label="Registro de usuario">
                    </select>
                  </div>
                  
                  <div class="form-group row">
                    <div class="col-sm-6 mb-3 mb-sm-0">
                      <input
                        type="text"
                              <h1 class="h4 text-gray-900 mb-4" role="heading" aria-level="1">¡Crear una Cuenta!</h1>
                        name="firstName"
                        placeholder="Nombre"
                        required
                      />
                    </div>
                    <div class="col-sm-6">
                      <input
                        type="text"
                        class="form-control form-control-user"
                        name="lastName"
                        placeholder="Apellido"
                        required
                      />
                    </div>
                  </div>
                  
                  <div class="form-group row">
                    <div class="col-sm-6 mb-3 mb-sm-0">
                      <input
                                <label for="userType" class="sr-only">Tipo de Usuario</label>
                                <select class="form-control form-control-user" name="userType" id="userType" required aria-required="true" onchange="toggleFields()">
                        class="form-control form-control-user"
                        name="email"
                        placeholder="Correo Electrónico"
                        required
                      />
                    </div>
                    <div class="col-sm-6">
                      <input
                        type="text"
                        class="form-control form-control-user"
                        name="dni"
                        placeholder="DNI"
                        required
                      />
                    </div>
                  </div>
                  
                  <div class="form-group row">
                    <div class="col-sm-6 mb-3 mb-sm-0">
                      <input
                        type="text"
                        class="form-control form-control-user"
                        name="username"
                        placeholder="Usuario"
                        required
                      />
                    </div>
                    <div class="col-sm-6">
                      <input
                        type="text"
                        class="form-control form-control-user"
                        name="phoneNumber"
                        placeholder="Teléfono"
                      />
                    </div>
                  </div>
                  
                  <div class="form-group">
                    <input
                      type="text"
                      class="form-control form-control-user"
                      name="address"
                      placeholder="Dirección"
                    />
                  </div>
                  
                  <div class="form-group" id="relationshipField" style="display: none;">
                    <select class="form-control form-control-user" name="relationship">
                      <option value="">Seleccionar Relación</option>
                      <option value="Padre">Padre</option>
                      <option value="Madre">Madre</option>
                      <option value="Tutor">Tutor</option>
                      <option value="Abuelo">Abuelo</option>
                      <option value="Abuela">Abuela</option>
                      <option value="Tío">Tío</option>
                      <option value="Tía">Tía</option>
                      <option value="Otro">Otro</option>
                    </select>
                  </div>
                  
                  <div class="form-group row">
                    <div class="col-sm-6 mb-3 mb-sm-0">
                      <input
                        type="password"
                        class="form-control form-control-user"
                        name="password"
                        placeholder="Contraseña"
                        required
                      />
                    </div>
                    <div class="col-sm-6">
                      <input
                        type="password"
                        class="form-control form-control-user"
                        name="confirmPassword"
                        placeholder="Repetir Contraseña"
                        required
                      />
                    </div>
                  </div>
                  <button
                    type="submit"
                    class="btn btn-primary btn-user btn-block"
                  >
                    Registrar Cuenta
                  </button>
                </form>
                <hr />
                <div class="text-center">
                  <a class="small" th:href="@{/forgot-password}"
                    >¿Olvidó su Contraseña?</a
                  >
                </div>
                <div class="text-center">
                  <a class="small" th:href="@{/login}"
                    >¿Ya tiene una cuenta? ¡Inicie Sesión!</a
                  >
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap core JavaScript-->
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

    <!-- Core plugin JavaScript-->
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>

    <!-- Custom scripts for all pages-->
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
    
    <script>
      function toggleFields() {
        const userType = document.getElementById('userType').value;
        const relationshipField = document.getElementById('relationshipField');
        
        if (userType === 'PARENT') {
          relationshipField.style.display = 'block';
          relationshipField.querySelector('select').required = true;
        } else {
          relationshipField.style.display = 'none';
          relationshipField.querySelector('select').required = false;
        }
      }
    </script>
  </body>
</html>
