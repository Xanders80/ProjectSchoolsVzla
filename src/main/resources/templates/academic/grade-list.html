<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Calificaciones - Sistema de Gestión Escolar</title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
    <link
      th:href="@{/vendor/datatables/dataTables.bootstrap4.min.css}"
      rel="stylesheet"
    />
  </head>

  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>

      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>

          <div class="container-fluid">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
            >
              <h1 class="h3 mb-0 text-gray-800">
                <i class="fas fa-star mr-2 text-primary"></i>Gestión de
                Calificaciones
              </h1>
              <a
                th:href="@{/grades/new}"
                class="d-none d-sm-inline-block btn btn-sm btn-primary shadow-sm"
              >
                <i class="fas fa-plus fa-sm text-white-50"></i> Agregar
                Calificación
              </a>
            </div>

            <div
              th:if="${success}"
              class="alert alert-success alert-dismissible fade show"
              role="alert"
            >
              <i class="fas fa-check-circle"></i>
              <span th:text="${success}"></span>
              <button
                type="button"
                class="close"
                data-dismiss="alert"
                aria-label="Cerrar"
              >
                <span aria-hidden="true">&times;</span>
              </button>
            </div>

            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Listado de Calificaciones
                </h6>
              </div>
              <div class="card-body">
                <div class="table-responsive">
                  <table
                    class="table table-bordered"
                    id="dataTable"
                    width="100%"
                    cellspacing="0"
                  >
                    <thead>
                      <tr>
                        <th>ID</th>
                        <th>Estudiante</th>
                        <th>Curso</th>
                        <th>Periodo</th>
                        <th>Evaluación</th>
                        <th>Nota</th>
                        <th>Letra</th>
                        <th>Fecha</th>
                        <th>Acciones</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr th:each="grade : ${grades}">
                        <td th:text="${grade.id}">1</td>
                        <td
                          th:text="${(grade.student?.firstName ?: '') + ' ' + (grade.student?.lastName ?: '')}"
                        >
                          Juan Perez
                        </td>
                        <td th:text="${grade.course?.name ?: 'N/A'}">
                          Matemáticas
                        </td>
                        <td th:text="${grade.period?.code ?: 'N/A'}">
                          2025-Q1
                        </td>
                        <td
                          th:text="${grade.evaluationType?.displayName ?: 'N/A'}"
                        >
                          Examen
                        </td>
                        <td th:text="${grade.score ?: '0.0'}">85</td>
                        <td
                          class="font-weight-bold"
                          th:text="${grade.letterGrade}"
                          th:classappend="${grade.letterGrade == 'F' ? 'text-danger' : (grade.letterGrade == 'A' ? 'text-success' : 'text-primary')}"
                        >
                          A
                        </td>
                        <td th:text="${grade.date ?: 'N/A'}">2025-05-20</td>
                        <td>
                          <a
                            th:href="@{/grades/edit/{id}(id=${grade.id})}"
                            class="btn btn-info btn-sm"
                          >
                            <i class="fas fa-edit"></i> Editar
                          </a>
                          <button
                            type="button"
                            class="btn btn-danger btn-sm"
                            data-toggle="modal"
                            data-target="#deleteModal"
                            th:onclick="'confirmDelete(\'' + @{/grades/delete/{id}(id=${grade.id})} + '\')'"
                          >
                            <i class="fas fa-trash"></i> Eliminar
                          </button>
                        </td>
                      </tr>
                      <tr th:if="${#lists.isEmpty(grades)}">
                        <td colspan="8" class="text-center text-muted">
                          No se encontraron calificaciones registradas.
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top"
      ><i class="fas fa-angle-up"></i
    ></a>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
    <script th:src="@{/vendor/datatables/jquery.dataTables.min.js}"></script>
    <script
      th:src="@{/vendor/datatables/dataTables.bootstrap4.min.js}"
    ></script>
    <script th:src="@{/js/demo/datatables-demo.js}"></script>
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>
    <div th:replace="~{fragments/delete-modal :: deleteModal}"></div>
  </body>
</html>
