<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title
      th:text="${studyPlan.id != null ? 'Editar Plan de Estudio' : 'Nuevo Plan de Estudio'}"
    >
      Plan de Estudio
    </title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>

  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>

      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>

          <div class="container-fluid">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
            >
              <h1 class="h3 mb-0 text-gray-800">
                <i class="fas fa-file-contract mr-2 text-primary"></i
                ><span
                  th:text="${studyPlan.id != null ? 'Editar Plan de Estudio' : 'Nuevo Plan de Estudio'}"
                  >Plan</span
                >
              </h1>
              <a th:href="@{/academic/study-plans}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Volver
              </a>
            </div>

            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Información del Plan
                </h6>
              </div>
              <div class="card-body">
                <form
                  th:action="@{/academic/study-plans}"
                  th:object="${studyPlan}"
                  method="post"
                  class="needs-validation"
                  novalidate
                >
                  <input type="hidden" th:field="*{id}" />

                  <div class="row">
                    <div class="col-md-6">
                      <div class="form-group">
                        <label for="name" class="font-weight-bold"
                          >Nombre del Plan
                          <span class="text-danger">*</span></label
                        >
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text"
                              ><i class="fas fa-file-signature"></i
                            ></span>
                          </div>
                          <input
                            type="text"
                            id="name"
                            th:field="*{name}"
                            class="form-control"
                            th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                            placeholder="Ej: Plan Nacional 2026"
                            required
                          />
                          <div
                            class="invalid-feedback"
                            th:if="${#fields.hasErrors('name')}"
                            th:errors="*{name}"
                          >
                            Error
                          </div>
                        </div>
                      </div>
                    </div>
                    <div class="col-md-6">
                      <div class="form-group">
                        <label for="academicLevel" class="font-weight-bold"
                          >Nivel Académico
                          <span class="text-danger">*</span></label
                        >
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text"
                              ><i class="fas fa-graduation-cap"></i
                            ></span>
                          </div>
                          <select
                            id="academicLevel"
                            th:field="*{academicLevel}"
                            class="form-control"
                            th:classappend="${#fields.hasErrors('academicLevel')} ? 'is-invalid' : ''"
                            required
                          >
                            <option value="">Seleccionar Nivel...</option>
                            <option
                              th:each="level : ${academicLevels}"
                              th:value="${level}"
                              th:text="${level.name() + ' (' + level.getDescription() + ')'}"
                            ></option>
                          </select>
                          <div
                            class="invalid-feedback"
                            th:if="${#fields.hasErrors('academicLevel')}"
                            th:errors="*{academicLevel}"
                          >
                            Error
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="form-group">
                    <label for="description" class="font-weight-bold"
                      >Descripción</label
                    >
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text"
                          ><i class="fas fa-align-left"></i
                        ></span>
                      </div>
                      <textarea
                        id="description"
                        th:field="*{description}"
                        class="form-control"
                        rows="3"
                        placeholder="Descripción opcional del plan de estudio"
                      ></textarea>
                    </div>
                  </div>

                  <!-- Configuración de Escala (Solo para nuevos planes) -->
                  <div class="form-group" th:if="${studyPlan.id == null}">
                    <label for="scaleType" class="font-weight-bold"
                      >Configurar Escala de Calificación (Opcional)</label
                    >
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text"
                          ><i class="fas fa-sort-numeric-up"></i
                        ></span>
                      </div>
                      <select
                        id="scaleType"
                        name="scaleType"
                        class="form-control"
                      >
                        <option value="">Sin configurar ahora</option>
                        <option
                          th:each="scaleType : ${scaleTypes}"
                          th:value="${scaleType}"
                          th:text="${scaleType.description}"
                        ></option>
                      </select>
                    </div>
                    <small class="form-text text-muted">
                      <i class="fas fa-info-circle mr-1"></i> Puede configurar
                      la escala después de crear el plan
                    </small>
                  </div>

                  <hr />

                  <div class="form-group text-right">
                    <button
                      type="submit"
                      class="btn btn-primary px-4 shadow-sm"
                    >
                      <i class="fas fa-save mr-1"></i> Guardar Plan
                    </button>
                    <a
                      th:href="@{/academic/study-plans}"
                      class="btn btn-secondary px-4 ml-2"
                    >
                      <i class="fas fa-times mr-1"></i> Cancelar
                    </a>
                  </div>
                </form>
              </div>
            </div>

            <!-- Grading Scales Section (Only in Edit Mode) -->
            <div class="card shadow mb-4" th:if="${studyPlan.id != null}">
              <div
                class="card-header py-3 d-flex flex-row align-items-center justify-content-between"
              >
                <h6 class="m-0 font-weight-bold text-primary">
                  Escalas de Calificación
                </h6>
              </div>
              <div class="card-body">
                <div class="row">
                  <div class="col-md-8">
                    <div class="table-responsive">
                      <table
                        class="table table-bordered"
                        width="100%"
                        cellspacing="0"
                      >
                        <thead>
                          <tr>
                            <th>Etiqueta</th>
                            <th>Min</th>
                            <th>Max</th>
                            <th>Descripción</th>
                            <th>Acción</th>
                          </tr>
                        </thead>
                        <tbody>
                          <tr th:each="scale : ${gradingScales}">
                            <td th:text="${scale.label}">A</td>
                            <td th:text="${scale.minScore}">14.00</td>
                            <td th:text="${scale.maxScore}">17.00</td>
                            <td th:text="${scale.description}">Bueno</td>
                            <td>
                              <form
                                th:action="@{/academic/study-plans/scales/delete/{scaleId}(scaleId=${scale.id})}"
                                method="post"
                                style="display: inline"
                              >
                                <input
                                  type="hidden"
                                  name="studyPlanId"
                                  th:value="${studyPlan.id}"
                                />
                                <button
                                  type="submit"
                                  class="btn btn-sm btn-danger"
                                  onclick="
                                    return confirm(
                                      '¿Seguro de eliminar esta escala?',
                                    );
                                  "
                                >
                                  <i class="fas fa-trash"></i>
                                </button>
                              </form>
                            </td>
                          </tr>
                          <tr th:if="${#lists.isEmpty(gradingScales)}">
                            <td colspan="5" class="text-center text-muted">
                              No hay escalas definidas.
                            </td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                  <div class="col-md-4">
                    <div class="card border-left-success shadow h-100 py-2">
                      <div class="card-body">
                        <h6 class="font-weight-bold text-success mb-3">
                          Agregar Escala
                        </h6>
                        <form
                          th:action="@{/academic/study-plans/{id}/scales(id=${studyPlan.id})}"
                          th:object="${newScale}"
                          method="post"
                          class="needs-validation"
                          novalidate
                        >
                          <div class="form-group">
                            <label class="font-weight-bold"
                              >Etiqueta (Letra)
                              <span class="text-danger">*</span></label
                            >
                            <div class="input-group">
                              <div class="input-group-prepend">
                                <span class="input-group-text"
                                  ><i class="fas fa-font"></i
                                ></span>
                              </div>
                              <input
                                type="text"
                                th:field="*{label}"
                                class="form-control"
                                placeholder="Ej. AD"
                                required
                              />
                            </div>
                          </div>
                          <div class="form-row">
                            <div class="form-group col-md-6">
                              <label class="font-weight-bold"
                                >Min <span class="text-danger">*</span></label
                              >
                              <div class="input-group">
                                <div class="input-group-prepend">
                                  <span class="input-group-text"
                                    ><i class="fas fa-minus"></i
                                  ></span>
                                </div>
                                <input
                                  type="number"
                                  step="0.01"
                                  th:field="*{minScore}"
                                  class="form-control"
                                  placeholder="0.00"
                                  required
                                />
                              </div>
                            </div>
                            <div class="form-group col-md-6">
                              <label class="font-weight-bold"
                                >Max <span class="text-danger">*</span></label
                              >
                              <div class="input-group">
                                <div class="input-group-prepend">
                                  <span class="input-group-text"
                                    ><i class="fas fa-plus"></i
                                  ></span>
                                </div>
                                <input
                                  type="number"
                                  step="0.01"
                                  th:field="*{maxScore}"
                                  class="form-control"
                                  placeholder="20.00"
                                  required
                                />
                              </div>
                            </div>
                          </div>
                          <div class="form-group">
                            <label class="font-weight-bold">Descripción</label>
                            <div class="input-group">
                              <div class="input-group-prepend">
                                <span class="input-group-text"
                                  ><i class="fas fa-quote-left"></i
                                ></span>
                              </div>
                              <input
                                type="text"
                                th:field="*{description}"
                                class="form-control"
                                placeholder="Ej: Sobresaliente"
                              />
                            </div>
                          </div>
                          <button
                            type="submit"
                            class="btn btn-success btn-block shadow-sm"
                          >
                            <i class="fas fa-plus mr-1"></i> Agregar Escala
                          </button>
                        </form>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top"
      ><i class="fas fa-angle-up"></i
    ></a>
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
  </body>
</html>
