<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title th:text="${lesson.title} + ' - LMS'"></title>
    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>
  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>
      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>
          <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
              <h1 class="h3 mb-0 text-gray-800" th:text="${lesson.title}">
                Título de la Lección
              </h1>
              <div>
                <a
                  th:if="${previousLesson != null}"
                  th:href="@{/academic/lms/lesson/{id}(id=${previousLesson.id})}"
                  class="btn btn-secondary mr-2"
                >
                  <i class="fas fa-arrow-left"></i> Anterior
                </a>
                <a
                  th:if="${nextLesson != null}"
                  th:href="@{/academic/lms/lesson/{id}(id=${nextLesson.id})}"
                  class="btn btn-primary"
                >
                  Siguiente <i class="fas fa-arrow-right"></i>
                </a>
              </div>
            </div>

            <div class="row">
              <div class="col-lg-8">
                <div class="card shadow mb-4">
                  <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">
                      Contenido de la Lección
                    </h6>
                  </div>
                  <div class="card-body">
                    <!-- Video Content -->
                    <div th:if="${lesson.videoUrl != null}" class="mb-4">
                      <h5>Video Educativo</h5>
                      <div class="embed-responsive embed-responsive-16by9">
                        <iframe
                          class="embed-responsive-item"
                          th:src="${lesson.videoUrl}"
                          allowfullscreen
                        ></iframe>
                      </div>
                    </div>

                    <!-- Text Content -->
                    <div th:if="${lesson.content != null}" class="mb-4">
                      <h5>Contenido</h5>
                      <div th:utext="${lesson.content}"></div>
                    </div>

                    <!-- PDF Preview -->
                    <div
                      th:if="${lesson.content != null and lesson.content.endsWith('.pdf')}"
                      class="mb-4"
                    >
                      <h5>Documento PDF</h5>
                      <button class="btn btn-info" onclick="openPdfModal()">
                        <i class="fas fa-file-pdf"></i> Ver PDF
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <div class="col-lg-4">
                <div class="card shadow mb-4">
                  <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">
                      Información de la Lección
                    </h6>
                  </div>
                  <div class="card-body">
                    <p>
                      <strong>Módulo:</strong>
                      <span th:text="${lesson.module.name}"></span>
                    </p>
                    <p>
                      <strong>Curso:</strong>
                      <span th:text="${lesson.module.course.name}"></span>
                    </p>
                    <p>
                      <strong>Orden:</strong>
                      <span th:text="${lesson.sortOrder}"></span>
                    </p>
                    <hr />
                    <button
                      class="btn btn-success btn-block"
                      onclick="markAsCompleted()"
                    >
                      <i class="fas fa-check"></i> Marcar como Completado
                    </button>
                    <a
                      th:href="@{/academic/lms/course/{id}(id=${lesson.module.course.id})}"
                      class="btn btn-outline-primary btn-block"
                    >
                      <i class="fas fa-arrow-left"></i> Volver al Curso
                    </a>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- PDF Preview Modal -->
          <div
            class="modal fade"
            id="pdfModal"
            tabindex="-1"
            role="dialog"
            aria-hidden="true"
          >
            <div class="modal-dialog modal-xl" role="document">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title" th:text="${lesson.title}">
                    Vista Previa
                  </h5>
                  <button
                    type="button"
                    class="close"
                    data-dismiss="modal"
                    aria-label="Close"
                  >
                    <span aria-hidden="true">&times;</span>
                  </button>
                </div>
                <div class="modal-body p-0">
                  <iframe
                    id="pdfFrame"
                    th:src="${lesson.content}"
                    width="100%"
                    height="600px"
                    style="border: none"
                  ></iframe>
                </div>
              </div>
            </div>
          </div>

          <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
        </div>
      </div>
    </div>
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
    <script>
      function openPdfModal() {
        $("#pdfModal").modal("show");
      }

      function markAsCompleted() {
        alert(
          "Lección marcada como completada. (Funcionalidad de progreso próximamente)"
        );
      }

      $("#pdfModal").on("hidden.bs.modal", function () {
        $("#pdfFrame").attr("src", "");
      });
    </script>
  </body>
</html>
