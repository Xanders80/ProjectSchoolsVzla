<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Formulario de Curso - Sistema de Gestión Escolar</title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>

  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>

      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>

          <div class="container-fluid">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
            >
              <h1
                class="h3 mb-0 text-gray-800"
                th:text="${course.id != null ? 'Editar Curso' : 'Nuevo Curso'}"
              >
                Curso
              </h1>
              <a th:href="@{/courses}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Volver
              </a>
            </div>

            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Información del Curso
                </h6>
              </div>
              <div class="card-body">
                <form
                  th:action="@{/courses}"
                  th:object="${course}"
                  method="post"
                >
                  <input type="hidden" th:field="*{id}" />

                  <div class="row">
                    <div class="col-md-6">
                      <div class="form-group">
                        <label for="code">Código del Curso</label>
                        <input
                          type="text"
                          class="form-control"
                          th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'"
                          id="code"
                          th:field="*{code}"
                          placeholder="Ej: MATH101"
                          maxlength="10"
                          required
                        />
                        <div
                          class="invalid-feedback"
                          th:if="${#fields.hasErrors('code')}"
                          th:errors="*{code}"
                        ></div>
                      </div>
                    </div>
                    <div class="col-md-6">
                      <div class="form-group">
                        <label for="name">Nombre del Curso</label>
                        <input
                          type="text"
                          class="form-control"
                          th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                          id="name"
                          th:field="*{name}"
                          placeholder="Nombre del curso"
                          maxlength="100"
                          required
                        />
                        <div
                          class="invalid-feedback"
                          th:if="${#fields.hasErrors('name')}"
                          th:errors="*{name}"
                        ></div>
                      </div>
                    </div>
                  </div>

                  <div class="row">
                    <div class="col-md-6">
                      <div class="form-group">
                        <label for="credits">Créditos</label>
                        <input
                          type="number"
                          class="form-control"
                          th:classappend="${#fields.hasErrors('credits')} ? 'is-invalid'"
                          id="credits"
                          th:field="*{credits}"
                          min="1"
                          max="10"
                          required
                        />
                        <div
                          class="invalid-feedback"
                          th:if="${#fields.hasErrors('credits')}"
                          th:errors="*{credits}"
                        ></div>
                      </div>
                    </div>
                    <div class="col-md-6">
                      <div class="form-group">
                        <label for="gradeLevel">Nivel de Grado</label>
                        <input
                          type="number"
                          class="form-control"
                          th:classappend="${#fields.hasErrors('gradeLevel')} ? 'is-invalid'"
                          id="gradeLevel"
                          th:field="*{gradeLevel}"
                          min="1"
                          max="12"
                          required
                        />
                        <div
                          class="invalid-feedback"
                          th:if="${#fields.hasErrors('gradeLevel')}"
                          th:errors="*{gradeLevel}"
                        ></div>
                      </div>
                    </div>
                  </div>

                  <div class="form-group">
                    <label for="description">Descripción</label>
                    <textarea
                      class="form-control"
                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                      id="description"
                      th:field="*{description}"
                      rows="3"
                      maxlength="500"
                      placeholder="Descripción opcional del curso"
                    ></textarea>
                    <div
                      class="invalid-feedback"
                      th:if="${#fields.hasErrors('description')}"
                      th:errors="*{description}"
                    ></div>
                  </div>

                  <button type="submit" class="btn btn-primary">
                    Guardar Curso
                  </button>
                  <a th:href="@{/courses}" class="btn btn-secondary"
                    >Cancelar</a
                  >
                </form>
              </div>
            </div>

            <!-- Course Resources Section (Only in Edit Mode) -->
            <div class="card shadow mb-4" th:if="${course.id != null}">
              <div
                class="card-header py-3 d-flex flex-row align-items-center justify-content-between"
              >
                <h6 class="m-0 font-weight-bold text-primary">
                  Recursos del Curso
                </h6>
              </div>
              <div class="card-body">
                <div class="row">
                  <div class="col-md-8">
                    <div class="table-responsive">
                      <table
                        class="table table-bordered"
                        width="100%"
                        cellspacing="0"
                      >
                        <thead>
                          <tr>
                            <th>Título</th>
                            <th>Tipo</th>
                            <th>Enlace/Info</th>
                            <th>Acción</th>
                          </tr>
                        </thead>
                        <tbody>
                          <tr th:each="resource : ${resources}">
                            <td th:text="${resource.title}">Guía</td>
                            <td th:text="${resource.resourceType}">PDF</td>
                            <td>
                              <a
                                th:href="${resource.url}"
                                target="_blank"
                                th:text="${#strings.abbreviate(resource.url, 40)}"
                                th:if="${resource.resourceType == 'LINK' or #strings.startsWith(resource.url, 'http')}"
                                >Link</a
                              >
                              <span
                                th:text="${resource.url}"
                                th:unless="${resource.resourceType == 'LINK' or #strings.startsWith(resource.url, 'http')}"
                                >Info</span
                              >
                            </td>
                            <td>
                              <form
                                th:action="@{/courses/resources/delete/{resourceId}(resourceId=${resource.id})}"
                                method="post"
                                style="display: inline"
                              >
                                <input
                                  type="hidden"
                                  name="courseId"
                                  th:value="${course.id}"
                                />
                                <button
                                  type="submit"
                                  class="btn btn-sm btn-danger"
                                  onclick="return confirm('¿Seguro de eliminar este recurso?');"
                                >
                                  <i class="fas fa-trash"></i>
                                </button>
                              </form>
                            </td>
                          </tr>
                          <tr th:if="${#lists.isEmpty(resources)}">
                            <td colspan="4" class="text-center text-muted">
                              No hay recursos asignados.
                            </td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                  <div class="col-md-4">
                    <div class="card border-left-info shadow h-100 py-2">
                      <div class="card-body">
                        <h6 class="font-weight-bold text-info mb-3">
                          Agregar Recurso
                        </h6>
                        <form
                          th:action="@{/courses/{id}/resources(id=${course.id})}"
                          th:object="${newResource}"
                          method="post"
                        >
                          <div class="form-group">
                            <label>Título</label>
                            <input
                              type="text"
                              th:field="*{title}"
                              class="form-control"
                              placeholder="Ej. Sílabo 2024"
                              required
                            />
                          </div>
                          <div class="form-group">
                            <label>Tipo</label>
                            <select
                              th:field="*{resourceType}"
                              class="form-control"
                            >
                              <option value="LINK">Enlace Web</option>
                              <option value="PDF">Documento PDF</option>
                              <option value="VIDEO">Video</option>
                              <option value="OTHER">Otro</option>
                            </select>
                          </div>
                          <div class="form-group">
                            <label>URL / Enlace</label>
                            <input
                              type="text"
                              th:field="*{url}"
                              class="form-control"
                              placeholder="https://..."
                              required
                            />
                            <small class="form-text text-muted"
                              >Pegue aquí el enlace al material (Drive, YouTube,
                              etc.)</small
                            >
                          </div>
                          <button type="submit" class="btn btn-info btn-block">
                            <i class="fas fa-plus"></i> Agregar Recurso
                          </button>
                        </form>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>

    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
  </body>
</html>
