<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Formulario de Calificación - Sistema Escolar</title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>

  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>

      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>

          <div class="container-fluid">
            <h1 class="h3 mb-4 text-gray-800">
              <span th:text="${grade.id} ? 'Editar' : 'Nueva'">Nueva</span>
              Calificación
            </h1>

            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Datos de la Evaluación
                </h6>
              </div>
              <div class="card-body">
                <form th:action="@{/grades}" th:object="${grade}" method="post">
                  <input type="hidden" th:field="*{id}" />

                  <div class="form-row">
                    <div class="form-group col-md-6">
                      <label for="student">Estudiante</label>
                      <select
                        class="form-control"
                        th:field="*{student}"
                        required
                      >
                        <option value="">Seleccione un Estudiante</option>
                        <option
                          th:each="st : ${students}"
                          th:value="${st.id}"
                          th:text="${st.firstName + ' ' + st.lastName}"
                        ></option>
                      </select>
                      <div
                        class="text-danger"
                        th:if="${#fields.hasErrors('student')}"
                        th:errors="*{student}"
                      >
                        Err
                      </div>
                    </div>
                    <div class="form-group col-md-6">
                      <label for="course">Curso</label>
                      <select
                        class="form-control"
                        th:field="*{course}"
                        required
                      >
                        <option value="">Seleccione un Curso</option>
                        <option
                          th:each="c : ${courses}"
                          th:value="${c.id}"
                          th:text="${c.name}"
                        ></option>
                      </select>
                      <div
                        class="text-danger"
                        th:if="${#fields.hasErrors('course')}"
                        th:errors="*{course}"
                      >
                        Err
                      </div>
                    </div>
                  </div>

                  <div class="form-row">
                    <div class="form-group col-md-4">
                      <label for="period">Periodo</label>
                      <select
                        class="form-control"
                        th:field="*{period}"
                        required
                      >
                        <option value="">Seleccione Periodo</option>
                        <option
                          th:each="p : ${periods}"
                          th:value="${p.id}"
                          th:text="${p.name}"
                        ></option>
                      </select>
                      <div
                        class="text-danger"
                        th:if="${#fields.hasErrors('period')}"
                        th:errors="*{period}"
                      >
                        Err
                      </div>
                    </div>
                    <div class="form-group col-md-4">
                      <label for="evaluationType">Tipo de Evaluación</label>
                      <select
                        class="form-control"
                        th:field="*{evaluationType}"
                        required
                      >
                        <option value="">Seleccione Tipo</option>
                        <option
                          th:each="type : ${evaluationTypes}"
                          th:value="${type}"
                          th:text="${type.displayName}"
                        ></option>
                      </select>
                      <div
                        class="text-danger"
                        th:if="${#fields.hasErrors('evaluationType')}"
                        th:errors="*{evaluationType}"
                      >
                        Err
                      </div>
                    </div>
                    <div class="form-group col-md-4">
                      <label for="score">Calificación (0-20)</label>
                      <div class="input-group">
                        <input
                          type="number"
                          step="0.1"
                          class="form-control"
                          th:field="*{score}"
                          required
                          min="0"
                          max="20"
                          id="scoreInput"
                          oninput="updateLetterPreview()"
                        />
                        <div class="input-group-append">
                          <span
                            class="input-group-text font-weight-bold"
                            id="letterPreview"
                            >-</span
                          >
                        </div>
                      </div>
                      <div
                        class="text-danger"
                        th:if="${#fields.hasErrors('score')}"
                        th:errors="*{score}"
                      >
                        Err
                      </div>
                    </div>
                  </div>

                  <div class="form-row">
                    <div class="form-group col-md-4">
                      <label for="date">Fecha</label>
                      <input
                        type="date"
                        class="form-control"
                        th:field="*{date}"
                        required
                      />
                      <div
                        class="text-danger"
                        th:if="${#fields.hasErrors('date')}"
                        th:errors="*{date}"
                      >
                        Err
                      </div>
                    </div>
                    <div class="form-group col-md-8">
                      <label for="comments">Comentarios (Opcional)</label>
                      <input
                        type="text"
                        class="form-control"
                        th:field="*{comments}"
                      />
                    </div>
                  </div>

                  <div class="form-group mt-3">
                    <button type="submit" class="btn btn-primary">
                      <i class="fas fa-save"></i> Guardar
                    </button>
                    <a th:href="@{/grades}" class="btn btn-secondary">
                      <i class="fas fa-times"></i> Cancelar
                    </a>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>

        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top"
      ><i class="fas fa-angle-up"></i
    ></a>
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
    <script>
      function updateLetterPreview() {
        const score = parseFloat(document.getElementById("scoreInput").value);
        const preview = document.getElementById("letterPreview");
        let letter = "-";
        if (!isNaN(score)) {
          if (score >= 18) letter = "A";
          else if (score >= 15) letter = "B";
          else if (score >= 12) letter = "C";
          else if (score >= 10) letter = "D";
          else letter = "F";
        }
        preview.textContent = letter;
        preview.className =
          "input-group-text font-weight-bold " +
          (letter === "F" ? "text-danger" : "text-primary");
      }
      document.addEventListener("DOMContentLoaded", updateLetterPreview);
    </script>
  </body>
</html>
