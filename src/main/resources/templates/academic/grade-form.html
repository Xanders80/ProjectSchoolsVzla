<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Formulario de Calificación - Sistema Escolar</title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
    <th:block
      th:replace="~{fragments/select2-scripts :: select2-assets}"
    ></th:block>
  </head>

  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>

      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>

          <div class="container-fluid">
            <h1 class="h3 mb-4 text-gray-800">
              <i class="fas fa-star mr-2 text-primary"></i
              ><span th:text="${grade.id} ? 'Editar' : 'Nueva'">Nueva</span>
              Calificación
            </h1>

            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Datos de la Evaluación
                </h6>
              </div>
              <div class="card-body">
                <form
                  th:action="@{/grades}"
                  th:object="${grade}"
                  method="post"
                  class="needs-validation"
                  novalidate
                >
                  <input type="hidden" th:field="*{id}" />

                  <div class="form-row">
                    <div class="form-group col-md-6">
                      <label for="student" class="font-weight-bold"
                        >Estudiante <span class="text-danger">*</span></label
                      >
                      <div class="input-group">
                        <div class="input-group-prepend">
                          <span class="input-group-text"
                            ><i class="fas fa-user-graduate text-primary"></i
                          ></span>
                        </div>
                        <select
                          class="form-control"
                          th:field="*{student}"
                          required
                        >
                          <option value="">Seleccione un Estudiante</option>
                          <option
                            th:each="st : ${students}"
                            th:value="${st.id}"
                            th:text="${st.firstName + ' ' + st.lastName}"
                          ></option>
                        </select>
                        <div
                          class="invalid-feedback text-danger small mt-1"
                          th:if="${#fields.hasErrors('student')}"
                          th:errors="*{student}"
                        ></div>
                      </div>
                    </div>
                    <div class="form-group col-md-6">
                      <label for="course" class="font-weight-bold"
                        >Curso <span class="text-danger">*</span></label
                      >
                      <div class="input-group">
                        <div class="input-group-prepend">
                          <span class="input-group-text"
                            ><i class="fas fa-book text-primary"></i
                          ></span>
                        </div>
                        <select
                          class="form-control"
                          th:field="*{course}"
                          required
                        >
                          <option value="">Seleccione un Curso</option>
                          <option
                            th:each="c : ${courses}"
                            th:value="${c.id}"
                            th:text="${c.name}"
                          ></option>
                        </select>
                        <div
                          class="invalid-feedback text-danger small mt-1"
                          th:if="${#fields.hasErrors('course')}"
                          th:errors="*{course}"
                        ></div>
                      </div>
                    </div>
                  </div>

                  <div class="form-row">
                    <div class="form-group col-md-4">
                      <label for="period" class="font-weight-bold"
                        >Periodo <span class="text-danger">*</span></label
                      >
                      <div class="input-group">
                        <div class="input-group-prepend">
                          <span class="input-group-text"
                            ><i class="fas fa-calendar-alt text-primary"></i
                          ></span>
                        </div>
                        <select
                          class="form-control"
                          th:field="*{period}"
                          required
                        >
                          <option value="">Seleccione Periodo</option>
                          <option
                            th:each="p : ${periods}"
                            th:value="${p.id}"
                            th:text="${p.name}"
                          ></option>
                        </select>
                        <div
                          class="invalid-feedback text-danger small mt-1"
                          th:if="${#fields.hasErrors('period')}"
                          th:errors="*{period}"
                        ></div>
                      </div>
                    </div>
                    <div class="form-group col-md-4">
                      <label for="evaluationType" class="font-weight-bold"
                        >Tipo de Evaluación
                        <span class="text-danger">*</span></label
                      >
                      <div class="input-group">
                        <div class="input-group-prepend">
                          <span class="input-group-text"
                            ><i class="fas fa-tasks text-primary"></i
                          ></span>
                        </div>
                        <select
                          class="form-control"
                          th:field="*{evaluationType}"
                          required
                        >
                          <option value="">Seleccione Tipo</option>
                          <option
                            th:each="type : ${evaluationTypes}"
                            th:value="${type}"
                            th:text="${type.displayName}"
                          ></option>
                        </select>
                        <div
                          class="invalid-feedback text-danger small mt-1"
                          th:if="${#fields.hasErrors('evaluationType')}"
                          th:errors="*{evaluationType}"
                        ></div>
                      </div>
                    </div>
                    <div class="form-group col-md-4">
                      <label for="score" class="font-weight-bold"
                        >Calificación (0-20)
                        <span class="text-danger">*</span></label
                      >
                      <div class="input-group">
                        <div class="input-group-prepend">
                          <span class="input-group-text"
                            ><i class="fas fa-star text-primary"></i
                          ></span>
                        </div>
                        <input
                          type="number"
                          step="0.1"
                          class="form-control"
                          th:field="*{score}"
                          required
                          min="0"
                          max="20"
                          id="scoreInput"
                          placeholder="0.0"
                          oninput="updateLetterPreview()"
                        />
                        <div class="input-group-append">
                          <span
                            class="input-group-text font-weight-bold"
                            id="letterPreview"
                            >-</span
                          >
                        </div>
                      </div>
                      <div
                        class="invalid-feedback text-danger small mt-1"
                        th:if="${#fields.hasErrors('score')}"
                        th:errors="*{score}"
                      ></div>
                    </div>
                  </div>

                  <div class="form-row">
                    <div class="form-group col-md-4">
                      <label for="date" class="font-weight-bold"
                        >Fecha <span class="text-danger">*</span></label
                      >
                      <div class="input-group">
                        <div class="input-group-prepend">
                          <span class="input-group-text"
                            ><i class="fas fa-calendar-day text-primary"></i
                          ></span>
                        </div>
                        <input
                          type="date"
                          class="form-control"
                          th:field="*{date}"
                          required
                        />
                      </div>
                      <div
                        class="invalid-feedback text-danger small mt-1"
                        th:if="${#fields.hasErrors('date')}"
                        th:errors="*{date}"
                      ></div>
                    </div>
                    <div class="form-group col-md-8">
                      <label for="comments" class="font-weight-bold"
                        >Comentarios (Opcional)</label
                      >
                      <div class="input-group">
                        <div class="input-group-prepend">
                          <span class="input-group-text"
                            ><i class="fas fa-comment text-primary"></i
                          ></span>
                        </div>
                        <input
                          type="text"
                          class="form-control"
                          th:field="*{comments}"
                          placeholder="Observaciones de la evaluación"
                        />
                      </div>
                    </div>
                  </div>

                  <hr />

                  <div class="form-group text-right">
                    <button
                      type="submit"
                      class="btn btn-primary px-4 shadow-sm"
                    >
                      <i class="fas fa-save mr-1"></i> Guardar Calificación
                    </button>
                    <a th:href="@{/grades}" class="btn btn-secondary px-4 ml-2">
                      <i class="fas fa-times mr-1"></i> Cancelar
                    </a>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>

        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top"
      ><i class="fas fa-angle-up"></i
    ></a>
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
    <th:block
      th:replace="~{fragments/select2-scripts :: select2-scripts}"
    ></th:block>
    <script>
      function updateLetterPreview() {
        const score = parseFloat(document.getElementById("scoreInput").value);
        const preview = document.getElementById("letterPreview");
        let letter = "-";
        if (!isNaN(score)) {
          if (score >= 18) letter = "A";
          else if (score >= 15) letter = "B";
          else if (score >= 12) letter = "C";
          else if (score >= 10) letter = "D";
          else letter = "F";
        }
        preview.textContent = letter;
        preview.className =
          "input-group-text font-weight-bold " +
          (letter === "F" ? "text-danger" : "text-primary");
      }
      document.addEventListener("DOMContentLoaded", updateLetterPreview);
    </script>
  </body>
</html>
