<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Formulario de Sección - Sistema de Gestión Escolar</title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>

  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>

      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>

          <div class="container-fluid">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
            >
              <h1 class="h3 mb-0 text-gray-800">
                <i class="fas fa-layer-group mr-2 text-primary"></i
                ><span
                  th:text="${section.id != null ? 'Editar Sección' : 'Nueva Sección'}"
                  >Sección</span
                >
              </h1>
              <a th:href="@{/sections}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Volver
              </a>
            </div>

            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Información de la Sección
                </h6>
              </div>
              <div class="card-body">
                <form
                  th:action="@{/sections}"
                  th:object="${section}"
                  method="post"
                  class="needs-validation"
                  novalidate
                >
                  <!-- CSRF Token -->
                  <input
                    type="hidden"
                    th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}"
                  />
                  <input type="hidden" th:field="*{id}" />

                  <div class="row">
                    <div class="col-md-6">
                      <div class="form-group">
                        <label class="font-weight-bold"
                          >Nombre de la Sección
                          <span class="text-danger">*</span></label
                        >
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text"
                              ><i class="fas fa-users-cog"></i
                            ></span>
                          </div>
                          <input
                            type="text"
                            th:field="*{name}"
                            class="form-control"
                            placeholder="Ej: Grupo A, Sección 1"
                            required
                          />
                        </div>
                      </div>
                    </div>
                    <div class="col-md-6">
                      <div class="form-group">
                        <label class="font-weight-bold"
                          >Periodo Académico
                          <span class="text-danger">*</span></label
                        >
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text"
                              ><i class="fas fa-calendar-alt"></i
                            ></span>
                          </div>
                          <select
                            th:field="*{period.id}"
                            class="form-control"
                            required
                          >
                            <option value="">Seleccionar Periodo</option>
                            <option
                              th:each="p : ${periods}"
                              th:value="${p.id}"
                              th:text="${p.name + ' (' + p.code + ')'}"
                            >
                              Period
                            </option>
                          </select>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="row">
                    <div class="col-md-4">
                      <div class="form-group">
                        <label class="font-weight-bold"
                          >Curso <span class="text-danger">*</span></label
                        >
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text"
                              ><i class="fas fa-book-open"></i
                            ></span>
                          </div>
                          <select
                            th:field="*{course.id}"
                            class="form-control"
                            required
                          >
                            <option value="">Seleccionar Curso</option>
                            <option
                              th:each="course : ${courses}"
                              th:value="${course.id}"
                              th:text="${course.code + ' - ' + course.name}"
                            >
                              Course
                            </option>
                          </select>
                        </div>
                      </div>
                    </div>
                    <div class="col-md-4">
                      <div class="form-group">
                        <label class="font-weight-bold"
                          >Profesor Asignado</label
                        >
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text"
                              ><i class="fas fa-chalkboard-teacher"></i
                            ></span>
                          </div>
                          <select th:field="*{teacher.id}" class="form-control">
                            <option value="">Seleccionar Profesor</option>
                            <option
                              th:each="teacher : ${teachers}"
                              th:value="${teacher.id}"
                              th:text="${teacher.fullName}"
                            >
                              Teacher
                            </option>
                          </select>
                        </div>
                      </div>
                    </div>
                    <div class="col-md-4">
                      <div class="form-group">
                        <label class="font-weight-bold">Aula Asignada</label>
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text"
                              ><i class="fas fa-door-open"></i
                            ></span>
                          </div>
                          <select th:field="*{room.id}" class="form-control">
                            <option value="">Seleccionar Aula</option>
                            <option
                              th:each="room : ${rooms}"
                              th:value="${room.id}"
                              th:text="${room.building?.name + ' - ' + room.roomNumber}"
                            >
                              Room
                            </option>
                          </select>
                        </div>
                      </div>
                    </div>
                  </div>

                  <hr />

                  <div class="form-group text-right">
                    <button
                      type="submit"
                      class="btn btn-primary px-4 shadow-sm"
                    >
                      <i class="fas fa-save mr-1"></i> Guardar Sección
                    </button>
                    <a
                      th:href="@{/sections}"
                      class="btn btn-secondary px-4 ml-2"
                    >
                      <i class="fas fa-times mr-1"></i> Cancelar
                    </a>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>

        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top"
      ><i class="fas fa-angle-up"></i
    ></a>
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>

    <script>
      // Example starter JavaScript for disabling form submissions if there are invalid fields
      (function () {
        "use strict";
        window.addEventListener(
          "load",
          function () {
            // Fetch all the forms we want to apply custom Bootstrap validation styles to
            var forms = document.getElementsByClassName("needs-validation");
            // Loop over them and prevent submission
            var validation = Array.prototype.filter.call(
              forms,
              function (form) {
                form.addEventListener(
                  "submit",
                  function (event) {
                    if (form.checkValidity() === false) {
                      event.preventDefault();
                      event.stopPropagation();
                    }
                    form.classList.add("was-validated");
                  },
                  false,
                );
              },
            );
          },
          false,
        );
      })();
    </script>
  </body>
</html>
