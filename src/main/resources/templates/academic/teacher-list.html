<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Gestión de Docentes - Sistema de Gestión Escolar</title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
    <link
      th:href="@{/vendor/datatables/dataTables.bootstrap4.min.css}"
      rel="stylesheet"
    />
  </head>

  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>
      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>

          <div class="container-fluid">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
            >
              <h1 class="h3 mb-0 text-gray-800">
                <i class="fas fa-chalkboard-teacher mr-2 text-primary"></i
                >Cuerpo Docente
              </h1>
              <a
                th:href="@{/academic/escalafon/dashboard}"
                class="btn btn-info shadow-sm mr-2"
              >
                <i class="fas fa-chart-pie fa-sm text-white-50"></i> Dashboard
                Escalafón
              </a>
              <a
                th:href="@{/staff/new?role=TEACHER}"
                class="btn btn-primary shadow-sm"
                sec:authorize="hasRole('ADMIN')"
              >
                <i class="fas fa-plus fa-sm text-white-50"></i> Nuevo Docente
              </a>
            </div>

            <div
              th:if="${successMessage}"
              class="alert alert-success alert-dismissible fade show"
              role="alert"
            >
              <span th:text="${successMessage}"></span>
              <button
                type="button"
                class="close"
                data-dismiss="alert"
                aria-label="Close"
              >
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div
              th:if="${errorMessage}"
              class="alert alert-danger alert-dismissible fade show"
              role="alert"
            >
              <span th:text="${errorMessage}"></span>
              <button
                type="button"
                class="close"
                data-dismiss="alert"
                aria-label="Close"
              >
                <span aria-hidden="true">&times;</span>
              </button>
            </div>

            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Listado de Profesores
                </h6>
              </div>
              <div class="card-body">
                <div class="table-responsive">
                  <table
                    class="table table-bordered table-hover"
                    id="dataTable"
                    width="100%"
                    cellspacing="0"
                  >
                    <thead class="thead-light">
                      <tr>
                        <th>ID</th>
                        <th>Nombre Completo</th>
                        <th>DNI</th>
                        <th>Departamento</th>
                        <th>Email</th>
                        <th class="text-center">Acciones</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr th:each="teacher : ${teachers.content}">
                        <td th:text="${teacher.id}">1</td>
                        <td th:text="${teacher.getFullName()}">Juan Pérez</td>
                        <td th:text="${teacher.dni}">12345678</td>
                        <td th:text="${teacher.department}">Ciencias</td>
                        <td th:text="${teacher.email}">juan@school.com</td>
                        <td class="text-center">
                          <div class="btn-group">
                            <a
                              th:href="@{/academic/teachers/{id}/profile(id=${teacher.id})}"
                              class="btn btn-sm btn-info"
                              title="Perfil Académico"
                            >
                              <i class="fas fa-user-graduate"></i>
                            </a>
                            <a
                              th:href="@{/staff/edit/{id}(id=${teacher.id})}"
                              class="btn btn-sm btn-warning"
                              title="Editar Datos Personales"
                              sec:authorize="hasRole('ADMIN')"
                            >
                              <i class="fas fa-edit"></i>
                            </a>
                          </div>
                        </td>
                      </tr>
                      <tr th:if="${teachers.empty}">
                        <td colspan="6" class="text-center text-muted py-4">
                          <i
                            class="fas fa-chalkboard-teacher fa-3x mb-3 text-gray-300"
                          ></i>
                          <br />
                          No se encontraron profesores.
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                <!-- Pagination -->
                <div th:if="${teachers.totalPages > 1}" class="mt-3">
                  <nav>
                    <ul class="pagination justify-content-center">
                      <li
                        class="page-item"
                        th:classappend="${teachers.first} ? 'disabled'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/academic/teachers(page=${teachers.number - 1})}"
                          >Anterior</a
                        >
                      </li>
                      <li class="page-item disabled">
                        <a
                          class="page-link"
                          href="#"
                          th:text="${'Página ' + (teachers.number + 1) + ' de ' + teachers.totalPages}"
                        ></a>
                      </li>
                      <li
                        class="page-item"
                        th:classappend="${teachers.last} ? 'disabled'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/academic/teachers(page=${teachers.number + 1})}"
                          >Siguiente</a
                        >
                      </li>
                    </ul>
                  </nav>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top"
      ><i class="fas fa-angle-up"></i
    ></a>
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
    <script th:src="@{/vendor/datatables/jquery.dataTables.min.js}"></script>
    <script
      th:src="@{/vendor/datatables/dataTables.bootstrap4.min.js}"
    ></script>
    <script th:src="@{/js/demo/datatables-demo.js}"></script>
  </body>
</html>
