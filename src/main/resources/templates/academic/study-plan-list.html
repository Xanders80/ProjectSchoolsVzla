<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Planes de Estudio - Sistema de Gestión Escolar</title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
    <link
      th:href="@{/vendor/datatables/dataTables.bootstrap4.min.css}"
      rel="stylesheet"
    />
  </head>

  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>
      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>

          <div class="container-fluid">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
            >
              <h1 class="h3 mb-0 text-gray-800">
                <i class="fas fa-file-contract mr-2 text-primary"></i>Planes de
                Estudio (Mallas Curriculares)
              </h1>
              <a th:href="@{/academic/study-plans/new}" class="btn btn-primary">
                <i class="fas fa-plus"></i> Nuevo Plan
              </a>
            </div>

            <div
              th:if="${successMessage}"
              class="alert alert-success alert-dismissible fade show"
              role="alert"
            >
              <span th:text="${successMessage}"></span>
              <button
                type="button"
                class="close"
                data-dismiss="alert"
                aria-label="Close"
              >
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div
              th:if="${errorMessage}"
              class="alert alert-danger alert-dismissible fade show"
              role="alert"
            >
              <span th:text="${errorMessage}"></span>
              <button
                type="button"
                class="close"
                data-dismiss="alert"
                aria-label="Close"
              >
                <span aria-hidden="true">&times;</span>
              </button>
            </div>

            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Planes Registrados
                </h6>
              </div>
              <div class="card-body">
                <div class="table-responsive">
                  <table
                    class="table table-bordered table-hover"
                    id="dataTable"
                    width="100%"
                    cellspacing="0"
                  >
                    <thead class="thead-light">
                      <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Nivel Académico</th>
                        <th class="text-center">Acciones</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr th:each="plan : ${studyPlans.content}">
                        <td th:text="${plan.id}">1</td>
                        <td th:text="${plan.name}">Plan 2024 Primaria</td>
                        <td>
                          <span
                            class="badge badge-secondary"
                            th:text="${plan.academicLevel}"
                            >PRIMARY</span
                          >
                        </td>
                        <td class="text-center">
                          <div class="btn-group">
                            <a
                              th:href="@{/academic/study-plans/{id}(id=${plan.id})}"
                              class="btn btn-sm btn-primary"
                              title="Ver"
                            >
                              <i class="fas fa-eye"></i>
                            </a>
                            <a
                              th:href="@{/academic/study-plans/edit/{id}(id=${plan.id})}"
                              class="btn btn-sm btn-info"
                              title="Editar"
                            >
                              <i class="fas fa-edit"></i>
                            </a>
                            <button
                              type="button"
                              class="btn btn-sm btn-danger"
                              data-toggle="modal"
                              data-target="#deleteModal"
                              th:onclick="'confirmDelete(\'' + @{/academic/study-plans/delete/{id}(id=${plan.id})} + '\')'"
                              title="Eliminar"
                            >
                              <i class="fas fa-trash"></i>
                            </button>
                          </div>
                        </td>
                      </tr>
                      <tr th:if="${#lists.isEmpty(studyPlans.content)}">
                        <td colspan="4" class="text-center text-muted py-4">
                          <i
                            class="fas fa-file-contract fa-3x mb-3 text-gray-300"
                          ></i>
                          <br />
                          No hay planes de estudio registrados.
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>

    <!-- Scroll to Top Button-->
    <a class="scroll-to-top rounded" href="#page-top">
      <i class="fas fa-angle-up"></i>
    </a>

    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>
    <div th:replace="~{fragments/delete-modal :: deleteModal}"></div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
    <script th:src="@{/vendor/datatables/jquery.dataTables.min.js}"></script>
    <script
      th:src="@{/vendor/datatables/dataTables.bootstrap4.min.js}"
    ></script>
    <script th:src="@{/js/demo/datatables-demo.js}"></script>
  </body>
</html>
