<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Estudiantes - Sistema de Gestión Escolar</title>

    <!-- Custom fonts -->
    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />

    <!-- Custom styles -->
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>

  <body id="page-top">
    <!-- Page Wrapper -->
    <div id="wrapper">
      <!-- Sidebar -->
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>

      <!-- Content Wrapper -->
      <div id="content-wrapper" class="d-flex flex-column">
        <!-- Main Content -->
        <div id="content">
          <!-- Topbar -->
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>

          <!-- Begin Page Content -->
          <div class="container-fluid">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
            >
              <h1 class="h3 mb-0 text-gray-800">
                <i class="fas fa-user-graduate mr-2 text-primary"></i>Lista de
                Estudiantes
              </h1>
              <a th:href="@{/students/new}" class="btn btn-primary">
                <i class="fas fa-plus"></i> Agregar Nuevo Estudiante
              </a>
            </div>

            <div th:if="${successMessage}" class="alert alert-success">
              <span th:text="${successMessage}"></span>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger">
              <span th:text="${errorMessage}"></span>
            </div>

            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Estudiantes del Sistema
                </h6>
              </div>
              <div class="card-body">
                <div class="table-responsive">
                  <table
                    class="table table-bordered table-hover"
                    id="dataTable"
                    width="100%"
                    cellspacing="0"
                  >
                    <thead class="thead-light">
                      <tr>
                        <th>ID</th>
                        <th>Nombre Completo</th>
                        <th>DNI</th>
                        <th>Matrícula</th>
                        <th>Correo Electrónico</th>
                        <th class="text-center">Acciones</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr th:each="student : ${students.content}">
                        <td th:text="${student.id}">1</td>
                        <td th:text="${student.fullName}">John Doe</td>
                        <td th:text="${student.dni}">12345678</td>
                        <td th:text="${student.registrationNumber}">REG001</td>
                        <td th:text="${student.email}">john@example.com</td>
                        <td class="text-center">
                          <div class="btn-group">
                            <a
                              th:href="@{/students/edit/{id}(id=${student.id})}"
                              class="btn btn-sm btn-warning"
                              title="Editar"
                            >
                              <i class="fas fa-edit"></i>
                            </a>
                            <a
                              th:href="@{/health/student/{id}(id=${student.id})}"
                              class="btn btn-sm btn-info"
                              sec:authorize="hasAnyRole('ADMIN', 'DIRECTOR')"
                              title="Salud"
                            >
                              <i class="fas fa-heartbeat"></i>
                            </a>
                            <button
                              type="button"
                              class="btn btn-sm btn-danger"
                              data-toggle="modal"
                              data-target="#deleteModal"
                              th:onclick="'confirmDelete(\'' + @{/students/delete/{id}(id=${student.id})} + '\')'"
                              title="Eliminar"
                            >
                              <i class="fas fa-trash"></i>
                            </button>
                          </div>
                        </td>
                      </tr>
                      <tr th:if="${students.empty}">
                        <td colspan="6" class="text-center text-muted py-4">
                          <i
                            class="fas fa-user-graduate fa-3x mb-3 text-gray-300"
                          ></i>
                          <br />
                          No se encontraron estudiantes.
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                <!-- Pagination -->
                <div
                  th:if="${students.totalPages > 1}"
                  class="d-flex justify-content-center"
                >
                  <nav aria-label="Page navigation">
                    <ul class="pagination">
                      <li
                        class="page-item"
                        th:classappend="${students.number == 0} ? 'disabled'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/students(page=${students.number - 1}, size=10)}"
                          aria-label="Previous"
                        >
                          <span aria-hidden="true">&laquo;</span>
                        </a>
                      </li>
                      <li
                        class="page-item"
                        th:each="i : ${#numbers.sequence(0, students.totalPages - 1)}"
                        th:classappend="${i == students.number} ? 'active'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/students(page=${i}, size=10)}"
                          th:text="${i + 1}"
                        ></a>
                      </li>
                      <li
                        class="page-item"
                        th:classappend="${students.number == students.totalPages - 1} ? 'disabled'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/students(page=${students.number + 1}, size=10)}"
                          aria-label="Next"
                        >
                          <span aria-hidden="true">&raquo;</span>
                        </a>
                      </li>
                    </ul>
                  </nav>
                </div>
              </div>
            </div>
          </div>
          <!-- /.container-fluid -->
        </div>
        <!-- End of Main Content -->

        <!-- Footer -->
        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
      <!-- End of Content Wrapper -->
    </div>
    <!-- End of Page Wrapper -->

    <!-- Scroll to Top Button-->
    <a class="scroll-to-top rounded" href="#page-top">
      <i class="fas fa-angle-up"></i>
    </a>

    <!-- Bootstrap core JavaScript-->
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

    <!-- Core plugin JavaScript-->
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>

    <!-- Custom scripts for all pages-->
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
    <script th:src="@{/vendor/datatables/jquery.dataTables.min.js}"></script>
    <script
      th:src="@{/vendor/datatables/dataTables.bootstrap4.min.js}"
    ></script>
    <script th:src="@{/js/demo/datatables-demo.js}"></script>

    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>
    <div th:replace="~{fragments/delete-modal :: deleteModal}"></div>
  </body>
</html>
