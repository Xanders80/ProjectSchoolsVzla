<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Material Didáctico - Sistema de Gestión Escolar</title>
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet" />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>
  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>
      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>
          <div class="container-fluid">
            <div class="d-sm-flex align-items-center justify-content-between mb-4">
              <h1 class="h3 mb-0 text-gray-800">
                <i class="fas fa-book-open mr-2 text-primary"></i>Material Didáctico
              </h1>
              <a th:href="@{/academic/material-didactico/nuevo}" class="btn btn-primary">
                <i class="fas fa-plus"></i> Agregar Material
              </a>
            </div>
            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">Recursos Didácticos</h6>
              </div>
              <div class="card-body">
                <div class="table-responsive">
                  <table class="table table-bordered table-hover" width="100%" cellspacing="0">
                    <thead class="thead-light">
                      <tr>
                        <th>Título</th>
                        <th>Descripción</th>
                        <th>URL</th>
                        <th class="text-center">Acciones</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr th:each="material : ${materiales}">
                        <td th:text="${material.titulo}">Título</td>
                        <td th:text="${material.descripcion}">Descripción</td>
                        <td><a th:href="${material.url}" target="_blank" th:text="${material.url}">URL</a></td>
                        <td class="text-center">
                          <a th:href="@{/academic/material-didactico/eliminar/{id}(id=${material.id})}" class="btn btn-sm btn-danger">
                            <i class="fas fa-trash"></i>
                          </a>
                        </td>
                      </tr>
                      <tr th:if="${#lists.isEmpty(materiales)}">
                        <td colspan="4" class="text-center text-muted py-4">No hay material didáctico registrado.</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>
    <a class="scroll-to-top rounded" href="#page-top"><i class="fas fa-angle-up"></i></a>
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>
  </body>
</html>
