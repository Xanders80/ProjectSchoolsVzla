<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <title>Mallas Curriculares - Sistema Escolar</title>
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet">
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">
</head>

<body id="page-top">
    <div id="wrapper">
        <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>
        
        <div id="content-wrapper" class="d-flex flex-column">
            <div id="content">
                <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>
                
                <div class="container-fluid">
                    <div class="d-sm-flex align-items-center justify-content-between mb-4">
                        <h1 class="h3 mb-0 text-gray-800">Mallas Curriculares</h1>
                        <a th:href="@{/academic/curriculum/new}" class="btn btn-primary">
                            <i class="fas fa-plus"></i> Nueva Malla
                        </a>
                    </div>

                    <div class="card shadow mb-4">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">Planes de Estudio</h6>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-4" th:each="studyPlan : ${studyPlans}">
                                    <div class="card mb-3">
                                        <div class="card-body">
                                            <h5 class="card-title" th:text="${studyPlan.name}">Plan de Estudio</h5>
                                            <p class="card-text" th:text="${studyPlan.description}">Descripción</p>
                                            <a th:href="@{/academic/curriculum/study-plan/{id}(id=${studyPlan.id})}" 
                                               class="btn btn-info btn-sm">
                                                <i class="fas fa-eye"></i> Ver Malla
                                            </a>
                                            <a th:href="@{/academic/curriculum/new(studyPlanId=${studyPlan.id})}" 
                                               class="btn btn-success btn-sm">
                                                <i class="fas fa-plus"></i> Agregar Grado
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
        </div>
    </div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
</body>
</html>
