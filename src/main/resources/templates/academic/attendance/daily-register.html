<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Registro Diario - [[${section.name}]] - Sistema Escolar</title>
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">
    <style>
        .btn-check {
            position: absolute;
            clip: rect(0,0,0,0);
            pointer-events: none;
        }
        .btn-check:checked + .btn-outline-primary {
            background-color: var(--primary);
            color: #fff;
        }
    </style>
</head>
<body id="page-top">
    <div id="wrapper">
        <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>
        <div id="content-wrapper" class="d-flex flex-column">
            <div id="content">
                <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>
                <div class="container-fluid">
                    <div class="d-sm-flex align-items-center justify-content-between mb-4">
                        <div>
                            <h1 class="h3 mb-0 text-gray-800">
                                <i class="fas fa-clipboard-check mr-2"></i>[[${section.name}]]
                            </h1>
                            <p class="text-muted mb-0">[[${section.course.name}]]</p>
                        </div>
                        <a href="/attendance" class="btn btn-sm btn-secondary shadow-sm">
                            <i class="fas fa-arrow-left fa-sm text-white-50 mr-1"></i> Volver
                        </a>
                    </div>

                    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                        <i class="fas fa-check-circle mr-2"></i><span th:text="${successMessage}"></span>
                        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>

                    <div class="card shadow mb-4">
                        <div class="card-header py-3 bg-white">
                            <form th:action="@{/attendance/section/{id}(id=${section.id})}" method="get" class="form-inline" id="dateForm">
                                <label for="date" class="mr-2 font-weight-bold">Fecha de Registro:</label>
                                <input type="date" class="form-control mr-3" id="date" name="date" th:value="${date}" onchange="document.getElementById('dateForm').submit()">
                                <small class="text-muted">
                                    <i class="fas fa-info-circle mr-1"></i>Cambiar la fecha recargará la lista.
                                </small>
                            </form>
                        </div>
                        <div class="card-body p-0">
                            <form th:action="@{/attendance/save}" method="post">
                                <input type="hidden" name="sectionId" th:value="${section.id}">
                                <input type="hidden" name="date" th:value="${date}">

                                <div class="table-responsive">
                                    <table class="table table-hover table-bordered mb-0">
                                        <thead class="bg-light">
                                            <tr>
                                                <th class="px-4">Estudiante</th>
                                                <th class="text-center" style="width: 40%;">Estado</th>
                                                <th>Notas</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="record : ${attendanceList}">
                                                <td class="px-4 py-3">
                                                    <div class="font-weight-bold text-dark" th:text="${record.student.firstName + ' ' + record.student.lastName}">Nombre</div>
                                                    <div class="small text-muted" th:text="${record.student.registrationNumber}">2023001</div>
                                                </td>
                                                <td class="text-center">
                                                    <div class="btn-group btn-group-toggle" data-toggle="buttons">
                                                        <th:block th:each="status : ${statuses}">
                                                            <label class="btn btn-sm btn-outline-primary" th:classappend="${record.status == status} ? 'active' : ''">
                                                                <input type="radio"
                                                                       th:name="${'student_' + record.student.id}"
                                                                       th:value="${status}"
                                                                       th:checked="${record.status == status}"
                                                                       required> [[${status.displayName}]]
                                                            </label>
                                                        </th:block>
                                                    </div>
                                                </td>
                                                <td class="px-3">
                                                    <input type="text" class="form-control form-control-sm"
                                                           th:name="${'remarks_' + record.student.id}"
                                                           th:value="${record.remarks}"
                                                           placeholder="Observaciones...">
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>

                                <div class="card-footer bg-white py-3 text-right">
                                    <button type="submit" class="btn btn-primary px-5">
                                        <i class="fas fa-save mr-2"></i>Guardar Asistencia
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
        </div>
    </div>
    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fas fa-angle-up"></i>
    </a>
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
</body>
</html>
