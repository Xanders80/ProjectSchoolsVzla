<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Reporte de Asistencia - Sistema Escolar</title>
    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>
  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>
      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>
          <div class="container-fluid">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
            >
              <h1 class="h3 mb-0 text-gray-800">
                <i class="fas fa-chart-pie mr-2"></i>Reporte de Asistencia
              </h1>
              <a href="/attendance" class="btn btn-sm btn-secondary shadow-sm">
                <i class="fas fa-arrow-left fa-sm text-white-50 mr-1"></i>
                Volver
              </a>
            </div>

            <!-- Filters -->
            <div class="card shadow mb-4">
              <div class="card-body">
                <form
                  th:action="@{/attendance/report}"
                  method="get"
                  class="form-row align-items-end"
                >
                  <div class="col-md-4 mb-3">
                    <label for="sectionId" class="font-weight-bold"
                      >Sección</label
                    >
                    <select
                      class="form-control"
                      id="sectionId"
                      name="sectionId"
                      onchange="this.form.submit()"
                    >
                      <option value="" disabled selected>
                        Seleccione una sección...
                      </option>
                      <option
                        th:each="sec : ${sections}"
                        th:value="${sec.id}"
                        th:text="${sec.name}"
                        th:selected="${sec.id == sectionId}"
                      ></option>
                    </select>
                  </div>
                  <div class="col-md-3 mb-3">
                    <label for="month" class="font-weight-bold">Mes</label>
                    <select
                      class="form-control"
                      id="month"
                      name="month"
                      onchange="this.form.submit()"
                    >
                      <option
                        th:each="m : ${months}"
                        th:value="${m.value}"
                        th:text="${m.name}"
                        th:selected="${m.value == month}"
                      ></option>
                    </select>
                  </div>
                  <div class="col-md-2 mb-3">
                    <label for="year" class="font-weight-bold">Año</label>
                    <input
                      type="number"
                      class="form-control"
                      id="year"
                      name="year"
                      th:value="${year}"
                      onchange="this.form.submit()"
                    />
                  </div>
                </form>
              </div>
            </div>

            <div th:if="${sectionId != null}">
              <!-- Summary Cards -->
              <div class="row">
                <div class="col-xl-3 col-md-6 mb-4">
                  <div class="card border-left-success shadow h-100 py-2">
                    <div class="card-body">
                      <div class="row no-gutters align-items-center">
                        <div class="col mr-2">
                          <div
                            class="text-xs font-weight-bold text-success text-uppercase mb-1"
                          >
                            Presentes
                          </div>
                          <div
                            class="h5 mb-0 font-weight-bold text-gray-800"
                            th:text="${totalPresent}"
                          >
                            0
                          </div>
                        </div>
                        <div class="col-auto">
                          <i class="fas fa-check fa-2x text-gray-300"></i>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="col-xl-3 col-md-6 mb-4">
                  <div class="card border-left-warning shadow h-100 py-2">
                    <div class="card-body">
                      <div class="row no-gutters align-items-center">
                        <div class="col mr-2">
                          <div
                            class="text-xs font-weight-bold text-warning text-uppercase mb-1"
                          >
                            Tardanzas
                          </div>
                          <div
                            class="h5 mb-0 font-weight-bold text-gray-800"
                            th:text="${totalLate}"
                          >
                            0
                          </div>
                        </div>
                        <div class="col-auto">
                          <i class="fas fa-clock fa-2x text-gray-300"></i>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="col-xl-3 col-md-6 mb-4">
                  <div class="card border-left-danger shadow h-100 py-2">
                    <div class="card-body">
                      <div class="row no-gutters align-items-center">
                        <div class="col mr-2">
                          <div
                            class="text-xs font-weight-bold text-danger text-uppercase mb-1"
                          >
                            Ausencias
                          </div>
                          <div
                            class="h5 mb-0 font-weight-bold text-gray-800"
                            th:text="${totalAbsent}"
                          >
                            0
                          </div>
                        </div>
                        <div class="col-auto">
                          <i class="fas fa-user-times fa-2x text-gray-300"></i>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="col-xl-3 col-md-6 mb-4">
                  <div class="card border-left-info shadow h-100 py-2">
                    <div class="card-body">
                      <div class="row no-gutters align-items-center">
                        <div class="col mr-2">
                          <div
                            class="text-xs font-weight-bold text-info text-uppercase mb-1"
                          >
                            Justificados
                          </div>
                          <div
                            class="h5 mb-0 font-weight-bold text-gray-800"
                            th:text="${totalExcused}"
                          >
                            0
                          </div>
                        </div>
                        <div class="col-auto">
                          <i class="fas fa-file-alt fa-2x text-gray-300"></i>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Student List -->
              <div class="card shadow mb-4">
                <div class="card-header py-3 bg-white">
                  <h6 class="m-0 font-weight-bold text-primary">
                    Detalle por Estudiante
                  </h6>
                </div>
                <div class="card-body p-0">
                  <div class="table-responsive">
                    <table class="table table-hover table-bordered mb-0">
                      <thead class="bg-light text-dark font-weight-bold">
                        <tr>
                          <th class="px-4">Estudiante</th>
                          <th class="text-center">Presente</th>
                          <th class="text-center">Tarde</th>
                          <th class="text-center">Ausente</th>
                          <th class="text-center">Justificado</th>
                          <th class="text-center">% Asistencia</th>
                          <th class="text-center">Estado</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr th:each="stat : ${studentStats}">
                          <td class="px-4 py-3">
                            <div
                              class="font-weight-bold text-dark"
                              th:text="${stat.studentName}"
                            >
                              Nombre
                            </div>
                          </td>
                          <td
                            class="text-center"
                            th:text="${stat.presentCount}"
                          >
                            0
                          </td>
                          <td class="text-center" th:text="${stat.lateCount}">
                            0
                          </td>
                          <td class="text-center" th:text="${stat.absentCount}">
                            0
                          </td>
                          <td
                            class="text-center"
                            th:text="${stat.excusedCount}"
                          >
                            0
                          </td>
                          <td
                            class="text-center font-weight-bold"
                            th:text="${#numbers.formatDecimal(stat.attendancePercentage, 1, 1) + '%'}"
                          >
                            0%
                          </td>
                          <td class="text-center">
                            <span
                              th:if="${stat.attendancePercentage < 85}"
                              class="badge badge-danger"
                            >
                              <i class="fas fa-exclamation-triangle mr-1"></i
                              >Riesgo
                            </span>
                            <span
                              th:if="${stat.attendancePercentage >= 85}"
                              class="badge badge-success"
                              >Normal</span
                            >
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>
    <a class="scroll-to-top rounded" href="#page-top">
      <i class="fas fa-angle-up"></i>
    </a>
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
  </body>
</html>
