<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Admisiones - Sistema de Gestión Escolar</title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
    <link
      th:href="@{/vendor/datatables/dataTables.bootstrap4.min.css}"
      rel="stylesheet"
    />
  </head>

  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>
      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>

          <div class="container-fluid">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
            >
              <h1 class="h3 mb-0 text-gray-800">
                <i class="fas fa-file-signature mr-2 text-primary"></i>Exámenes
                de Admisión
              </h1>
              <a th:href="@{/academic/admissions/new}" class="btn btn-primary">
                <i class="fas fa-plus"></i> Nuevo Postulante
              </a>
            </div>

            <div
              th:if="${successMessage}"
              class="alert alert-success alert-dismissible fade show"
              role="alert"
            >
              <span th:text="${successMessage}"></span>
              <button
                type="button"
                class="close"
                data-dismiss="alert"
                aria-label="Close"
              >
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div
              th:if="${errorMessage}"
              class="alert alert-danger alert-dismissible fade show"
              role="alert"
            >
              <span th:text="${errorMessage}"></span>
              <button
                type="button"
                class="close"
                data-dismiss="alert"
                aria-label="Close"
              >
                <span aria-hidden="true">&times;</span>
              </button>
            </div>

            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Postulantes Registrados
                </h6>
              </div>
              <div class="card-body">
                <div class="table-responsive">
                  <table
                    class="table table-bordered"
                    id="dataTable"
                    width="100%"
                    cellspacing="0"
                  >
                    <thead>
                      <tr>
                        <th>ID</th>
                        <th>Postulante</th>
                        <th>DNI</th>
                        <th>Fecha Examen</th>
                        <th>Puntaje</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr th:each="exam : ${exams.content}">
                        <td th:text="${exam.id}">1</td>
                        <td th:text="${exam.applicantName}">Juan Pérez</td>
                        <td th:text="${exam.applicantDni}">12345678</td>
                        <td
                          th:text="${#temporals.format(exam.examDate, 'dd/MM/yyyy')}"
                        >
                          01/12/2024
                        </td>
                        <td th:text="${exam.score != null ? exam.score : '-'}">
                          85
                        </td>
                        <td>
                          <span
                            class="badge"
                            th:classappend="${exam.status == 'APPROVED' ? 'badge-success' : (exam.status == 'REJECTED' ? 'badge-danger' : (exam.status == 'ENROLLED' ? 'badge-info' : 'badge-warning'))}"
                            th:text="${exam.status == 'PENDING' ? 'Pendiente' : (exam.status == 'APPROVED' ? 'Aprobado' : (exam.status == 'REJECTED' ? 'Rechazado' : 'Inscrito'))}"
                            >PENDING</span
                          >
                        </td>
                        <td>
                          <!-- Edit button - always visible -->
                          <a
                            th:href="@{/academic/admissions/edit/{id}(id=${exam.id})}"
                            class="btn btn-sm btn-info"
                            title="Editar"
                          >
                            <i class="fas fa-edit"></i>
                          </a>

                          <!-- Approve button - only for PENDING -->
                          <form
                            th:if="${exam.status == 'PENDING'}"
                            th:action="@{/academic/admissions/approve/{id}(id=${exam.id})}"
                            method="post"
                            style="display: inline"
                          >
                            <button
                              type="submit"
                              class="btn btn-sm btn-success"
                              title="Aprobar"
                            >
                              <i class="fas fa-check"></i>
                            </button>
                          </form>

                          <!-- Reject button - only for PENDING -->
                          <form
                            th:if="${exam.status == 'PENDING'}"
                            th:action="@{/academic/admissions/reject/{id}(id=${exam.id})}"
                            method="post"
                            style="display: inline"
                          >
                            <button
                              type="submit"
                              class="btn btn-sm btn-warning"
                              title="Rechazar"
                            >
                              <i class="fas fa-times"></i>
                            </button>
                          </form>

                          <!-- Enroll button - only for APPROVED -->
                          <form
                            th:if="${exam.status == 'APPROVED'}"
                            th:action="@{/academic/admissions/enroll/{id}(id=${exam.id})}"
                            method="post"
                            style="display: inline"
                          >
                            <button
                              type="submit"
                              class="btn btn-sm btn-primary"
                              title="Inscribir"
                            >
                              <i class="fas fa-user-plus"></i> Inscribir
                            </button>
                          </form>

                          <!-- Delete button -->
                          <button
                            type="button"
                            class="btn btn-sm btn-danger"
                            data-toggle="modal"
                            data-target="#deleteModal"
                            th:onclick="'confirmDelete(\\'' + @{/academic/admissions/delete/{id}(id=${exam.id})} + '\\')'"
                            title="Eliminar"
                          >
                            <i class="fas fa-trash"></i>
                          </button>
                        </td>
                      </tr>
                      <tr th:if="${#lists.isEmpty(exams.content)}">
                        <td colspan="7" class="text-center text-muted">
                          No hay postulantes registrados.
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>

    <!-- Scroll to Top Button-->
    <a class="scroll-to-top rounded" href="#page-top">
      <i class="fas fa-angle-up"></i>
    </a>

    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>
    <div th:replace="~{fragments/delete-modal :: deleteModal}"></div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
    <script th:src="@{/vendor/datatables/jquery.dataTables.min.js}"></script>
    <script
      th:src="@{/vendor/datatables/dataTables.bootstrap4.min.js}"
    ></script>
    <script th:src="@{/js/demo/datatables-demo.js}"></script>
  </body>
</html>
