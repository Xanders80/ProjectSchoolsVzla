<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Boletín de Notas - Sistema Escolar</title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />

    <style>
      @media print {
        .no-print {
          display: none;
        }
        .card {
          border: none;
          shadow: none;
        }
      }
    </style>
  </head>

  <body id="page-top">
    <div id="wrapper">
      <div
        th:replace="~{fragments/sb-admin-sidebar :: sidebar}"
        class="no-print"
      ></div>

      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div
            th:replace="~{fragments/sb-admin-topbar :: topbar}"
            class="no-print"
          ></div>

          <div class="container-fluid">
            <!-- Search Section (No Print) -->
            <div class="card shadow mb-4 no-print">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Generar Boletín
                </h6>
              </div>
              <div class="card-body">
                <form
                  method="get"
                  th:action="@{/reports/cards}"
                  class="form-inline"
                >
                  <label class="mr-2">Estudiante:</label>
                  <select
                    name="studentId"
                    class="form-control mr-4 select2-student"
                    required
                  >
                    <option value="">-- Buscar Estudiante --</option>
                    <option
                      th:each="st : ${students}"
                      th:value="${st.id}"
                      th:text="${st.firstName + ' ' + st.lastName}"
                      th:selected="${st.id == (selectedStudent != null ? selectedStudent.id : null)}"
                    ></option>
                  </select>
                  <button type="submit" class="btn btn-primary">
                    <i class="fas fa-search"></i> Generar
                  </button>
                </form>
              </div>
            </div>

            <!-- Report Card Display -->
            <div class="card shadow mb-4" th:if="${selectedStudent != null}">
              <div
                class="card-header py-3 d-flex flex-row align-items-center justify-content-between"
              >
                <h6 class="m-0 font-weight-bold text-primary">
                  Boletín Académico
                </h6>
                <button
                  onclick="window.print()"
                  class="btn btn-sm btn-secondary no-print"
                >
                  <i class="fas fa-print"></i> Imprimir
                </button>
              </div>
              <div class="card-body">
                <div class="text-center mb-4">
                  <h2 class="h4 text-gray-900">
                    Institución Educativa SchoolOne
                  </h2>
                  <h3 class="h5">Informe de Progreso Académico</h3>
                </div>

                <div class="row mb-4">
                  <div class="col-md-6">
                    <strong>Estudiante:</strong>
                    <span
                      th:text="${selectedStudent.firstName + ' ' + selectedStudent.lastName}"
                      >Nombre</span
                    ><br />
                    <strong>Matrícula:</strong>
                    <span th:text="${selectedStudent.registrationNumber}"
                      >12345</span
                    >
                  </div>
                  <div class="col-md-6 text-right">
                    <strong>Fecha de Emisión:</strong>
                    <span
                      th:text="${#temporals.format(#temporals.createNow(), 'dd-MM-yyyy')}"
                    ></span>
                  </div>
                </div>

                <div class="table-responsive">
                  <table
                    class="table table-bordered"
                    width="100%"
                    cellspacing="0"
                  >
                    <thead class="bg-light">
                      <tr>
                        <th>Periodo</th>
                        <th>Curso</th>
                        <th>Evaluación</th>
                        <th>Comentarios</th>
                        <th class="text-right">Calificación</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr th:each="g : ${grades}">
                        <td th:text="${g.term}">2025-1</td>
                        <td th:text="${g.course.name}">Matemáticas</td>
                        <td th:text="${g.evaluationType.displayName}">
                          Examen
                        </td>
                        <td th:text="${g.comments}">-</td>
                        <td class="text-right" th:text="${g.score}">90.5</td>
                      </tr>
                    </tbody>
                    <tfoot class="bg-light font-weight-bold">
                      <tr>
                        <td colspan="4" class="text-right">
                          Promedio General:
                        </td>
                        <td class="text-right" th:text="${average}">85.0</td>
                      </tr>
                    </tfoot>
                  </table>
                </div>

                <div class="mt-5 pt-5 row">
                  <div class="col-md-6 text-center">
                    <hr class="w-50" />
                    <p>Firma del Director</p>
                  </div>
                  <div class="col-md-6 text-center">
                    <hr class="w-50" />
                    <p>Firma del Tutor</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Sidebar must be hidden in print mode, handled by @media print -->
        <div
          th:replace="~{fragments/sb-admin-footer :: footer}"
          class="no-print"
        ></div>
      </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top"
      ><i class="fas fa-angle-up"></i
    ></a>
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
  </body>
</html>
