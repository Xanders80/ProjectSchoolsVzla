<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Inscribir Alumno - Sistema Escolar</title>
    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
    <th:block
      th:replace="~{fragments/select2-scripts :: select2-assets}"
    ></th:block>
  </head>
  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>
      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>
          <div class="container-fluid">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
            >
              <h1 class="h3 mb-0 text-gray-800">
                <i class="fas fa-user-plus mr-2 text-primary"></i>Inscribir
                Alumno
              </h1>
              <a
                th:href="@{/enrollments/section/{id}(id=${section.id})}"
                class="btn btn-secondary"
              >
                <i class="fas fa-arrow-left"></i> Volver a la Lista
              </a>
            </div>

            <div class="row justify-content-center">
              <div class="col-lg-8">
                <div class="card shadow mb-4">
                  <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">
                      Detalles de la Inscripción
                    </h6>
                  </div>
                  <div class="card-body">
                    <div class="alert alert-info">
                      <i class="fas fa-info-circle mr-1 text-primary"></i>
                      Asignando alumno a la sección:
                      <strong th:text="${section.name}">Sección A</strong>
                      <br />
                      <small
                        class="text-muted"
                        th:text="${'Curso: ' + section.course.name + ' | Periodo: ' + section.period.code}"
                      ></small>
                    </div>

                    <form
                      th:action="@{/enrollments}"
                      method="post"
                      class="needs-validation"
                      novalidate
                    >
                      <input
                        type="hidden"
                        name="sectionId"
                        th:value="${section.id}"
                      />

                      <div class="form-group">
                        <label for="studentId" class="font-weight-bold"
                          >Seleccione Estudiante
                          <span class="text-danger">*</span></label
                        >
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text"
                              ><i class="fas fa-user-graduate text-primary"></i
                            ></span>
                          </div>
                          <select
                            class="form-control"
                            name="studentId"
                            id="studentId"
                            required
                          >
                            <option value="">
                              Buscar estudiante por nombre o registro...
                            </option>
                            <option
                              th:each="student : ${students}"
                              th:value="${student.id}"
                              th:text="${student.registrationNumber + ' - ' + student.firstName + ' ' + student.lastName}"
                            ></option>
                          </select>
                        </div>
                        <small class="form-text text-muted">
                          <i class="fas fa-info-circle mr-1 text-primary"></i>
                          Solo estudiantes activos no inscritos en esta sección.
                        </small>
                      </div>

                      <div
                        th:if="${#lists.isEmpty(students)}"
                        class="alert alert-warning"
                      >
                        No hay estudiantes disponibles para inscribir en esta
                        sección.
                      </div>

                      <hr />
                      <div class="form-group text-right">
                        <button
                          type="submit"
                          class="btn btn-primary px-4 shadow-sm"
                        >
                          <i class="fas fa-save mr-1"></i> Inscribir Alumno
                        </button>
                        <a
                          th:href="@{/enrollments/section/{id}(id=${section.id})}"
                          class="btn btn-secondary px-4 ml-2"
                        >
                          <i class="fas fa-times mr-1"></i> Cancelar
                        </a>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
    <th:block
      th:replace="~{fragments/select2-scripts :: select2-scripts}"
    ></th:block>

    <script>
      (function () {
        "use strict";
        window.addEventListener(
          "load",
          function () {
            var forms = document.getElementsByClassName("needs-validation");
            var validation = Array.prototype.filter.call(
              forms,
              function (form) {
                form.addEventListener(
                  "submit",
                  function (event) {
                    if (form.checkValidity() === false) {
                      event.preventDefault();
                      event.stopPropagation();
                    }
                    form.classList.add("was-validated");
                  },
                  false,
                );
              },
            );
          },
          false,
        );
      })();
    </script>
  </body>
</html>
