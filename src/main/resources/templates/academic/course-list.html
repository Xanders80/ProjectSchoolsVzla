<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Cursos - Sistema de Gestión Escolar</title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>

  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>

      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>

          <div class="container-fluid">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
            >
              <h1 class="h3 mb-0 text-gray-800">
                <i class="fas fa-book mr-2 text-primary"></i>Lista de Cursos
              </h1>
              <a th:href="@{/courses/new}" class="btn btn-primary">
                <i class="fas fa-plus"></i> Agregar Nuevo Curso
              </a>
            </div>

            <div th:if="${successMessage}" class="alert alert-success">
              <span th:text="${successMessage}"></span>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger">
              <span th:text="${errorMessage}"></span>
            </div>

            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Cursos del Sistema
                </h6>
              </div>
              <div class="card-body">
                <div class="table-responsive">
                  <table
                    class="table table-bordered table-hover"
                    id="dataTable"
                    width="100%"
                    cellspacing="0"
                  >
                    <thead class="thead-light">
                      <tr>
                        <th>ID</th>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Créditos</th>
                        <th>Hrs/Sem</th>
                        <th>Nivel de Grado</th>
                        <th>Descripción</th>
                        <th class="text-center">Acciones</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr th:each="course : ${courses.content}">
                        <td th:text="${course.id}">1</td>
                        <td th:text="${course.code}">CS101</td>
                        <td th:text="${course.name}">
                          Introduction to Programming
                        </td>
                        <td th:text="${course.credits}">3</td>
                        <td th:text="${course.weeklyHours}">4</td>
                        <td th:text="${course.gradeLevel}">1</td>
                        <td th:text="${course.description}">
                          Basic programming concepts
                        </td>
                        <td class="text-center">
                          <div class="btn-group">
                            <a
                              th:href="@{/courses/edit/{id}(id=${course.id})}"
                              class="btn btn-sm btn-warning"
                              title="Editar"
                            >
                              <i class="fas fa-edit"></i>
                            </a>
                            <button
                              type="button"
                              class="btn btn-sm btn-danger"
                              data-toggle="modal"
                              data-target="#deleteModal"
                              th:onclick="'confirmDelete(\'' + @{/courses/delete/{id}(id=${course.id})} + '\')'"
                              title="Eliminar"
                            >
                              <i class="fas fa-trash"></i>
                            </button>
                          </div>
                        </td>
                      </tr>
                      <tr th:if="${courses.empty}">
                        <td colspan="8" class="text-center text-muted py-4">
                          <i class="fas fa-book fa-3x mb-3 text-gray-300"></i>
                          <br />
                          No se encontraron cursos.
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                <!-- Pagination -->
                <div
                  th:if="${courses.totalPages > 1}"
                  class="d-flex justify-content-center"
                >
                  <nav aria-label="Page navigation">
                    <ul class="pagination">
                      <li
                        class="page-item"
                        th:classappend="${courses.number == 0} ? 'disabled'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/courses(page=${courses.number - 1}, size=10)}"
                          aria-label="Previous"
                        >
                          <span aria-hidden="true">&laquo;</span>
                        </a>
                      </li>
                      <li
                        class="page-item"
                        th:each="i : ${#numbers.sequence(0, courses.totalPages - 1)}"
                        th:classappend="${i == courses.number} ? 'active'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/courses(page=${i}, size=10)}"
                          th:text="${i + 1}"
                        ></a>
                      </li>
                      <li
                        class="page-item"
                        th:classappend="${courses.number == courses.totalPages - 1} ? 'disabled'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/courses(page=${courses.number + 1}, size=10)}"
                          aria-label="Next"
                        >
                          <span aria-hidden="true">&raquo;</span>
                        </a>
                      </li>
                    </ul>
                  </nav>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top"
      ><i class="fas fa-angle-up"></i
    ></a>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
    <script th:src="@{/vendor/datatables/jquery.dataTables.min.js}"></script>
    <script
      th:src="@{/vendor/datatables/dataTables.bootstrap4.min.js}"
    ></script>
    <script th:src="@{/js/demo/datatables-demo.js}"></script>

    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>
    <div th:replace="~{fragments/delete-modal :: deleteModal}"></div>
  </body>
</html>
