<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Secciones - Sistema de Gestión Escolar</title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>

  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>

      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>

          <div class="container-fluid">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
            >
              <h1 class="h3 mb-0 text-gray-800">Gestión de Secciones</h1>
              <a
                th:href="@{/sections/new}"
                class="d-none d-sm-inline-block btn btn-sm btn-primary shadow-sm"
              >
                <i class="fas fa-plus fa-sm text-white-50"></i> Agregar Sección
              </a>
            </div>

            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Lista de Secciones
                </h6>
              </div>
              <div class="card-body">
                <div class="table-responsive">
                  <table
                    class="table table-bordered"
                    width="100%"
                    cellspacing="0"
                  >
                    <thead>
                      <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Periodo</th>
                        <th>Curso</th>
                        <th>Profesor</th>
                        <th>Aula</th>
                        <th>Acciones</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr th:each="section : ${sections.content}">
                        <td th:text="${section.id}">1</td>
                        <td th:text="${section.name}">Grupo A</td>
                        <td th:text="${section.term}">2025-1</td>
                        <td th:text="${section.course?.name}">Curso</td>
                        <td th:text="${section.teacher?.fullName}">Profesor</td>
                        <td
                          th:text="${section.room?.building?.name + ' - ' + section.room?.roomNumber}"
                        >
                          Aula
                        </td>
                        <td>
                          <a
                            th:href="@{/sections/edit/{id}(id=${section.id})}"
                            class="btn btn-info btn-sm"
                          >
                            <i class="fas fa-edit"></i> Editar
                          </a>
                          <a
                            href="#"
                            class="btn btn-danger btn-sm delete-btn"
                            data-toggle="modal"
                            data-target="#deleteModal"
                            th:data-url="@{/sections/delete/{id}(id=${section.id})}"
                          >
                            <i class="fas fa-trash"></i> Eliminar
                          </a>
                        </td>
                      </tr>
                      <tr th:if="${sections.empty}">
                        <td colspan="7" class="text-center text-muted">
                          No se encontraron secciones.
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                <!-- Pagination -->
                <div
                  th:if="${sections.totalPages > 1}"
                  class="d-flex justify-content-center mt-4"
                >
                  <nav aria-label="Page navigation">
                    <ul class="pagination">
                      <li
                        class="page-item"
                        th:classappend="${sections.first} ? 'disabled'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/sections(page=${sections.number - 1}, size=${sections.size})}"
                          >Anterior</a
                        >
                      </li>
                      <li class="page-item disabled">
                        <span
                          class="page-link"
                          th:text="'Página ' + ${sections.number + 1} + ' de ' + ${sections.totalPages}"
                        ></span>
                      </li>
                      <li
                        class="page-item"
                        th:classappend="${sections.last} ? 'disabled'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/sections(page=${sections.number + 1}, size=${sections.size})}"
                          >Siguiente</a
                        >
                      </li>
                    </ul>
                  </nav>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top"
      ><i class="fas fa-angle-up"></i
    ></a>
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>
    <div th:replace="~{fragments/delete-modal :: deleteModal}"></div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>

    <script>
      $(document).ready(function () {
        $(".delete-btn").on("click", function () {
          var deleteUrl = $(this).data("url");
          $("#deleteForm").attr("action", deleteUrl);
        });
      });
    </script>
  </body>
</html>
