<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Configuración - Sistema de Gestión Escolar</title>

    <!-- Custom fonts -->
    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />

    <!-- Custom styles -->
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>

  <body id="page-top" role="main">
    <!-- Page Wrapper -->
    <div id="wrapper" role="region" aria-label="Contenedor principal">
      <!-- Sidebar -->
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>

      <!-- Content Wrapper -->
      <div
        id="content-wrapper"
        class="d-flex flex-column"
        role="region"
        aria-label="Contenido principal"
      >
        <!-- Main Content -->
        <div id="content" tabindex="-1">
          <!-- Topbar -->
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>

          <!-- Begin Page Content -->
          <div class="container-fluid" role="main">
            <!-- Page Heading -->
            <h1 class="h3 mb-4 text-gray-800" role="heading" aria-level="1">
              Configuración
            </h1>

            <div
              th:if="${success}"
              class="alert alert-success alert-dismissible fade show"
              role="alert"
            >
              <span th:text="${success}"></span>
              <button
                type="button"
                class="close"
                data-dismiss="alert"
                aria-label="Close"
              >
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div
              th:if="${error}"
              class="alert alert-danger alert-dismissible fade show"
              role="alert"
            >
              <span th:text="${error}"></span>
              <button
                type="button"
                class="close"
                data-dismiss="alert"
                aria-label="Close"
              >
                <span aria-hidden="true">&times;</span>
              </button>
            </div>

            <div class="row">
              <div class="col-lg-6">
                <!-- Change Password Card -->
                <div class="card shadow mb-4">
                  <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">
                      Cambiar Contraseña
                    </h6>
                  </div>
                  <div class="card-body">
                    <form
                      th:action="@{/settings/change-password}"
                      method="post"
                      class="needs-validation"
                      novalidate
                    >
                      <div class="form-group">
                        <label class="font-weight-bold"
                          >Contraseña Actual
                          <span class="text-danger">*</span>
                        </label>
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text"
                              ><i class="fas fa-lock-open text-warning"></i
                            ></span>
                          </div>
                          <input
                            type="password"
                            class="form-control"
                            name="currentPassword"
                            required
                            placeholder="Ingrese contraseña actual"
                            minlength="8"
                            maxlength="128"
                          />
                          <div class="invalid-feedback">
                            La contraseña actual es obligatoria.
                          </div>
                        </div>
                      </div>
                      <div class="form-group">
                        <label class="font-weight-bold"
                          >Nueva Contraseña
                          <span class="text-danger">*</span>
                        </label>
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text"
                              ><i class="fas fa-key text-primary"></i
                            ></span>
                          </div>
                          <input
                            type="password"
                            class="form-control"
                            name="newPassword"
                            required
                            placeholder="Mínimo 8 caracteres"
                            minlength="8"
                            maxlength="128"
                          />
                          <div class="invalid-feedback">
                            La nueva contraseña es obligatoria y debe tener al
                            menos 8 caracteres.
                          </div>
                        </div>
                      </div>
                      <div class="form-group">
                        <label class="font-weight-bold"
                          >Confirmar Nueva Contraseña
                          <span class="text-danger">*</span>
                        </label>
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text"
                              ><i class="fas fa-check-double text-primary"></i
                            ></span>
                          </div>
                          <input
                            type="password"
                            class="form-control"
                            name="confirmPassword"
                            required
                            placeholder="Repita la nueva contraseña"
                            minlength="8"
                            maxlength="128"
                          />
                          <div class="invalid-feedback">
                            Debe confirmar la nueva contraseña.
                          </div>
                        </div>
                      </div>
                      <button
                        type="submit"
                        class="btn btn-warning btn-block shadow-sm font-weight-bold"
                      >
                        <i class="fas fa-sync-alt mr-1"></i> Actualizar
                        Contraseña
                      </button>
                    </form>
                  </div>
                </div>
              </div>

              <div class="col-lg-6">
                <!-- Account Settings Card -->
                <div class="card shadow mb-4">
                  <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">
                      Configuración de Cuenta
                    </h6>
                  </div>
                  <div class="card-body">
                    <form
                      th:action="@{/settings/account}"
                      method="post"
                      class="needs-validation"
                      novalidate
                    >
                      <div class="form-group">
                        <label class="font-weight-bold"
                          >Idioma de la Interfaz
                          <span class="text-danger">*</span>
                        </label>
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text"
                              ><i class="fas fa-globe-americas text-primary"></i
                            ></span>
                          </div>
                          <select class="form-control" name="language" required>
                            <option
                              value="es"
                              th:selected="${userLanguage == 'es'}"
                            >
                              Español
                            </option>
                            <option
                              value="en"
                              th:selected="${userLanguage == 'en'}"
                            >
                              English
                            </option>
                            <option
                              value="pt"
                              th:selected="${userLanguage == 'pt'}"
                            >
                              Português
                            </option>
                          </select>
                          <div class="invalid-feedback">
                            Seleccione un idioma.
                          </div>
                        </div>
                      </div>

                      <div class="form-group">
                        <label class="font-weight-bold"
                          >Formato de Fecha
                          <span class="text-danger">*</span>
                        </label>
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text"
                              ><i class="fas fa-calendar text-primary"></i
                            ></span>
                          </div>
                          <select
                            class="form-control"
                            name="dateFormat"
                            required
                          >
                            <option
                              value="dd/MM/yyyy"
                              th:selected="${userDateFormat == 'dd/MM/yyyy'}"
                            >
                              Día/Mes/Año (01/12/2026)
                            </option>
                            <option
                              value="MM/dd/yyyy"
                              th:selected="${userDateFormat == 'MM/dd/yyyy'}"
                            >
                              Mes/Día/Año (12/01/2026)
                            </option>
                            <option
                              value="yyyy-MM-dd"
                              th:selected="${userDateFormat == 'yyyy-MM-dd'}"
                            >
                              Año-Mes-Día (2026-12-01)
                            </option>
                          </select>
                          <div class="invalid-feedback">
                            Seleccione un formato de fecha.
                          </div>
                        </div>
                      </div>

                      <div class="form-group">
                        <label class="font-weight-bold"
                          >Tema Visual
                          <span class="text-danger">*</span>
                        </label>
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text"
                              ><i class="fas fa-palette text-primary"></i
                            ></span>
                          </div>
                          <select class="form-control" name="theme" required>
                            <option
                              value="light"
                              th:selected="${userTheme == 'light'}"
                            >
                              Claro
                            </option>
                            <option
                              value="dark"
                              th:selected="${userTheme == 'dark'}"
                            >
                              Oscuro
                            </option>
                            <option
                              value="auto"
                              th:selected="${userTheme == 'auto'}"
                            >
                              Sistema
                            </option>
                          </select>
                          <div class="invalid-feedback">
                            Seleccione un tema visual.
                          </div>
                        </div>
                      </div>

                      <div class="form-group form-check">
                        <input
                          type="checkbox"
                          class="form-check-input"
                          id="notificationsEnabled"
                          name="notificationsEnabled"
                          th:checked="${userNotificationsEnabled}"
                        />
                        <label
                          class="form-check-label font-weight-bold"
                          for="notificationsEnabled"
                        >
                          Habilitar Notificaciones
                        </label>
                      </div>

                      <div class="form-group form-check">
                        <input
                          type="checkbox"
                          class="form-check-input"
                          id="twoFactorAuth"
                          name="twoFactorAuth"
                          th:checked="${userTwoFactorAuthEnabled}"
                        />
                        <label
                          class="form-check-label font-weight-bold"
                          for="twoFactorAuth"
                        >
                          Autenticación de Dos Factores
                        </label>
                      </div>

                      <button
                        type="submit"
                        class="btn btn-primary btn-block shadow-sm font-weight-bold"
                      >
                        <i class="fas fa-save mr-1"></i> Guardar Configuración
                      </button>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <!-- /.container-fluid -->
        </div>
        <!-- End of Main Content -->

        <!-- Footer -->
        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
      <!-- End of Content Wrapper -->
    </div>
    <!-- End of Page Wrapper -->

    <!-- Scroll to Top Button-->
    <a class="scroll-to-top rounded" href="#page-top">
      <i class="fas fa-angle-up"></i>
    </a>

    <!-- Logout Modal-->
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>

    <!-- Bootstrap core JavaScript-->
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

    <!-- Core plugin JavaScript-->
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>

    <!-- Custom scripts for all pages-->
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
    <script>
      (function () {
        "use strict";
        window.addEventListener(
          "load",
          function () {
            var forms = document.getElementsByClassName("needs-validation");
            var validation = Array.prototype.filter.call(
              forms,
              function (form) {
                form.addEventListener(
                  "submit",
                  function (event) {
                    if (form.checkValidity() === false) {
                      event.preventDefault();
                      event.stopPropagation();
                    }
                    form.classList.add("was-validated");
                  },
                  false,
                );
              },
            );
          },
          false,
        );
      })();
    </script>
  </body>
</html>
