<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Registrar Pago - Sistema Escolar</title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>

  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>

      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>

          <div class="container-fluid">
            <h1 class="h3 mb-4 text-gray-800">
              <i class="fas fa-money-bill-wave mr-2 text-primary"></i>Registrar
              Pago
            </h1>

            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Información del Cobro
                </h6>
              </div>
              <div class="card-body">
                <p>
                  <strong>Estudiante:</strong>
                  <span
                    th:text="${fee.student.firstName + ' ' + fee.student.lastName}"
                    >Name</span
                  >
                </p>
                <p>
                  <strong>Concepto:</strong>
                  <span th:text="${fee.description}">Desc</span>
                </p>
                <p>
                  <strong>Total:</strong> $<span th:text="${fee.amount}"
                    >100</span
                  >
                </p>
                <p>
                  <strong>Estado Actual:</strong>
                  <span th:text="${fee.status.displayName}">PENDING</span>
                </p>
              </div>
            </div>

            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Detalles del Pago
                </h6>
              </div>
              <div class="card-body">
                <form
                  th:action="@{/finance/payments}"
                  th:object="${payment}"
                  method="post"
                  class="needs-validation"
                  novalidate
                >
                  <!-- Helper hidden field to bind fee ID -->
                  <input
                    type="hidden"
                    name="studentFee.id"
                    th:value="${fee.id}"
                  />

                  <div class="form-row">
                    <div class="form-group col-md-4">
                      <label for="amount" class="font-weight-bold"
                        >Monto a Pagar ($)
                        <span class="text-danger">*</span></label
                      >
                      <div class="input-group">
                        <div class="input-group-prepend">
                          <span class="input-group-text"
                            ><i class="fas fa-hand-holding-usd"></i
                          ></span>
                        </div>
                        <input
                          type="number"
                          step="0.01"
                          class="form-control"
                          th:field="*{amount}"
                          required
                          min="0.01"
                          placeholder="0.00"
                        />
                      </div>
                    </div>
                    <div class="form-group col-md-4">
                      <label for="paymentDate" class="font-weight-bold"
                        >Fecha <span class="text-danger">*</span></label
                      >
                      <div class="input-group">
                        <div class="input-group-prepend">
                          <span class="input-group-text"
                            ><i class="fas fa-calendar-day"></i
                          ></span>
                        </div>
                        <input
                          type="date"
                          class="form-control"
                          th:field="*{paymentDate}"
                          required
                        />
                      </div>
                    </div>
                    <div class="form-group col-md-4">
                      <label for="method" class="font-weight-bold"
                        >Método de Pago
                        <span class="text-danger">*</span></label
                      >
                      <div class="input-group">
                        <div class="input-group-prepend">
                          <span class="input-group-text"
                            ><i class="fas fa-credit-card"></i
                          ></span>
                        </div>
                        <select
                          class="form-control"
                          th:field="*{method}"
                          required
                        >
                          <option value="">Seleccione Método</option>
                          <option
                            th:each="m : ${paymentMethods}"
                            th:value="${m}"
                            th:text="${m.displayName}"
                          ></option>
                        </select>
                      </div>
                    </div>
                  </div>

                  <hr />

                  <div class="form-group text-right">
                    <button
                      type="submit"
                      class="btn btn-primary px-4 shadow-sm"
                    >
                      <i class="fas fa-check-circle mr-1"></i> Registrar Pago
                    </button>
                    <a
                      th:href="@{/finance/fees}"
                      class="btn btn-secondary px-4 ml-2"
                    >
                      <i class="fas fa-times mr-1"></i> Cancelar
                    </a>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>

        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top"
      ><i class="fas fa-angle-up"></i
    ></a>
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>

    <script>
      (function () {
        "use strict";
        window.addEventListener(
          "load",
          function () {
            var forms = document.getElementsByClassName("needs-validation");
            var validation = Array.prototype.filter.call(
              forms,
              function (form) {
                form.addEventListener(
                  "submit",
                  function (event) {
                    if (form.checkValidity() === false) {
                      event.preventDefault();
                      event.stopPropagation();
                    }
                    form.classList.add("was-validated");
                  },
                  false,
                );
              },
            );
          },
          false,
        );
      })();
    </script>
  </body>
</html>
