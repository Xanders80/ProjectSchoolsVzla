<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Nuevo Cobro - Sistema Escolar</title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>

  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>

      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>

          <div class="container-fluid">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
            >
              <h1
                class="h3 mb-0 text-gray-800"
                th:text="${fee.id != null ? 'Editar Cobro' : 'Nuevo Cobro'}"
              >
                Cobro
              </h1>
              <a th:href="@{/finance/fees}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Volver
              </a>
            </div>

            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Información del Cobro
                </h6>
              </div>
              <div class="card-body">
                <form
                  th:action="@{/finance/fees}"
                  th:object="${fee}"
                  method="post"
                >
                  <!-- CSRF Token -->
                  <input
                    type="hidden"
                    th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}"
                  />

                  <input type="hidden" th:field="*{id}" />
                  <div class="form-row">
                    <div class="form-group col-md-6">
                      <label for="student">Estudiante</label>
                      <select
                        class="form-control select2-student"
                        th:field="*{student}"
                        required
                      >
                        <option value="">Seleccione un Estudiante</option>
                        <option
                          th:each="st : ${students}"
                          th:value="${st.id}"
                          th:text="${st.firstName + ' ' + st.lastName}"
                        ></option>
                      </select>
                    </div>
                    <div class="form-group col-md-6">
                      <label for="description">Concepto / Descripción</label>
                      <input
                        type="text"
                        class="form-control"
                        th:field="*{description}"
                        placeholder="Ej: Mensualidad Abril 2025"
                        required
                      />
                    </div>
                  </div>

                  <div class="form-row">
                    <div class="form-group col-md-6">
                      <label for="amount">Monto ($)</label>
                      <input
                        type="number"
                        step="0.01"
                        class="form-control"
                        th:field="*{amount}"
                        required
                        min="0.01"
                      />
                    </div>
                    <div class="form-group col-md-6">
                      <label for="dueDate">Fecha de Vencimiento</label>
                      <input
                        type="date"
                        class="form-control"
                        th:field="*{dueDate}"
                        required
                      />
                    </div>
                  </div>

                  <!-- Status defaults to PENDING in backend/constructor, so hidden here if not editing -->

                  <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Guardar Cobro
                  </button>
                  <a th:href="@{/finance/fees}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Cancelar
                  </a>
                </form>
              </div>
            </div>
          </div>
        </div>

        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top"
      ><i class="fas fa-angle-up"></i
    ></a>
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
  </body>
</html>
