<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Formulario de Rol - Sistema de Gestión Escolar</title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>

  <body id="page-top" role="main">
    <div id="wrapper" role="region" aria-label="Contenedor principal">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>

      <div
        id="content-wrapper"
        class="d-flex flex-column"
        role="region"
        aria-label="Contenido principal"
      >
        <div id="content" tabindex="-1">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>

          <div class="container-fluid" role="main">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
              role="heading"
              aria-level="1"
            >
              <h1 class="h3 mb-0 text-gray-800">
                <i class="fas fa-user-shield mr-2 text-primary"></i
                ><span th:text="${isEdit} ? 'Editar Rol' : 'Crear Nuevo Rol'"
                  >Rol</span
                >
              </h1>
              <a
                th:href="@{/admin/roles}"
                class="btn btn-secondary"
                aria-label="Volver"
              >
                <i class="fas fa-arrow-left" aria-hidden="true"></i> Volver
              </a>
            </div>

            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Información del Rol
                </h6>
              </div>
              <div class="card-body">
                <form
                  th:action="${isEdit} ? @{/admin/roles/edit/{id}(id=${role.id})} : @{/admin/roles}"
                  th:object="${role}"
                  method="post"
                  class="needs-validation"
                  novalidate
                >
                  <input type="hidden" th:field="*{id}" />

                  <div class="form-group">
                    <label for="name" class="font-weight-bold"
                      >Nombre del Rol <span class="text-danger">*</span></label
                    >
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text"
                          ><i class="fas fa-tag"></i
                        ></span>
                      </div>
                      <input
                        type="text"
                        class="form-control"
                        id="name"
                        th:field="*{name}"
                        th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                        placeholder="Ej: ADMIN_ACADEMICO"
                        required
                      />
                      <div
                        class="invalid-feedback"
                        th:if="${#fields.hasErrors('name')}"
                        th:errors="*{name}"
                      ></div>
                    </div>
                  </div>

                  <div class="form-group">
                    <label for="description" class="font-weight-bold"
                      >Descripción</label
                    >
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text"
                          ><i class="fas fa-align-left"></i
                        ></span>
                      </div>
                      <textarea
                        class="form-control"
                        id="description"
                        th:field="*{description}"
                        rows="3"
                        placeholder="Describa el propósito de este rol..."
                      ></textarea>
                    </div>
                  </div>

                  <div class="form-group">
                    <div class="custom-control custom-checkbox">
                      <input
                        class="custom-control-input"
                        type="checkbox"
                        id="enabled"
                        th:field="*{enabled}"
                      />
                      <label
                        class="custom-control-label font-weight-bold"
                        for="enabled"
                      >
                        Rol Habilitado
                      </label>
                    </div>
                  </div>

                  <hr />

                  <div class="form-group text-right">
                    <button
                      type="submit"
                      class="btn btn-primary px-4 shadow-sm"
                    >
                      <i class="fas fa-save mr-1"></i>
                      <span
                        th:text="${isEdit} ? 'Actualizar Rol' : 'Crear Rol'"
                      ></span>
                    </button>
                    <a
                      th:href="@{/admin/roles}"
                      class="btn btn-secondary px-4 ml-2"
                    >
                      <i class="fas fa-times mr-1"></i> Cancelar
                    </a>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>

        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top">
      <i class="fas fa-angle-up"></i>
    </a>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
  </body>
</html>
