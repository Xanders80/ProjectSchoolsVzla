<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Formulario de Rol - Sistema de Gestión Escolar</title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>

  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>

      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>

          <div class="container-fluid">
            <h1
              class="h3 mb-4 text-gray-800"
              th:text="${isEdit} ? 'Editar Rol' : 'Crear Nuevo Rol'"
            ></h1>

            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Información del Rol
                </h6>
              </div>
              <div class="card-body">
                <form
                  th:action="${isEdit} ? @{/admin/roles/edit/{id}(id=${role.id})} : @{/admin/roles}"
                  th:object="${role}"
                  method="post"
                >
                  <input type="hidden" th:field="*{id}" />

                  <div class="form-group">
                    <label for="name">Nombre del Rol:</label>
                    <input
                      type="text"
                      class="form-control"
                      id="name"
                      th:field="*{name}"
                      required
                    />
                  </div>

                  <div class="form-group">
                    <label for="description">Descripción:</label>
                    <textarea
                      class="form-control"
                      id="description"
                      th:field="*{description}"
                      rows="3"
                    ></textarea>
                  </div>

                  <div class="form-group">
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        id="enabled"
                        th:field="*{enabled}"
                      />
                      <label class="form-check-label" for="enabled">
                        Habilitado
                      </label>
                    </div>
                  </div>

                  <div class="form-group">
                    <button type="submit" class="btn btn-primary">
                      <i class="fas fa-save"></i>
                      <span
                        th:text="${isEdit} ? 'Actualizar Rol' : 'Crear Rol'"
                      ></span>
                    </button>
                    <a th:href="@{/admin/roles}" class="btn btn-secondary ml-2">
                      <i class="fas fa-arrow-left"></i> Cancelar
                    </a>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>

        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top">
      <i class="fas fa-angle-up"></i>
    </a>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
  </body>
</html>
