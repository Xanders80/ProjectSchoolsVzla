<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Formulario de Usuario - Sistema de Gestión Escolar</title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
    <th:block
      th:replace="~{fragments/select2-scripts :: select2-assets}"
    ></th:block>
  </head>

  <body id="page-top" role="main">
    <div id="wrapper" role="region" aria-label="Contenedor principal">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>

      <div
        id="content-wrapper"
        class="d-flex flex-column"
        role="region"
        aria-label="Contenido principal"
      >
        <div id="content" tabindex="-1">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>

          <div class="container-fluid" role="main">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
              role="heading"
              aria-level="1"
            >
              <h1 class="h3 mb-0 text-gray-800">
                <i class="fas fa-user-cog mr-2 text-primary"></i
                ><span
                  th:text="${user.id != null ? 'Editar Usuario' : 'Nuevo Usuario'}"
                  >Usuario</span
                >
              </h1>
              <a
                th:href="@{/admin/users}"
                class="btn btn-secondary"
                aria-label="Volver"
              >
                <i class="fas fa-arrow-left" aria-hidden="true"></i> Volver
              </a>
            </div>

            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Información del Usuario
                </h6>
              </div>
              <div class="card-body">
                <form
                  th:action="@{/admin/users}"
                  th:object="${user}"
                  method="post"
                  class="needs-validation"
                  novalidate
                >
                  <input type="hidden" th:field="*{id}" />

                  <div class="row">
                    <div class="col-md-12">
                      <div class="form-group">
                        <label for="username" class="font-weight-bold"
                          >Nombre de Usuario
                          <span class="text-danger">*</span></label
                        >
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text"
                              ><i class="fas fa-user text-primary"></i
                            ></span>
                          </div>
                          <input
                            type="text"
                            class="form-control"
                            id="username"
                            th:field="*{username}"
                            th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                            placeholder="Ej: admin"
                            required
                            minlength="3"
                            maxlength="50"
                          />
                          <div
                            class="invalid-feedback"
                            th:if="${#fields.hasErrors('username')}"
                            th:errors="*{username}"
                          ></div>
                          <div
                            class="invalid-feedback"
                            th:unless="${#fields.hasErrors('username')}"
                          >
                            El nombre de usuario es obligatorio (3-50
                            caracteres).
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="row">
                    <div class="col-md-6">
                      <div class="form-group">
                        <label for="password" class="font-weight-bold"
                          >Contraseña
                          <span class="text-danger" th:if="${user.id == null}"
                            >*</span
                          ></label
                        >
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text"
                              ><i class="fas fa-lock text-primary"></i
                            ></span>
                          </div>
                          <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Contraseña"
                            th:required="${user.id == null}"
                            minlength="8"
                            maxlength="128"
                          />
                        </div>
                        <div class="invalid-feedback">
                          <span th:if="${user.id == null}"
                            >La contraseña es obligatoria (mínimo 8
                            caracteres).</span
                          >
                          <span th:unless="${user.id == null}"
                            >Dejar vacío para no cambiar la contraseña
                            actual.</span
                          >
                        </div>
                        <small
                          class="form-text text-muted"
                          th:if="${user.id != null}"
                          >Dejar vacío para no cambiar la contraseña
                          actual.</small
                        >
                      </div>
                    </div>
                    <div class="col-md-6">
                      <div class="form-group">
                        <label for="role" class="font-weight-bold"
                          >Rol <span class="text-danger">*</span></label
                        >
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text"
                              ><i class="fas fa-user-shield text-primary"></i
                            ></span>
                          </div>
                          <select
                            class="form-control"
                            id="role"
                            th:field="*{role}"
                            th:classappend="${#fields.hasErrors('role')} ? 'is-invalid'"
                            required
                          >
                            <option value="">Seleccionar Rol</option>
                            <option
                              th:each="role : ${roles}"
                              th:value="${role}"
                              th:text="${role}"
                            ></option>
                          </select>
                          <div
                            class="invalid-feedback"
                            th:if="${#fields.hasErrors('role')}"
                            th:errors="*{role}"
                          ></div>
                          <div
                            class="invalid-feedback"
                            th:unless="${#fields.hasErrors('role')}"
                          >
                            Por favor seleccione un rol.
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="form-group">
                    <div class="custom-control custom-checkbox">
                      <input
                        class="custom-control-input"
                        type="checkbox"
                        id="enabled"
                        th:field="*{enabled}"
                      />
                      <label
                        class="custom-control-label font-weight-bold"
                        for="enabled"
                      >
                        Usuario Habilitado
                      </label>
                    </div>
                  </div>

                  <hr />

                  <div class="form-group text-right">
                    <button
                      type="submit"
                      class="btn btn-primary px-4 shadow-sm"
                    >
                      <i class="fas fa-save mr-1"></i> Guardar Usuario
                    </button>
                    <a
                      th:href="@{/admin/users}"
                      class="btn btn-secondary px-4 ml-2"
                    >
                      <i class="fas fa-times mr-1"></i> Cancelar
                    </a>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>

        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>

    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
    <th:block
      th:replace="~{fragments/select2-scripts :: select2-scripts}"
    ></th:block>

    <script>
      (function () {
        "use strict";
        window.addEventListener(
          "load",
          function () {
            var forms = document.getElementsByClassName("needs-validation");
            var validation = Array.prototype.filter.call(
              forms,
              function (form) {
                form.addEventListener(
                  "submit",
                  function (event) {
                    if (form.checkValidity() === false) {
                      event.preventDefault();
                      event.stopPropagation();
                    }
                    form.classList.add("was-validated");
                  },
                  false,
                );
              },
            );
          },
          false,
        );
      })();
    </script>
  </body>
</html>
