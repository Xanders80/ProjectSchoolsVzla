<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Formulario de Usuario - Sistema de Gestión Escolar</title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>

  <body id="page-top" role="main">
    <div id="wrapper" role="region" aria-label="Contenedor principal">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>

      <div
        id="content-wrapper"
        class="d-flex flex-column"
        role="region"
        aria-label="Contenido principal"
      >
        <div id="content" tabindex="-1">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>

          <div class="container-fluid" role="main">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
              role="heading"
              aria-level="1"
            >
              <h1
                class="h3 mb-0 text-gray-800"
                th:text="${user.id != null ? 'Editar Usuario' : 'Nuevo Usuario'}"
              >
                Usuario
              </h1>
              <a
                th:href="@{/admin/users}"
                class="btn btn-secondary"
                aria-label="Volver"
              >
                <i class="fas fa-arrow-left" aria-hidden="true"></i> Volver
              </a>
            </div>

            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Información del Usuario
                </h6>
              </div>
              <div class="card-body">
                <form
                  th:action="@{/admin/users}"
                  th:object="${user}"
                  method="post"
                >
                  <input type="hidden" th:field="*{id}" />

                  <div class="row">
                    <div class="col-md-12">
                      <div class="form-group">
                        <label for="username">Nombre de Usuario</label>
                        <input
                          type="text"
                          class="form-control"
                          id="username"
                          th:field="*{username}"
                          placeholder="Ej: admin"
                          required
                        />
                        <div
                          class="invalid-feedback"
                          th:if="${#fields.hasErrors('username')}"
                          th:errors="*{username}"
                        ></div>
                      </div>
                    </div>
                  </div>

                  <div class="row">
                    <div class="col-md-6">
                      <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input
                          type="password"
                          class="form-control"
                          id="password"
                          name="password"
                          placeholder="Contraseña (dejar vacío para no cambiar)"
                          th:required="${user.id == null}"
                        />
                      </div>
                    </div>
                    <div class="col-md-6">
                      <div class="form-group">
                        <label for="role">Rol</label>
                        <select
                          class="form-control"
                          id="role"
                          th:field="*{role}"
                          required
                        >
                          <option value="">Seleccionar Rol</option>
                          <option
                            th:each="role : ${roles}"
                            th:value="${role}"
                            th:text="${role}"
                          ></option>
                        </select>
                        <div
                          class="invalid-feedback"
                          th:if="${#fields.hasErrors('role')}"
                          th:errors="*{role}"
                        ></div>
                      </div>
                    </div>
                  </div>

                  <div class="form-group">
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        id="enabled"
                        th:field="*{enabled}"
                      />
                      <label class="form-check-label" for="enabled">
                        Usuario Habilitado
                      </label>
                    </div>
                  </div>

                  <button type="submit" class="btn btn-primary">
                    Guardar Usuario
                  </button>
                  <a th:href="@{/admin/users}" class="btn btn-secondary"
                    >Cancelar</a
                  >
                </form>
              </div>
            </div>
          </div>
        </div>

        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>

    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
  </body>
</html>
