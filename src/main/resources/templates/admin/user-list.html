<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Lista de Usuarios - Sistema de Gestión Escolar</title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>

  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>

      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>

          <div class="container-fluid">
            <h1 class="h3 mb-4 text-gray-800">Lista de Usuarios</h1>

            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Usuarios del Sistema
                </h6>
              </div>
              <div class="card-body">
                <div class="mb-3">
                  <a th:href="@{/admin/users/new}" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Agregar Nuevo Usuario
                  </a>
                </div>

                <div class="table-responsive">
                  <table
                    class="table table-bordered"
                    id="dataTable"
                    width="100%"
                    cellspacing="0"
                  >
                    <thead>
                      <tr>
                        <th>ID</th>
                        <th>Nombre de Usuario</th>
                        <th>Email</th>
                        <th>Nombre Completo</th>
                        <th>Rol</th>
                        <th>Habilitado</th>
                        <th>Fecha de Creación</th>
                        <th>Acciones</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr th:each="user : ${users.content}">
                        <td th:text="${user.id}">1</td>
                        <td th:text="${user.username}">admin</td>
                        <td th:text="${user.email}">admin@example.com</td>
                        <td th:text="${user.firstName + ' ' + user.lastName}">
                          Admin User
                        </td>
                        <td th:text="${user.role}">ADMIN</td>
                        <td>
                          <span
                            th:if="${user.enabled}"
                            class="badge badge-success"
                            >Sí</span
                          >
                          <span
                            th:unless="${user.enabled}"
                            class="badge badge-danger"
                            >No</span
                          >
                        </td>
                        <td
                          th:text="${#temporals.format(user.createdAt, 'dd/MM/yyyy HH:mm')}"
                        >
                          01/01/2023 12:00
                        </td>
                        <td>
                          <a
                            th:href="@{/admin/users/edit/{id}(id=${user.id})}"
                            class="btn btn-info btn-sm"
                          >
                            <i class="fas fa-edit"></i> Editar
                          </a>
                          <a
                            data-toggle="modal"
                            data-target="#deleteModal"
                            th:href="@{/admin/users/delete/{id}(id=${user.id})}"
                            class="btn btn-danger btn-sm delete-btn"
                            th:data-url="@{/admin/users/delete/{id}(id=${user.id})}"
                          >
                            <i class="fas fa-trash"></i> Eliminar
                          </a>
                        </td>
                      </tr>
                      <tr th:if="${users.empty}">
                        <td colspan="8" class="text-center text-muted">
                          No se encontraron usuarios.
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                <!-- Pagination -->
                <div
                  th:if="${users.totalPages > 1}"
                  class="d-flex justify-content-center mt-4"
                >
                  <nav aria-label="Page navigation">
                    <ul class="pagination">
                      <li
                        class="page-item"
                        th:classappend="${users.first} ? 'disabled'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/admin/users(page=${users.number - 1}, size=${users.size})}"
                          >Anterior</a
                        >
                      </li>
                      <li class="page-item disabled">
                        <span
                          class="page-link"
                          th:text="'Página ' + ${users.number + 1} + ' de ' + ${users.totalPages}"
                        ></span>
                      </li>
                      <li
                        class="page-item"
                        th:classappend="${users.last} ? 'disabled'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/admin/users(page=${users.number + 1}, size=${users.size})}"
                          >Siguiente</a
                        >
                      </li>
                    </ul>
                  </nav>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top"
      ><i class="fas fa-angle-up"></i
    ></a>
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>
    <div th:replace="~{fragments/delete-modal :: deleteModal}"></div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>

    <script>
      $(document).ready(function () {
        $(".delete-btn").on("click", function () {
          var deleteUrl = $(this).data("url");
          $("#deleteForm").attr("action", deleteUrl);
        });
      });
    </script>
  </body>
</html>
