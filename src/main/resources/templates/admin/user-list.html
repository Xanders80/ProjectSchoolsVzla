<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Lista de Usuarios - Sistema de Gestión Escolar</title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>

  <body id="page-top" role="main">
    <div id="wrapper" role="region" aria-label="Contenedor principal">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>

      <div
        id="content-wrapper"
        class="d-flex flex-column"
        role="region"
        aria-label="Contenido principal"
      >
        <div id="content" tabindex="-1">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>

          <div class="container-fluid" role="main">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
              role="heading"
              aria-level="1"
            >
              <h1 class="h3 mb-0 text-gray-800">
                <i class="fas fa-users-cog mr-2 text-primary"></i>Lista de
                Usuarios
              </h1>
              <a
                th:href="@{/admin/users/new}"
                class="btn btn-primary"
                aria-label="Agregar Nuevo Usuario"
              >
                <i class="fas fa-plus" aria-hidden="true"></i> Agregar Nuevo
                Usuario
              </a>
            </div>

            <div th:if="${successMessage}" class="alert alert-success">
              <span th:text="${successMessage}"></span>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger">
              <span th:text="${errorMessage}"></span>
            </div>

            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Usuarios del Sistema
                </h6>
              </div>
              <div class="card-body">
                <div class="table-responsive">
                  <table
                    class="table table-bordered"
                    id="dataTable"
                    width="100%"
                    cellspacing="0"
                  >
                    <thead>
                      <tr>
                        <th>ID</th>
                        <th>Nombre de Usuario</th>
                        <th>Rol</th>
                        <th>Habilitado</th>
                        <th>Fecha de Creación</th>
                        <th>Acciones</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr th:each="user : ${users.content}">
                        <td th:text="${user.id}">1</td>
                        <td th:text="${user.username}">admin</td>
                        <td th:text="${user.role}">ADMIN</td>
                        <td>
                          <span
                            th:if="${user.enabled}"
                            class="badge badge-success"
                            >Sí</span
                          >
                          <span
                            th:unless="${user.enabled}"
                            class="badge badge-danger"
                            >No</span
                          >
                        </td>
                        <td
                          th:text="${#temporals.format(user.createdAt, 'dd/MM/yyyy HH:mm')}"
                        >
                          01/01/2023 12:00
                        </td>
                        <td>
                          <a
                            th:href="@{/admin/users/edit/{id}(id=${user.id})}"
                            class="btn btn-sm btn-warning"
                          >
                            <i class="fas fa-edit"></i> Editar
                          </a>
                          <button
                            type="button"
                            class="btn btn-sm btn-danger"
                            data-toggle="modal"
                            data-target="#deleteModal"
                            th:onclick="'confirmDelete(\'' + @{/admin/users/delete/{id}(id=${user.id})} + '\')'"
                          >
                            <i class="fas fa-trash"></i> Eliminar
                          </button>
                        </td>
                      </tr>
                      <tr th:if="${users.empty}">
                        <td colspan="6" class="text-center text-muted">
                          No se encontraron usuarios.
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                <!-- Pagination -->
                <div
                  th:if="${users.totalPages > 1}"
                  class="d-flex justify-content-center"
                >
                  <nav aria-label="Page navigation">
                    <ul class="pagination">
                      <li
                        class="page-item"
                        th:classappend="${users.number == 0} ? 'disabled'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/admin/users(page=${users.number - 1}, size=10)}"
                          aria-label="Previous"
                        >
                          <span aria-hidden="true">&laquo;</span>
                        </a>
                      </li>
                      <li
                        class="page-item"
                        th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}"
                        th:classappend="${i == users.number} ? 'active'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/admin/users(page=${i}, size=10)}"
                          th:text="${i + 1}"
                        ></a>
                      </li>
                      <li
                        class="page-item"
                        th:classappend="${users.number == users.totalPages - 1} ? 'disabled'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/admin/users(page=${users.number + 1}, size=10)}"
                          aria-label="Next"
                        >
                          <span aria-hidden="true">&raquo;</span>
                        </a>
                      </li>
                    </ul>
                  </nav>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top"
      ><i class="fas fa-angle-up"></i
    ></a>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
    <script th:src="@{/vendor/datatables/jquery.dataTables.min.js}"></script>
    <script
      th:src="@{/vendor/datatables/dataTables.bootstrap4.min.js}"
    ></script>
    <script th:src="@{/js/demo/datatables-demo.js}"></script>
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>
    <div th:replace="~{fragments/delete-modal :: deleteModal}"></div>
  </body>
</html>
