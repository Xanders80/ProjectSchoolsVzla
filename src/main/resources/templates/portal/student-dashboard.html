<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <title>Portal de Estudiantes</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
</head>
<body>
<div class="dashboard-layout">
  <aside
    class="sidebar"
    style="background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%)"
  >
    <div class="sidebar-logo" style="color: white">
      <span>📚 Student Portal</span>
    </div>
    <nav>
      <a
        th:href="@{/portal/student}"
        class="nav-link active"
        style="color: white; background: rgba(255, 255, 255, 0.1)"
        >Overview</a
      >
      <a
        th:href="@{/portal/grades}"
        class="nav-link"
        style="color: rgba(255, 255, 255, 0.8)"
        >My Grades</a
      >
      <a
        th:href="@{/schedules}"
        class="nav-link"
        style="color: rgba(255, 255, 255, 0.8)"
        >Horarios</a
      >
      <a
        th:href="@{/logout}"
        class="nav-link"
        style="color: rgba(255, 255, 255, 0.8); margin-top: auto"
        >Logout</a
      >
    </nav>
  </aside>

  <main class="main-content">
    <div class="header">
      <h2>¡Bienvenido de nuevo, <span th:text="${student?.firstName} ?: 'Estudiante'">Estudiante</span>!</h2>
      <span class="badge" style="background: #e0e7ff; color: #4338ca"
        >Student Portal</span
      >
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <h3>Promedio</h3>
        <p class="value" th:text="${#numbers.formatDecimal(average, 1, 1)}">0.0</p>
      </div>
      <div class="stat-card">
        <h3>Asistencia</h3>
        <p class="value" th:text="${#numbers.formatDecimal(attendancePercent, 1, 0)} + '%'">0%</p>
      </div>
      <div class="stat-card">
        <h3>Calificaciones</h3>
        <p class="value" th:text="${#lists.size(grades)}">0</p>
      </div>
    </div>

    <div class="card glass" style="margin-top: 2rem; padding: 1.5rem">
      <h3>Mis Calificaciones</h3>
      <div th:if="${#lists.isEmpty(grades)}" style="padding: 1rem; color: #6b7280;">
        No hay calificaciones registradas aún.
      </div>
      <ul th:if="${!#lists.isEmpty(grades)}" style="list-style: none; padding: 0; margin-top: 1rem">
        <li th:each="grade : ${grades}"
            style="padding: 1rem; border-bottom: 1px solid #eee; display: flex; justify-content: space-between">
          <span th:text="${grade.course?.name ?: 'Curso'}">Curso</span>
          <span style="font-weight: 600"
                th:text="${#numbers.formatDecimal(grade.score, 1, 1)}"
                th:classappend="${grade.score >= 60} ? 'text-success' : 'text-danger'">0.0</span>
        </li>
      </ul>
    </div>
  </main>
</div>
</body>
</html>
