<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Biblioteca - Préstamos</title>
    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>
  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>
      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>
          <div class="container-fluid">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
            >
              <h1 class="h3 mb-0 text-gray-800">
                <i class="fas fa-clipboard-list mr-2 text-primary"></i>Préstamos
                de Libros
              </h1>
              <a th:href="@{/library/loans/new}" class="btn btn-primary">
                <i class="fas fa-plus"></i> Nuevo Préstamo
              </a>
            </div>

            <div th:if="${successMessage}" class="alert alert-success">
              <span th:text="${successMessage}"></span>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger">
              <span th:text="${errorMessage}"></span>
            </div>

            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Historial de Préstamos
                </h6>
              </div>
              <div class="card-body">
                <div class="table-responsive">
                  <table
                    class="table table-bordered"
                    id="dataTable"
                    width="100%"
                    cellspacing="0"
                  >
                    <thead>
                      <tr>
                        <th>Libro</th>
                        <th>Usuario</th>
                        <th>Fecha Préstamo</th>
                        <th>Vencimiento</th>
                        <th>Devolución</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr th:each="loan : ${loans}">
                        <td th:text="${loan.book.title}">Book</td>
                        <td th:text="${loan.borrower.username}">User</td>
                        <td th:text="${loan.loanDate}">Start</td>
                        <td th:text="${loan.dueDate}">Due</td>
                        <td th:text="${loan.returnDate}">Return</td>
                        <td>
                          <span
                            th:class="'badge badge-' +
                                          (${loan.status.name() == 'ACTIVE'} ? 'info' :
                                          (${loan.status.name() == 'RETURNED'} ? 'success' : 'danger'))"
                            th:text="${loan.status.displayName}"
                            >Status</span
                          >
                        </td>
                        <td>
                          <form
                            th:if="${loan.status.name() == 'ACTIVE' OR loan.status.name() == 'OVERDUE'}"
                            th:action="@{/library/loans/return/{id}(id=${loan.id})}"
                            method="post"
                          >
                            <button
                              type="submit"
                              class="btn btn-success btn-sm"
                            >
                              <i class="fas fa-undo"></i> Devolver
                            </button>
                          </form>
                        </td>
                      </tr>
                      <tr th:if="${#lists.isEmpty(loans)}">
                        <td colspan="7" class="text-center text-muted">
                          No se encontraron préstamos registrados.
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>
    <a class="scroll-to-top rounded" href="#page-top"
      ><i class="fas fa-angle-up"></i
    ></a>
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
    <script th:src="@{/vendor/datatables/jquery.dataTables.min.js}"></script>
    <script
      th:src="@{/vendor/datatables/dataTables.bootstrap4.min.js}"
    ></script>
    <script th:src="@{/js/demo/datatables-demo.js}"></script>
  </body>
</html>
