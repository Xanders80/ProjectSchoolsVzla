<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Formulario de Recurso Digital</title>
    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>
  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>
      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>
          <div class="container-fluid">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
            >
              <h1
                class="h3 mb-0 text-gray-800"
                th:text="${resource.id != null ? 'Editar Recurso Digital' : 'Nuevo Recurso Digital'}"
              >
                FFormulario de Recurso
              </h1>
              <a th:href="@{/library/resources}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Volver
              </a>
            </div>

            <div class="card shadow mb-4">
              <div class="card-body">
                <form
                  th:action="@{/library/resources/save}"
                  th:object="${resource}"
                  method="post"
                >
                  <input type="hidden" th:field="*{id}" />

                  <div class="form-group">
                    <label for="title">Título *</label>
                    <input
                      type="text"
                      class="form-control"
                      id="title"
                      th:field="*{title}"
                      required
                    />
                  </div>

                  <div class="form-group">
                    <label for="author">Autor</label>
                    <input
                      type="text"
                      class="form-control"
                      id="author"
                      th:field="*{author}"
                    />
                  </div>

                  <div class="form-group">
                    <label for="category">Categoría *</label>
                    <select
                      class="form-control"
                      id="category"
                      th:field="*{category}"
                      required
                    >
                      <option value="">Seleccione una categoría</option>
                      <option value="ARTICULO">Artículo</option>
                      <option value="DATASET">Dataset</option>
                      <option value="PAPER">Paper Académico</option>
                      <option value="VIDEO">Video Educativo</option>
                      <option value="PRESENTACION">Presentación</option>
                      <option value="OTRO">Otro</option>
                    </select>
                  </div>

                  <div class="form-group">
                    <label for="resourceType">Tipo de Recurso</label>
                    <input
                      type="text"
                      class="form-control"
                      id="resourceType"
                      th:field="*{resourceType}"
                      placeholder="Ej: PDF, Video, Enlace"
                    />
                  </div>

                  <div class="form-group">
                    <label for="url">URL del Recurso *</label>
                    <input
                      type="url"
                      class="form-control"
                      id="url"
                      th:field="*{url}"
                      required
                      placeholder="https://..."
                    />
                    <small class="form-text text-muted"
                      >Ingrese la URL completa del recurso digital</small
                    >
                  </div>

                  <div class="mt-4">
                    <button type="submit" class="btn btn-primary">
                      <i class="fas fa-save"></i> Guardar
                    </button>
                    <a
                      th:href="@{/library/resources}"
                      class="btn btn-secondary"
                    >
                      <i class="fas fa-times"></i> Cancelar
                    </a>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
  </body>
</html>
