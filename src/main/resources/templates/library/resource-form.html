<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Formulario de Recurso Digital</title>
    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>
  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>
      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>
          <div class="container-fluid">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
            >
              <h1 class="h3 mb-0 text-gray-800">
                <i class="fas fa-laptop mr-2 text-primary"></i
                ><span
                  th:text="${resource.id != null ? 'Editar Recurso Digital' : 'Nuevo Recurso Digital'}"
                  >FFormulario de Recurso</span
                >
              </h1>
              <a th:href="@{/library/resources}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Volver
              </a>
            </div>

            <div class="card shadow mb-4">
              <div class="card-body">
                <form
                  th:action="@{/library/resources/save}"
                  th:object="${resource}"
                  method="post"
                  class="needs-validation"
                  novalidate
                >
                  <input type="hidden" th:field="*{id}" />

                  <div class="form-group">
                    <label for="title" class="font-weight-bold"
                      >Título <span class="text-danger">*</span></label
                    >
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text"
                          ><i class="fas fa-heading"></i
                        ></span>
                      </div>
                      <input
                        type="text"
                        class="form-control"
                        id="title"
                        th:field="*{title}"
                        placeholder="Ej: Introducción a la Física"
                        required
                      />
                    </div>
                  </div>

                  <div class="form-group">
                    <label for="author" class="font-weight-bold"
                      >Autor / Creador</label
                    >
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text"
                          ><i class="fas fa-user-edit"></i
                        ></span>
                      </div>
                      <input
                        type="text"
                        class="form-control"
                        id="author"
                        th:field="*{author}"
                        placeholder="Ej: Dr. Smith"
                      />
                    </div>
                  </div>

                  <div class="form-group">
                    <label for="category" class="font-weight-bold"
                      >Categoría <span class="text-danger">*</span></label
                    >
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text"
                          ><i class="fas fa-tags text-primary"></i
                        ></span>
                      </div>
                      <select
                        class="form-control"
                        id="category"
                        th:field="*{category}"
                        required
                      >
                        <option value="">Seleccione una categoría</option>
                        <option value="ARTICULO">Artículo</option>
                        <option value="DATASET">Dataset</option>
                        <option value="PAPER">Paper Académico</option>
                        <option value="VIDEO">Video Educativo</option>
                        <option value="PRESENTACION">Presentación</option>
                        <option value="OTRO">Otro</option>
                      </select>
                    </div>
                  </div>

                  <div class="form-group">
                    <label for="resourceType" class="font-weight-bold"
                      >Formato / Tipo de Archivo</label
                    >
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text"
                          ><i class="fas fa-file-code"></i
                        ></span>
                      </div>
                      <input
                        type="text"
                        class="form-control"
                        id="resourceType"
                        th:field="*{resourceType}"
                        placeholder="Ej: PDF, Video, Enlace"
                      />
                    </div>
                  </div>

                  <div class="form-group">
                    <label for="url" class="font-weight-bold"
                      >URL del Recurso <span class="text-danger">*</span></label
                    >
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text"
                          ><i class="fas fa-link text-info"></i
                        ></span>
                      </div>
                      <input
                        type="url"
                        class="form-control"
                        id="url"
                        th:field="*{url}"
                        required
                        placeholder="https://su-institucion.edu/recurso"
                      />
                    </div>
                    <small class="form-text text-muted"
                      >Asegúrese de que el enlace sea accesible para el personal
                      y estudiantes.</small
                    >
                  </div>

                  <hr />

                  <div class="form-group text-right">
                    <button
                      type="submit"
                      class="btn btn-primary px-4 shadow-sm"
                    >
                      <i class="fas fa-save mr-1"></i> Guardar Recurso
                    </button>
                    <a
                      th:href="@{/library/resources}"
                      class="btn btn-secondary px-4 ml-2"
                    >
                      <i class="fas fa-times mr-1"></i> Cancelar
                    </a>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>

    <script>
      (function () {
        "use strict";
        window.addEventListener(
          "load",
          function () {
            var forms = document.getElementsByClassName("needs-validation");
            var validation = Array.prototype.filter.call(
              forms,
              function (form) {
                form.addEventListener(
                  "submit",
                  function (event) {
                    if (form.checkValidity() === false) {
                      event.preventDefault();
                      event.stopPropagation();
                    }
                    form.classList.add("was-validated");
                  },
                  false,
                );
              },
            );
          },
          false,
        );
      })();
    </script>
  </body>
</html>
