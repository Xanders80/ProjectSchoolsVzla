<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Biblioteca - Nuevo Préstamo</title>
    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>
  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>
      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>
          <div class="container-fluid">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
            >
              <h1 class="h3 mb-4 text-gray-800">Registrar Préstamo</h1>
              <a th:href="@{/library/loans}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Volver
              </a>
            </div>

            <div class="card shadow mb-4">
              <div class="card-body">
                <form th:action="@{/library/loans}" method="post">
                  <div class="form-group">
                    <label for="bookId">Libro Disponible</label>
                    <select class="form-control" name="bookId" required>
                      <option value="" disabled selected>
                        Seleccione un libro...
                      </option>
                      <option
                        th:each="book : ${books}"
                        th:value="${book.id}"
                        th:text="${book.title + ' (ISBN: ' + book.isbn + ')'}"
                      ></option>
                    </select>
                  </div>

                  <div class="form-group">
                    <label for="userId">Usuario</label>
                    <select class="form-control" name="userId" required>
                      <option value="" disabled selected>
                        Seleccione un usuario...
                      </option>
                      <option
                        th:each="user : ${users}"
                        th:value="${user.id}"
                        th:text="${user.username + ' (' + user.role + ')'}"
                      ></option>
                    </select>
                  </div>

                  <div class="form-group">
                    <label for="dueDate">Fecha de Vencimiento</label>
                    <input
                      type="date"
                      class="form-control"
                      name="dueDate"
                      required
                    />
                  </div>

                  <button type="submit" class="btn btn-primary">
                    Registrar Préstamo
                  </button>
                  <a th:href="@{/library/loans}" class="btn btn-secondary"
                    >Cancelar</a
                  >
                </form>
              </div>
            </div>
          </div>
        </div>
        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
  </body>
</html>
