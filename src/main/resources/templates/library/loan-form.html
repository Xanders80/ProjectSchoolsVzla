<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Biblioteca - Nuevo Préstamo</title>
    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>
  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>
      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>
          <div class="container-fluid">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
            >
              <h1 class="h3 mb-4 text-gray-800">
                <i class="fas fa-clipboard-list mr-2 text-primary"></i>Registrar
                Préstamo
              </h1>
              <a th:href="@{/library/loans}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Volver
              </a>
            </div>

            <div class="card shadow mb-4">
              <div class="card-body">
                <form
                  th:action="@{/library/loans}"
                  method="post"
                  class="needs-validation"
                  novalidate
                >
                  <div class="form-group">
                    <label for="bookId" class="font-weight-bold"
                      >Libro Disponible
                      <span class="text-danger">*</span></label
                    >
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text"
                          ><i class="fas fa-book text-primary"></i
                        ></span>
                      </div>
                      <select class="form-control" name="bookId" required>
                        <option value="" disabled selected>
                          Seleccione un libro...
                        </option>
                        <option
                          th:each="book : ${books}"
                          th:value="${book.id}"
                          th:text="${book.title + ' (ISBN: ' + book.isbn + ')'}"
                        ></option>
                      </select>
                    </div>
                  </div>

                  <div class="form-group">
                    <label for="userId" class="font-weight-bold"
                      >Usuario <span class="text-danger">*</span></label
                    >
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text"
                          ><i class="fas fa-user text-primary"></i
                        ></span>
                      </div>
                      <select class="form-control" name="userId" required>
                        <option value="" disabled selected>
                          Seleccione un usuario...
                        </option>
                        <option
                          th:each="user : ${users}"
                          th:value="${user.id}"
                          th:text="${user.username + ' (' + user.role + ')'}"
                        ></option>
                      </select>
                    </div>
                  </div>

                  <div class="form-group">
                    <label for="dueDate" class="font-weight-bold"
                      >Fecha de Vencimiento
                      <span class="text-danger">*</span></label
                    >
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text"
                          ><i class="fas fa-calendar-day text-primary"></i
                        ></span>
                      </div>
                      <input
                        type="date"
                        class="form-control"
                        name="dueDate"
                        required
                      />
                    </div>
                  </div>

                  <hr />

                  <div class="form-group text-right">
                    <button
                      type="submit"
                      class="btn btn-primary px-4 shadow-sm"
                    >
                      <i class="fas fa-check-circle mr-1"></i> Registrar
                      Préstamo
                    </button>
                    <a
                      th:href="@{/library/loans}"
                      class="btn btn-secondary px-4 ml-2"
                    >
                      <i class="fas fa-times mr-1"></i> Cancelar
                    </a>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>

    <script>
      (function () {
        "use strict";
        window.addEventListener(
          "load",
          function () {
            var forms = document.getElementsByClassName("needs-validation");
            var validation = Array.prototype.filter.call(
              forms,
              function (form) {
                form.addEventListener(
                  "submit",
                  function (event) {
                    if (form.checkValidity() === false) {
                      event.preventDefault();
                      event.stopPropagation();
                    }
                    form.classList.add("was-validated");
                  },
                  false,
                );
              },
            );
          },
          false,
        );
      })();
    </script>
  </body>
</html>
