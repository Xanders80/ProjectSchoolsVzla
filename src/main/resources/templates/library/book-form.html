<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Biblioteca - Formulario Libro</title>
    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>
  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>
      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>
          <div class="container-fluid">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
            >
              <h1 class="h3 mb-0 text-gray-800">
                <i class="fas fa-book mr-2 text-primary"></i
                ><span
                  th:text="${book.id == null ? 'Nuevo Libro' : 'Editar Libro'}"
                  >Formulario</span
                >
              </h1>
              <a th:href="@{/library/books}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Volver
              </a>
            </div>

            <div class="card shadow mb-4">
              <div class="card-body">
                <form
                  th:action="@{/library/books}"
                  th:object="${book}"
                  method="post"
                  class="needs-validation"
                  novalidate
                >
                  <input type="hidden" th:field="*{id}" />

                  <div class="form-group">
                    <label for="title" class="font-weight-bold"
                      >Título <span class="text-danger">*</span></label
                    >
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text"
                          ><i class="fas fa-book"></i
                        ></span>
                      </div>
                      <input
                        type="text"
                        class="form-control"
                        th:field="*{title}"
                        placeholder="Ej: El Quijote de la Mancha"
                        required
                        th:errorclass="is-invalid"
                      />
                    </div>
                    <div
                      class="invalid-feedback text-danger small mt-1"
                      th:if="${#fields.hasErrors('title')}"
                      th:errors="*{title}"
                    ></div>
                  </div>

                  <div class="form-group">
                    <label for="author" class="font-weight-bold"
                      >Autor <span class="text-danger">*</span></label
                    >
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text"
                          ><i class="fas fa-user-edit"></i
                        ></span>
                      </div>
                      <input
                        type="text"
                        class="form-control"
                        th:field="*{author}"
                        placeholder="Ej: Miguel de Cervantes"
                        required
                        th:errorclass="is-invalid"
                      />
                    </div>
                    <div
                      class="invalid-feedback text-danger small mt-1"
                      th:if="${#fields.hasErrors('author')}"
                      th:errors="*{author}"
                    ></div>
                  </div>

                  <div class="form-row">
                    <div class="form-group col-md-6">
                      <label for="isbn" class="font-weight-bold"
                        >ISBN <span class="text-danger">*</span></label
                      >
                      <div class="input-group">
                        <div class="input-group-prepend">
                          <span class="input-group-text"
                            ><i class="fas fa-barcode"></i
                          ></span>
                        </div>
                        <input
                          type="text"
                          class="form-control"
                          th:field="*{isbn}"
                          placeholder="Ej: 978-3-16-148410-0"
                          required
                          th:errorclass="is-invalid"
                        />
                      </div>
                      <div
                        class="invalid-feedback text-danger small mt-1"
                        th:if="${#fields.hasErrors('isbn')}"
                        th:errors="*{isbn}"
                      ></div>
                    </div>
                    <div class="form-group col-md-6">
                      <label for="category" class="font-weight-bold"
                        >Categoría <span class="text-danger">*</span></label
                      >
                      <div class="input-group">
                        <div class="input-group-prepend">
                          <span class="input-group-text"
                            ><i class="fas fa-layer-group"></i
                          ></span>
                        </div>
                        <input
                          type="text"
                          class="form-control"
                          th:field="*{category}"
                          placeholder="Ej: Literatura Clásica"
                          required
                          th:errorclass="is-invalid"
                        />
                      </div>
                      <div
                        class="invalid-feedback text-danger small mt-1"
                        th:if="${#fields.hasErrors('category')}"
                        th:errors="*{category}"
                      ></div>
                    </div>
                  </div>

                  <div class="form-group">
                    <label for="status" class="font-weight-bold">Estado</label>
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text"
                          ><i class="fas fa-info-circle"></i
                        ></span>
                      </div>
                      <select class="form-control" th:field="*{status}">
                        <option
                          th:each="s : ${T(com.school.library.enums.BookStatus).values()}"
                          th:value="${s}"
                          th:text="${s.displayName}"
                        ></option>
                      </select>
                    </div>
                  </div>

                  <hr />

                  <div class="form-group text-right">
                    <button
                      type="submit"
                      class="btn btn-primary px-4 shadow-sm"
                    >
                      <i class="fas fa-save mr-1"></i> Guardar Libro
                    </button>
                    <a
                      th:href="@{/library/books}"
                      class="btn btn-secondary px-4 ml-2"
                    >
                      <i class="fas fa-times mr-1"></i> Cancelar
                    </a>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>

    <script>
      (function () {
        "use strict";
        window.addEventListener(
          "load",
          function () {
            var forms = document.getElementsByClassName("needs-validation");
            var validation = Array.prototype.filter.call(
              forms,
              function (form) {
                form.addEventListener(
                  "submit",
                  function (event) {
                    if (form.checkValidity() === false) {
                      event.preventDefault();
                      event.stopPropagation();
                    }
                    form.classList.add("was-validated");
                  },
                  false,
                );
              },
            );
          },
          false,
        );
      })();
    </script>
  </body>
</html>
