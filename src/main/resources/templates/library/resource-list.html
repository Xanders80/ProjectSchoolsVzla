<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Biblioteca - Recursos Digitales</title>
    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>
  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>
      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>
          <div class="container-fluid">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
            >
              <h1 class="h3 mb-0 text-gray-800">Lista de Recursos Digitales</h1>
              <a th:href="@{/library/resources/new}" class="btn btn-primary">
                <i class="fas fa-plus"></i> Agregar Nuevo Recurso
              </a>
            </div>

            <div th:if="${successMessage}" class="alert alert-success">
              <span th:text="${successMessage}"></span>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger">
              <span th:text="${errorMessage}"></span>
            </div>

            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Recursos Digitales del Sistema
                </h6>
              </div>
              <div class="card-body">
                <div class="table-responsive">
                  <table
                    class="table table-bordered"
                    id="dataTable"
                    width="100%"
                    cellspacing="0"
                  >
                    <thead>
                      <tr>
                        <th>Título</th>
                        <th>Autor</th>
                        <th>Tipo</th>
                        <th>Categoría</th>
                        <th>Acciones</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr th:each="resource : ${resources.content}">
                        <td th:text="${resource.title}">Título</td>
                        <td th:text="${resource.author}">Autor</td>
                        <td th:text="${resource.resourceType}">Tipo</td>
                        <td th:text="${resource.category}">Categoría</td>
                        <td>
                          <button
                            th:if="${resource.url != null && resource.url.endsWith('.pdf')}"
                            class="btn btn-sm btn-info mr-1 preview-btn"
                            th:data-url="${resource.url}"
                          >
                            <i class="fas fa-eye"></i> Vista Previa
                          </button>
                          <a
                            th:href="${resource.url}"
                            target="_blank"
                            class="btn btn-sm btn-primary mr-1"
                          >
                            <i class="fas fa-download"></i> Abrir
                          </a>
                          <a
                            th:href="@{/library/resources/edit/{id}(id=${resource.id})}"
                            class="btn btn-sm btn-warning mr-1"
                          >
                            <i class="fas fa-edit"></i> Editar
                          </a>
                          <button
                            type="button"
                            class="btn btn-sm btn-danger"
                            data-toggle="modal"
                            data-target="#deleteModal"
                            th:onclick="'confirmDelete(\'' + @{/library/resources/delete/{id}(id=${resource.id})} + '\')'"
                          >
                            <i class="fas fa-trash"></i> Eliminar
                          </button>
                        </td>
                      </tr>
                      <tr th:if="${resources.empty}">
                        <td colspan="5" class="text-center text-muted">
                          No se encontraron recursos digitales.
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                <!-- Pagination -->
                <div
                  th:if="${resources.totalPages > 1}"
                  class="d-flex justify-content-center"
                >
                  <nav aria-label="Page navigation">
                    <ul class="pagination">
                      <li
                        class="page-item"
                        th:classappend="${resources.number == 0} ? 'disabled'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/library/resources(page=${resources.number - 1}, size=10)}"
                          aria-label="Previous"
                        >
                          <span aria-hidden="true">&laquo;</span>
                        </a>
                      </li>
                      <li
                        class="page-item"
                        th:each="i : ${#numbers.sequence(0, resources.totalPages - 1)}"
                        th:classappend="${i == resources.number} ? 'active'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/library/resources(page=${i}, size=10)}"
                          th:text="${i + 1}"
                        ></a>
                      </li>
                      <li
                        class="page-item"
                        th:classappend="${resources.number == resources.totalPages - 1} ? 'disabled'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/library/resources(page=${resources.number + 1}, size=10)}"
                          aria-label="Next"
                        >
                          <span aria-hidden="true">&raquo;</span>
                        </a>
                      </li>
                    </ul>
                  </nav>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- PDF Preview Modal -->
        <div
          class="modal fade"
          id="pdfModal"
          tabindex="-1"
          role="dialog"
          aria-hidden="true"
        >
          <div class="modal-dialog modal-xl" role="document">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title">Vista Previa de Documento</h5>
                <button
                  type="button"
                  class="close"
                  data-dismiss="modal"
                  aria-label="Close"
                >
                  <span aria-hidden="true">&times;</span>
                </button>
              </div>
              <div class="modal-body p-0">
                <iframe
                  id="pdfFrame"
                  src=""
                  width="100%"
                  height="600px"
                  style="border: none"
                ></iframe>
              </div>
            </div>
          </div>
        </div>

        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
    <script th:src="@{/vendor/datatables/jquery.dataTables.min.js}"></script>
    <script
      th:src="@{/vendor/datatables/dataTables.bootstrap4.min.js}"
    ></script>
    <script th:src="@{/js/demo/datatables-demo.js}"></script>
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>
    <div th:replace="~{fragments/delete-modal :: deleteModal}"></div>
    <script>
      $(document).ready(function () {
        $(".preview-btn").on("click", function () {
          var url = $(this).data("url");
          $("#pdfFrame").attr("src", url);
          $("#pdfModal").modal("show");
        });

        $("#pdfModal").on("hidden.bs.modal", function () {
          $("#pdfFrame").attr("src", "");
        });
      });
    </script>
  </body>
</html>
