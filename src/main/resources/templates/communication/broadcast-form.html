<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Crear Anuncio</title>
    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>
  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>
      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>
          <div class="container-fluid">
            <h1 class="h3 mb-4 text-gray-800">
              Enviar Anuncio General (Broadcast)
            </h1>

            <div class="card shadow mb-4">
              <div class="card-body">
                <div
                  th:if="${successMessage}"
                  class="alert alert-success"
                  th:text="${successMessage}"
                ></div>
                <div
                  th:if="${errorMessage}"
                  class="alert alert-danger"
                  th:text="${errorMessage}"
                ></div>

                <form th:action="@{/notifications/broadcast}" method="post">
                  <div class="form-group">
                    <label for="type">Tipo de Anuncio</label>
                    <select class="form-control" name="type">
                      <option
                        th:each="t : ${T(com.school.communication.enums.NotificationType).values()}"
                        th:value="${t}"
                        th:text="${t}"
                      ></option>
                    </select>
                  </div>

                  <div class="form-group">
                    <label for="message">Mensaje</label>
                    <textarea
                      class="form-control"
                      name="message"
                      rows="4"
                      required
                    ></textarea>
                  </div>

                  <button type="submit" class="btn btn-danger">
                    Enviar a TODOS
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
  </body>
</html>
