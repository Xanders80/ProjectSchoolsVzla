<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Crear Anuncio</title>
    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>
  <body id="page-top">
    <main id="wrapper">
      <nav aria-label="Menú principal" th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></nav>
      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <header th:replace="~{fragments/sb-admin-topbar :: topbar}" aria-label="Barra superior"></header>
          <main class="container-fluid" aria-labelledby="broadcast-title">
            <h1 id="broadcast-title" class="h3 mb-4 text-gray-800">
              Enviar Anuncio General (Broadcast)
            </h1>

            <section class="card shadow mb-4" aria-label="Formulario de anuncio">
              <div class="card-body">
                <div
                  th:if="${successMessage}"
                  class="alert alert-success"
                  th:text="${successMessage}"
                  role="alert"
                  aria-live="polite"
                ></div>
                <div
                  th:if="${errorMessage}"
                  class="alert alert-danger"
                  th:text="${errorMessage}"
                  role="alert"
                  aria-live="assertive"
                ></div>

                <form th:action="@{/notifications/broadcast}" method="post" aria-describedby="broadcast-title">
                  <div class="form-group">
                    <label for="type">Tipo de Anuncio</label>
                    <select class="form-control" name="type" id="type" aria-label="Tipo de anuncio">
                      <option
                        th:each="t : ${T(com.school.communication.enums.NotificationType).values()}"
                        th:value="${t}"
                        th:text="${t}"
                      ></option>
                    </select>
                  </div>

                  <div class="form-group">
                    <label for="message">Mensaje</label>
                    <textarea
                      class="form-control"
                      id="message"
                      name="message"
                      rows="4"
                      aria-label="Mensaje del anuncio"
                      required
                    ></textarea>
                  </div>
                  <!-- ...existing code... -->
                      class="form-control"
                      name="message"
                      rows="4"
                      required
                    ></textarea>
                  </div>

                  <button type="submit" class="btn btn-danger">
                    Enviar a TODOS
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
  </body>
</html>
