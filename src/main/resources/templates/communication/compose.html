<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Redactar Mensaje</title>
    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"
      rel="stylesheet"
    />
  </head>
  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>
      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>
          <div class="container-fluid">
            <h1 class="h3 mb-4 text-gray-800">Nuevo Mensaje</h1>

            <div class="card shadow mb-4">
              <div class="card-body">
                <form th:action="@{/messages/send}" method="post">
                  <div class="form-group">
                    <label for="receiverId">Destinatario</label>
                    <select
                      class="form-control select2"
                      name="receiverId"
                      required
                    >
                      <option value="" disabled selected>
                        Buscar usuario...
                      </option>
                      <option
                        th:each="user : ${users}"
                        th:value="${user.id}"
                        th:text="${user.username + ' (' + user.role + ')'}"
                      ></option>
                    </select>
                  </div>

                  <div class="form-group">
                    <label for="subject">Asunto</label>
                    <input
                      type="text"
                      class="form-control"
                      name="subject"
                      required
                    />
                  </div>

                  <div class="form-group">
                    <label for="content">Mensaje</label>
                    <textarea
                      class="form-control"
                      name="content"
                      rows="6"
                      required
                    ></textarea>
                  </div>

                  <button type="submit" class="btn btn-primary">Enviar</button>
                  <a th:href="@{/messages}" class="btn btn-secondary"
                    >Cancelar</a
                  >
                </form>
              </div>
            </div>
          </div>
        </div>
        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>
    <a class="scroll-to-top rounded" href="#page-top"
      ><i class="fas fa-angle-up"></i
    ></a>
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script>
      $(document).ready(function () {
        $(".select2").select2({
          theme: "classic",
        });
      });
    </script>
  </body>
</html>
