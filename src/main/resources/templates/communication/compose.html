<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Redactar Mensaje</title>
    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"
      rel="stylesheet"
    />
  </head>
  <body id="page-top">
    <div id="wrapper">
      <nav
        aria-label="Menú principal"
        th:replace="~{fragments/sb-admin-sidebar :: sidebar}"
      ></nav>
      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <header
            th:replace="~{fragments/sb-admin-topbar :: topbar}"
            aria-label="Barra superior"
          ></header>
          <div class="container-fluid" aria-labelledby="compose-title">
            <h1 id="compose-title" class="h3 mb-4 text-gray-800">
              <i class="fas fa-pen mr-2 text-primary"></i>Nuevo Mensaje
            </h1>

            <section
              class="card shadow mb-4"
              aria-label="Formulario de mensaje"
            >
              <div class="card-body">
                <form
                  th:action="@{/messages/send}"
                  method="post"
                  class="needs-validation"
                  novalidate
                  aria-describedby="compose-title"
                >
                  <div class="form-group">
                    <label for="receiverId" class="font-weight-bold"
                      >Destinatario <span class="text-danger">*</span></label
                    >
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text"
                          ><i class="fas fa-user-tag text-primary"></i
                        ></span>
                      </div>
                      <select
                        class="form-control select2"
                        name="receiverId"
                        id="receiverId"
                        required
                        aria-required="true"
                        aria-label="Buscar usuario destinatario"
                      >
                        <option value="" disabled selected>
                          Buscar usuario...
                        </option>
                        <option
                          th:each="user : ${users}"
                          th:value="${user.id}"
                          th:text="${user.username + ' (' + user.role + ')'}"
                        ></option>
                      </select>
                    </div>
                  </div>

                  <div class="form-group">
                    <label for="subject" class="font-weight-bold"
                      >Asunto <span class="text-danger">*</span></label
                    >
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text"
                          ><i class="fas fa-pen-nib text-primary"></i
                        ></span>
                      </div>
                      <input
                        type="text"
                        class="form-control"
                        id="subject"
                        name="subject"
                        placeholder="Ej: Consulta sobre reunión de padres"
                        aria-label="Asunto del mensaje"
                        required
                      />
                    </div>
                  </div>

                  <div class="form-group">
                    <label for="content" class="font-weight-bold"
                      >Mensaje <span class="text-danger">*</span></label
                    >
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text"
                          ><i class="fas fa-envelope-open-text text-primary"></i
                        ></span>
                      </div>
                      <textarea
                        class="form-control"
                        id="content"
                        name="content"
                        rows="6"
                        placeholder="Escriba su mensaje aquí..."
                        required
                      ></textarea>
                    </div>
                  </div>

                  <hr />

                  <div class="form-group text-right">
                    <button
                      type="submit"
                      class="btn btn-primary px-4 shadow-sm"
                    >
                      <i class="fas fa-paper-plane mr-1"></i> Enviar Mensaje
                    </button>
                    <a
                      th:href="@{/messages}"
                      class="btn btn-secondary px-4 ml-2"
                    >
                      <i class="fas fa-times mr-1"></i> Cancelar
                    </a>
                  </div>
                </form>
              </div>
            </section>
            <!-- Cierre de la sección agregado aquí -->
          </div>
          <!-- Cierre del container-fluid -->
        </div>
        <!-- Cierre de #content -->

        <!-- FOOTER: Movido fuera de #content, directamente dentro de #content-wrapper -->
        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
      <!-- Cierre de #content-wrapper -->
    </div>
    <!-- Cierre de #wrapper -->

    <a class="scroll-to-top rounded" href="#page-top">
      <i class="fas fa-angle-up"></i>
    </a>
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script>
      $(document).ready(function () {
        $(".select2").select2({
          theme: "classic",
        });
      });

      (function () {
        "use strict";
        window.addEventListener(
          "load",
          function () {
            var forms = document.getElementsByClassName("needs-validation");
            var validation = Array.prototype.filter.call(
              forms,
              function (form) {
                form.addEventListener(
                  "submit",
                  function (event) {
                    if (form.checkValidity() === false) {
                      event.preventDefault();
                      event.stopPropagation();
                    }
                    form.classList.add("was-validated");
                  },
                  false,
                );
              },
            );
          },
          false,
        );
      })();
    </script>
  </body>
</html>
