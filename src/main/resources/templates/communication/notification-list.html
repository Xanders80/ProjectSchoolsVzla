<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Notificaciones</title>
    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>
  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>
      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>
          <div class="container-fluid">
            <h1 class="h3 mb-4 text-gray-800">Mis Notificaciones</h1>

            <div class="row">
              <div class="col-lg-8">
                <div class="card shadow mb-4">
                  <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">
                      Avisos Recientes
                    </h6>
                  </div>
                  <div class="card-body">
                    <div
                      th:if="${#lists.isEmpty(notifications.content)}"
                      class="alert alert-info"
                    >
                      No tienes notificaciones nuevas.
                    </div>
                    <div class="list-group">
                      <div
                        th:each="notif : ${notifications}"
                        class="list-group-item list-group-item-action flex-column align-items-start"
                        th:classappend="${!notif.read} ? 'active_custom_bg' : ''"
                      >
                        <!-- Custom styling for unread if needed -->
                        <div class="d-flex w-100 justify-content-between">
                          <h5 class="mb-1">
                            <i
                              class="fas"
                              th:classappend="${notif.type.name() == 'INFO'} ? 'fa-info-circle text-info' :
                                                      (${notif.type.name() == 'WARNING'} ? 'fa-exclamation-triangle text-warning' : 'fa-bell text-danger')"
                            ></i>
                            <span th:text="${notif.type}">Type</span>
                          </h5>
                          <small
                            th:text="${#temporals.format(notif.createdAt, 'dd-MM-yyyy HH:mm')}"
                            >Date</small
                          >
                        </div>
                        <p class="mb-1" th:text="${notif.message}">Message</p>

                        <small
                          th:if="${!notif.read}"
                          class="text-right d-block"
                        >
                          <button
                            class="btn btn-sm btn-link mark-read-btn"
                            th:data-id="${notif.id}"
                          >
                            Marcar como leída
                          </button>
                        </small>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>
    <a class="scroll-to-top rounded" href="#page-top"
      ><i class="fas fa-angle-up"></i
    ></a>
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
    <script th:src="@{/vendor/datatables/jquery.dataTables.min.js}"></script>
    <script
      th:src="@{/vendor/datatables/dataTables.bootstrap4.min.js}"
    ></script>
    <script th:src="@{/js/demo/datatables-demo.js}"></script>
    <script>
      $(document).ready(function () {
        $(".mark-read-btn").click(function (e) {
          e.preventDefault();
          var btn = $(this);
          var id = btn.data("id");
          // Check if CSRF token exists
          var token = $("meta[name='_csrf']").attr("content");
          var header = $("meta[name='_csrf_header']").attr("content");

          $.ajax({
            url: "/notifications/read/" + id,
            type: "POST",
            beforeSend: function (xhr) {
              if (token && header) {
                xhr.setRequestHeader(header, token);
              }
            },
            success: function (result) {
              btn.closest(".list-group-item").removeClass("font-weight-bold"); // or whatever style
              btn.remove();
            },
          });
        });
      });
    </script>
  </body>
</html>
