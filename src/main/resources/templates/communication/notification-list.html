<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Mis Notificaciones - Sistema de Gestión Escolar</title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>

  <body id="page-top">
    <div id="wrapper">
      <nav aria-label="Menú principal" th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></nav>

      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <header th:replace="~{fragments/sb-admin-topbar :: topbar}" aria-label="Barra superior"></header>

          <div class="container-fluid" aria-labelledby="notifications-title">
            <h1 id="notifications-title" class="h3 mb-4 text-gray-800">
              <i class="fas fa-bell mr-2 text-primary"></i>Mis Notificaciones
            </h1>

            <div class="row">
              <div class="col-lg-12">
                <section class="card shadow mb-4" aria-label="Historial de alertas">
                  <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">
                      Historial de Alertas
                    </h6>
                  </div>
                  <div class="card-body">
                    <ul class="list-group" aria-label="Lista de notificaciones">
                        <li
                          th:each="note : ${notifications}"
                          class="list-group-item list-group-item-action flex-column align-items-start"
                          th:classappend="${!note.read} ? 'bg-gray-100 border-left-primary' : ''"
                          aria-label="Notificación de tipo [[${note.type}]]"
                          aria-live="polite"
                        >
                        <div class="d-flex w-100 justify-content-between">
                          <h5 class="mb-1">
                            <i
                              class="fas mr-2"
                              th:classappend="${note.type.name() == 'INFO'} ? 'fa-info-circle text-info' :
                                                                      (${note.type.name() == 'WARNING'} ? 'fa-exclamation-triangle text-warning' : 'fa-bell text-danger')"
                              aria-hidden="true"
                            ></i>
                            <span th:text="${note.type}">Tipo</span>
                          </h5>
                          <small
                            th:text="${#temporals.format(note.createdAt, 'dd/MM/yyyy HH:mm')}"
                            aria-label="Fecha de notificación"
                          ></small>
                        </div>
                        <!-- ...existing code... -->
                            >Hace 3 días</small
                          >
                        </div>
                        <p class="mb-1" th:text="${note.message}">
                          Mensaje de la notificación.
                        </p>
                        <div
                          class="d-flex justify-content-between align-items-center mt-2"
                        >
                          <small class="text-muted" th:text="${note.priority}"
                            >Prioridad</small
                          >
                          <button
                            th:if="${!note.read}"
                            class="btn btn-sm btn-outline-primary mark-read-btn"
                            th:data-id="${note.id}"
                          >
                            <i class="fas fa-check"></i> Marcar como leída
                          </button>
                          <span
                            th:if="${note.read}"
                            class="badge badge-secondary"
                            >Leída</span
                          >
                        </div>
                      </div>
                      <div
                        th:if="${#lists.isEmpty(notifications.content)}"
                        class="list-group-item text-center text-muted"
                      >
                        No tienes notificaciones recientes.
                  </div>
                </section>
              </div>
            </div>

                    <!-- Pagination -->
                    <div th:if="${notifications.totalPages > 1}" class="mt-3">
                      <nav aria-label="Navegación de notificaciones">
                        <ul class="pagination justify-content-center">
                          <li
                            class="page-item"
                            th:classappend="${notifications.first} ? 'disabled'"
                          >
                            <a
                              class="page-link"
                              th:href="@{/notifications(page=${notifications.number - 1})}"
                              >Anterior</a
                            >
                          </li>
                          <li class="page-item disabled">
                            <a
                              class="page-link"
                              href="#"
                              th:text="${'Página ' + (notifications.number + 1) + ' de ' + notifications.totalPages}"
                            ></a>
                          </li>
                          <li
                            class="page-item"
                            th:classappend="${notifications.last} ? 'disabled'"
                          >
                            <a
                              class="page-link"
                              th:href="@{/notifications(page=${notifications.number + 1})}"
                              >Siguiente</a
                            >
                          </li>
                        </ul>
                      </nav>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            </div>
          </div>
          <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
        </div>
      </div>

    <a class="scroll-to-top rounded" href="#page-top"
      ><i class="fas fa-angle-up"></i
    ></a>
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
    <script>
      $(document).ready(function () {
        $(".mark-read-btn").click(function () {
          var btn = $(this);
          var id = btn.data("id");
          var token = $("meta[name='_csrf']").attr("content");
          var header = $("meta[name='_csrf_header']").attr("content");

          $.ajax({
            url: "/notifications/read/" + id,
            type: "POST",
            beforeSend: function (xhr) {
              if (header && token) {
                xhr.setRequestHeader(header, token);
              }
            },
            success: function (result) {
              location.reload();
            },
            error: function (err) {
              console.error("Error marking as read", err);
            },
          });
        });
      });
    </script>
  </body>
</html>
