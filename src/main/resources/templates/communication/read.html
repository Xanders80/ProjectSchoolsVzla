<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Leer Mensaje</title>
    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>
  <body id="page-top">
    <div id="wrapper">
      <nav
        aria-label="Menú principal"
        th:replace="~{fragments/sb-admin-sidebar :: sidebar}"
      ></nav>
      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <header
            th:replace="~{fragments/sb-admin-topbar :: topbar}"
            aria-label="Barra superior"
          ></header>
          <div class="container-fluid" aria-labelledby="read-title">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
            >
              <h1 id="read-title" class="h3 mb-0 text-gray-800">
                <i class="fas fa-envelope-open mr-2 text-primary"></i>Lectura de
                Mensaje
              </h1>
              <a
                th:href="@{/messages}"
                class="btn btn-sm btn-secondary shadow-sm"
                aria-label="Volver a la bandeja de mensajes"
              >
                <i class="fas fa-arrow-left fa-sm" aria-hidden="true"></i>
                Volver
              </a>
            </div>

            <section class="card shadow mb-4" aria-label="Detalle del mensaje">
              <div
                class="card-header py-3 d-flex flex-row align-items-center justify-content-between"
              >
                <h6
                  class="m-0 font-weight-bold text-primary"
                  th:text="${message.subject}"
                  aria-label="Asunto del mensaje"
                >
                  Asunto
                </h6>
                <span
                  class="text-muted small"
                  th:text="${#temporals.format(message.sentAt, 'dd-MM-yyyy HH:mm')}"
                  aria-label="Fecha de envío"
                  >Date</span
                >
              </div>
              <div class="card-body">
                <div class="mb-3">
                  <i class="fas fa-user-circle mr-1 text-gray-400"></i>
                  <strong
                    th:text="${message.sender.username == #authentication.name ? 'Para: ' : 'De: '}"
                  ></strong>
                  <span
                    th:text="${message.sender.username == #authentication.name ? message.receiver.username : message.sender.username}"
                    aria-label="Usuario"
                    >Usuario</span
                  >
                </div>
                <hr />
                <div
                  class="p-3 bg-light rounded"
                  style="min-height: 150px; white-space: pre-wrap"
                  th:text="${message.content}"
                >
                  Contenido del mensaje...
                </div>
                <hr />
                <!-- Reply Button -->
                <!-- Implementation: Prefill compose with Receiver=Sender -->
                <a
                  th:href="@{/messages/compose}"
                  class="btn btn-primary btn-icon-split btn-sm"
                >
                  <span class="icon text-white-50"
                    ><i class="fas fa-reply"></i
                  ></span>
                  <span class="text">Responder</span>
                </a>
              </div>
            </section>
          </div>
        </div>
        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
  </body>
</html>
