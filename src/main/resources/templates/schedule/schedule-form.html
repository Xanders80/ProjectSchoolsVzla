<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Formulario de Horario - Sistema de Gestión Escolar</title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>

  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>

      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>

          <div class="container-fluid">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
            >
              <h1 class="h3 mb-0 text-gray-800">
                <i class="fas fa-clock mr-2 text-primary"></i
                ><span
                  th:text="${scheduleEntry.id != null ? 'Editar Horario' : 'Nuevo Horario'}"
                  >Horario</span
                >
              </h1>
              <a th:href="@{/schedules}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Volver
              </a>
            </div>

            <div
              th:if="${error}"
              class="alert alert-danger alert-dismissible fade show"
              role="alert"
            >
              <i class="fas fa-exclamation-triangle"></i>
              <span th:text="${error}"></span>
              <button
                type="button"
                class="close"
                data-dismiss="alert"
                aria-label="Cerrar"
              >
                <span aria-hidden="true">&times;</span>
              </button>
            </div>

            <!-- Mensaje de éxito opcional -->
            <div
              th:if="${success}"
              class="alert alert-success alert-dismissible fade show"
              role="alert"
            >
              <i class="fas fa-check-circle"></i>
              <span th:text="${success}"></span>
              <button
                type="button"
                class="close"
                data-dismiss="alert"
                aria-label="Cerrar"
              >
                <span aria-hidden="true">&times;</span>
              </button>
            </div>

            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Información del Horario
                </h6>
              </div>
              <div class="card-body">
                <form
                  th:action="@{/schedules}"
                  th:object="${scheduleEntry}"
                  method="post"
                  class="needs-validation"
                  id="scheduleForm"
                  novalidate
                >
                  <input type="hidden" th:field="*{id}" />

                  <div class="row">
                    <div class="col-md-4">
                      <div class="form-group">
                        <label class="font-weight-bold"
                          >Día de la Semana
                          <span class="text-danger">*</span></label
                        >
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text"
                              ><i class="fas fa-calendar-alt text-primary"></i
                            ></span>
                          </div>
                          <select
                            th:field="*{dayOfWeek}"
                            class="form-control"
                            th:classappend="${#fields.hasErrors('dayOfWeek')} ? 'is-invalid' : ''"
                            required
                          >
                            <option value="">Seleccionar Día</option>
                            <option value="MONDAY">Lunes</option>
                            <option value="TUESDAY">Martes</option>
                            <option value="WEDNESDAY">Miércoles</option>
                            <option value="THURSDAY">Jueves</option>
                            <option value="FRIDAY">Viernes</option>
                            <option value="SATURDAY">Sábado</option>
                          </select>
                        </div>
                        <div
                          class="invalid-feedback"
                          th:if="${#fields.hasErrors('dayOfWeek')}"
                          th:errors="*{dayOfWeek}"
                        ></div>
                        <!-- Validación específica para unicidad (si el backend la reporta así) -->
                        <div
                          class="invalid-feedback"
                          th:if="${#fields.hasErrors('dayOfWeek')} and ${#fields.errors('dayOfWeek')[0].code == 'UniqueSchedule'}"
                        >
                          Ya existe un horario para esta sección en el día
                          seleccionado.
                        </div>
                      </div>
                    </div>
                    <div class="col-md-4">
                      <div class="form-group">
                        <label class="font-weight-bold"
                          >Hora de Inicio
                          <span class="text-danger">*</span></label
                        >
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text"
                              ><i class="fas fa-clock text-primary"></i
                            ></span>
                          </div>
                          <input
                            type="time"
                            th:field="*{startTime}"
                            class="form-control"
                            th:classappend="${#fields.hasErrors('startTime')} ? 'is-invalid' : ''"
                            id="startTime"
                            required
                          />
                        </div>
                        <!-- Feedback para errores del servidor en startTime -->
                        <div
                          class="invalid-feedback"
                          th:if="${#fields.hasErrors('startTime')}"
                          th:errors="*{startTime}"
                        ></div>
                      </div>
                    </div>
                    <div class="col-md-4">
                      <div class="form-group">
                        <label class="font-weight-bold"
                          >Hora de Fin <span class="text-danger">*</span></label
                        >
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text"
                              ><i class="fas fa-hourglass-end text-primary"></i
                            ></span>
                          </div>
                          <input
                            type="time"
                            th:field="*{endTime}"
                            class="form-control"
                            th:classappend="${#fields.hasErrors('endTime')} ? 'is-invalid' : ''"
                            id="endTime"
                            required
                          />
                        </div>
                        <!-- Feedback para errores del servidor en endTime -->
                        <div
                          class="invalid-feedback"
                          th:if="${#fields.hasErrors('endTime')}"
                          th:errors="*{endTime}"
                        ></div>
                        <!-- Feedback exclusivo para la validación de rango del lado del cliente -->
                        <div
                          class="invalid-feedback"
                          id="timeRangeErrorFeedback"
                          style="display: none"
                        >
                          La hora de inicio debe ser anterior a la hora de fin.
                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="form-group">
                    <label class="font-weight-bold"
                      >Sección <span class="text-danger">*</span></label
                    >
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text"
                          ><i class="fas fa-chalkboard-teacher text-primary"></i
                        ></span>
                      </div>
                      <select
                        th:field="*{section.id}"
                        class="form-control"
                        th:classappend="${#fields.hasErrors('section.id')} ? 'is-invalid' : ''"
                        required
                      >
                        <option value="">Seleccionar Sección...</option>
                        <option
                          th:each="section : ${sections}"
                          th:value="${section.id}"
                          th:text="${section.course?.name + ' - ' + section.name + ' (' + (section.teacher != null ? section.teacher.lastName : 'No Teacher') + ' - ' + (section.room != null ? section.room.roomNumber : 'No Room') + ')'}"
                        >
                          Section
                        </option>
                      </select>
                    </div>
                    <div
                      class="invalid-feedback"
                      th:if="${#fields.hasErrors('section.id')}"
                      th:errors="*{section.id}"
                    ></div>
                  </div>

                  <hr />

                  <div class="form-group text-right">
                    <button
                      type="submit"
                      class="btn btn-primary px-4 shadow-sm"
                    >
                      <i class="fas fa-save mr-1"></i> Guardar Horario
                    </button>
                    <a
                      th:href="@{/schedules}"
                      class="btn btn-secondary px-4 ml-2"
                    >
                      <i class="fas fa-times mr-1"></i> Cancelar
                    </a>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>

        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top"
      ><i class="fas fa-angle-up"></i
    ></a>
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>

    <script>
      let clientSideValidationActive = false; // Bandera para saber si la validación del cliente está activa

      function validateTimeRange() {
        const startTimeInput = document.getElementById("startTime");
        const endTimeInput = document.getElementById("endTime");
        const rangeFeedback = document.getElementById("timeRangeErrorFeedback");

        const startTimeValue = startTimeInput.value;
        const endTimeValue = endTimeInput.value;

        // Ocultar siempre el feedback de rango por defecto
        rangeFeedback.style.display = "none";

        if (startTimeValue && endTimeValue) {
          if (startTimeValue >= endTimeValue) {
            // Activar validación del lado del cliente
            clientSideValidationActive = true;

            // Marcar los campos como inválidos
            startTimeInput.classList.add("is-invalid");
            endTimeInput.classList.add("is-invalid");

            // Mostrar el feedback específico de rango
            rangeFeedback.style.display = "block";
            return false; // Indica error
          } else {
            // Si son válidas, limpiar la validación del cliente si estaba activa
            if (clientSideValidationActive) {
              startTimeInput.classList.remove("is-invalid");
              endTimeInput.classList.remove("is-invalid");
            }
            clientSideValidationActive = false; // Resetear bandera
            return true; // Indica éxito
          }
        }

        // Si uno o ambos están vacíos, limpiar la validación del cliente
        if (clientSideValidationActive) {
          startTimeInput.classList.remove("is-invalid");
          endTimeInput.classList.remove("is-invalid");
        }
        clientSideValidationActive = false; // Resetear bandera
        return true;
      }

      document
        .getElementById("scheduleForm")
        .addEventListener("submit", function (event) {
          const isTimeRangeValid = validateTimeRange();

          // Si la validación del cliente falla, prevenir el envío
          if (!isTimeRangeValid) {
            event.preventDefault();
            // Asegurar que el feedback esté visible al momento de prevenir el submit
            document.getElementById("timeRangeErrorFeedback").style.display =
              "block";
          }
        });

      // Validar en tiempo real al cambiar los valores
      document
        .getElementById("startTime")
        .addEventListener("change", validateTimeRange);
      document
        .getElementById("endTime")
        .addEventListener("change", validateTimeRange);

      (function () {
        "use strict";
        window.addEventListener(
          "load",
          function () {
            var forms = document.getElementsByClassName("needs-validation");
            var validation = Array.prototype.filter.call(
              forms,
              function (form) {
                form.addEventListener(
                  "submit",
                  function (event) {
                    // Ejecutar la validación personalizada antes de la de Bootstrap
                    const timeRangeValid = validateTimeRange();

                    // Si la validación de Bootstrap nativa falla (campos requeridos, etc.)
                    // o la nuestra falla, detener la propagación.
                    if (form.checkValidity() === false || !timeRangeValid) {
                      event.preventDefault();
                      event.stopPropagation();
                    }
                    // Aplicar la clase was-validated solo si la validación de Bootstrap falló
                    // No la aplicamos si solo falló la validación personalizada para evitar conflictos.
                    // Pero si la activamos, aseguramos que los mensajes del servidor también se muestren.
                    // La estrategia aquí es que si falla la validación de bootstrap, se activa fully.
                    // Si falla la personalizada, la manejamos nosotros sin was-validated.
                    if (form.checkValidity() === false) {
                      form.classList.add("was-validated");
                    } else if (timeRangeValid) {
                      // Si todo pasó, remover la clase para limpiar posibles estados anteriores de Bootstrap
                      form.classList.remove("was-validated");
                    }
                    // Si la validación personalizada falla, no se aplica was-validated para evitar conflicto con mensajes del servidor.
                  },
                  false,
                );
              },
            );
          },
          false,
        );
      })();
    </script>
  </body>
</html>
