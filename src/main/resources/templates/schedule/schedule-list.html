<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Horarios - Sistema de Gestión Escolar</title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>

  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>

      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>

          <div class="container-fluid">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
            >
              <h1 class="h3 mb-0 text-gray-800">Gestión de Horarios</h1>
              <a
                th:href="@{/schedules/new}"
                class="d-none d-sm-inline-block btn btn-sm btn-primary shadow-sm"
              >
                <i class="fas fa-plus fa-sm text-white-50"></i> Agregar Horario
              </a>
            </div>

            <div
              th:if="${error}"
              class="alert alert-danger alert-dismissible fade show"
              role="alert"
            >
              <i class="fas fa-exclamation-triangle"></i>
              <span th:text="${error}"></span>
              <button
                type="button"
                class="close"
                data-dismiss="alert"
                aria-label="Cerrar"
              >
                <span aria-hidden="true">&times;</span>
              </button>
            </div>

            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Entradas de Horario
                </h6>
              </div>
              <div class="card-body">
                <div class="table-responsive">
                  <table
                    class="table table-bordered"
                    width="100%"
                    cellspacing="0"
                  >
                    <thead>
                      <tr>
                        <th>ID</th>
                        <th>Día</th>
                        <th>Hora</th>
                        <th>Curso</th>
                        <th>Acciones</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr th:each="entry : ${scheduleEntries}">
                        <td th:text="${entry.id}">1</td>
                        <td th:text="${entry.dayOfWeek}">Lunes</td>
                        <td
                          th:text="${entry.startTime + ' - ' + entry.endTime}"
                        >
                          08:00 - 10:00
                        </td>
                        <td th:text="${entry.section?.course?.name}">
                          Math 101
                        </td>
                        <td>
                          <a
                            th:href="@{/schedules/edit/{id}(id=${entry.id})}"
                            class="btn btn-info btn-sm"
                          >
                            <i class="fas fa-edit"></i> Editar
                          </a>
                          <a
                            data-toggle="modal"
                            data-target="#deleteModal"
                            th:href="@{/schedules/delete/{id}(id=${entry.id})}"
                            class="btn btn-danger btn-sm delete-btn"
                            th:data-url="@{/schedules/delete/{id}(id=${entry.id})}"
                          >
                            <i class="fas fa-trash"></i> Eliminar
                          </a>
                        </td>
                      </tr>
                      <tr th:if="${#lists.isEmpty(scheduleEntries)}">
                        <td colspan="4" class="text-center text-muted">
                          No se encontraron horarios.
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top"
      ><i class="fas fa-angle-up"></i
    ></a>
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>
    <div th:replace="~{fragments/delete-modal :: deleteModal}"></div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>

    <script>
      $(document).ready(function () {
        $(".delete-btn").on("click", function () {
          var deleteUrl = $(this).data("url");
          $("#confirmDeleteBtn").attr("href", deleteUrl);
        });
      });
    </script>
  </body>
</html>
