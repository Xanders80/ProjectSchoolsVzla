<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Ficha de Salud - Sistema de Gestión Escolar</title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>

  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>

      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>

          <div class="container-fluid">
      <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">
          <i class="fas fa-heartbeat text-danger mr-2"></i>Salud y Bienestar
        </h1>
        <a th:href="@{/students}" class="btn btn-secondary btn-sm">
          <i class="fas fa-arrow-left"></i> Volver a Estudiantes
        </a>
      </div>

      <!-- Student Info Card -->
      <div class="card shadow mb-4">
        <div class="card-header py-3">
          <h6 class="m-0 font-weight-bold text-primary">
            Estudiante:
            <span th:text="${student.firstName + ' ' + student.lastName}"
              >Nombre</span
            >
            <small
              class="text-muted ml-2"
              th:text="${'(' + student.registrationNumber + ')'}"
              >(REG)</small
            >
          </h6>
        </div>
      </div>

      <div class="row">
        <!-- Medical Record Column -->
        <div class="col-lg-6">
          <div class="card shadow mb-4">
            <div
              class="card-header py-3 d-flex justify-content-between align-items-center"
            >
              <h6 class="m-0 font-weight-bold text-success">Ficha Médica</h6>
              <small th:if="${medicalRecord.lastUpdated}" class="text-muted">
                Act:
                <span
                  th:text="${#temporals.format(medicalRecord.lastUpdated, 'dd/MM/yyyy HH:mm')}"
                ></span>
              </small>
            </div>
            <div class="card-body">
              <form
                th:action="@{/health/student/{id}/record(id=${student.id})}"
                method="post"
                th:object="${medicalRecord}"
              >
                <div class="form-group row">
                  <label class="col-sm-4 col-form-label font-weight-bold"
                    >Grupo Sanguíneo</label
                  >
                  <div class="col-sm-8">
                    <select class="form-control" th:field="*{bloodType}">
                      <option value="">Seleccione...</option>
                      <option value="A+">A+</option>
                      <option value="A-">A-</option>
                      <option value="B+">B+</option>
                      <option value="B-">B-</option>
                      <option value="AB+">AB+</option>
                      <option value="AB-">AB-</option>
                      <option value="O+">O+</option>
                      <option value="O-">O-</option>
                    </select>
                  </div>
                </div>

                <div class="form-group">
                  <label class="font-weight-bold">Alergias</label>
                  <textarea
                    class="form-control"
                    th:field="*{allergies}"
                    rows="2"
                    placeholder="Ej: Penicilina, Maní..."
                  ></textarea>
                </div>

                <div class="form-group">
                  <label class="font-weight-bold">Medicamentos</label>
                  <textarea
                    class="form-control"
                    th:field="*{medications}"
                    rows="2"
                    placeholder="Medicamentos actuales..."
                  ></textarea>
                </div>

                <div class="form-group">
                  <label class="font-weight-bold"
                    >Condiciones / Enfermedades</label
                  >
                  <textarea
                    class="form-control"
                    th:field="*{conditions}"
                    rows="2"
                    placeholder="Ej: Asma, Diabetes..."
                  ></textarea>
                </div>

                <hr />
                <h6 class="font-weight-bold text-gray-800">
                  Contacto de Emergencia
                </h6>
                <div class="form-group row">
                  <label class="col-sm-4 col-form-label">Nombre</label>
                  <div class="col-sm-8">
                    <input
                      type="text"
                      class="form-control"
                      th:field="*{emergencyContactName}"
                    />
                  </div>
                </div>
                <div class="form-group row">
                  <label class="col-sm-4 col-form-label">Teléfono</label>
                  <div class="col-sm-8">
                    <input
                      type="text"
                      class="form-control"
                      th:field="*{emergencyContactPhone}"
                    />
                  </div>
                </div>

                <button type="submit" class="btn btn-success btn-block">
                  <i class="fas fa-save"></i> Guardar Ficha
                </button>
              </form>
            </div>
          </div>
        </div>

        <!-- Vaccines Column -->
        <div class="col-lg-6">
          <div class="card shadow mb-4">
            <div
              class="card-header py-3 d-flex justify-content-between align-items-center"
            >
              <h6 class="m-0 font-weight-bold text-info">Vacunación</h6>
              <button
                class="btn btn-info btn-sm"
                data-toggle="modal"
                data-target="#vaccineModal"
              >
                <i class="fas fa-plus"></i> Registrar
              </button>
            </div>
            <div class="card-body">
              <div class="table-responsive">
                <table
                  class="table table-bordered table-sm"
                  width="100%"
                  cellspacing="0"
                >
                  <thead>
                    <tr>
                      <th>Vacuna</th>
                      <th>Dosis</th>
                      <th>Fecha</th>
                      <th>Acción</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr th:each="vac : ${vaccines}">
                      <td th:text="${vac.name}">Covid</td>
                      <td th:text="${vac.doseNumber}">1</td>
                      <td th:text="${vac.administrationDate}">2025-01-01</td>
                      <td class="text-center">
                        <a
                          href="#"
                          class="btn btn-danger btn-circle btn-sm"
                          data-toggle="modal"
                          data-target="#deleteModal"
                          th:data-url="@{/health/vaccine/delete/{id}(id=${vac.id}, studentId=${student.id})}"
                        >
                          <i class="fas fa-trash"></i>
                        </a>
                      </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(vaccines)}">
                      <td colspan="4" class="text-center text-muted">
                        Sin registros
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Add Vaccine Modal -->
      <div
        class="modal fade"
        id="vaccineModal"
        tabindex="-1"
        role="dialog"
        aria-hidden="true"
      >
        <div class="modal-dialog" role="document">
          <div class="modal-content">
            <form
              th:action="@{/health/student/{id}/vaccine(id=${student.id})}"
              method="post"
              th:object="${newVaccine}"
            >
              <div class="modal-header">
                <h5 class="modal-title">Registrar Vacuna</h5>
                <button
                  type="button"
                  class="close"
                  data-dismiss="modal"
                  aria-label="Close"
                >
                  <span aria-hidden="true">&times;</span>
                </button>
              </div>
              <div class="modal-body">
                <div class="form-group">
                  <label>Nombre de Vacuna *</label>
                  <input
                    type="text"
                    class="form-control"
                    th:field="*{name}"
                    required
                  />
                </div>
                <div class="form-group">
                  <label>Número de Dosis</label>
                  <input
                    type="number"
                    class="form-control"
                    th:field="*{doseNumber}"
                    min="1"
                  />
                </div>
                <div class="form-group">
                  <label>Fecha de Administración *</label>
                  <input
                    type="date"
                    class="form-control"
                    th:field="*{administrationDate}"
                    required
                  />
                </div>
                <div class="form-group">
                  <label>Fecha de Vencimiento (opcional)</label>
                  <input
                    type="date"
                    class="form-control"
                    th:field="*{expirationDate}"
                  />
                </div>
              </div>
              <div class="modal-footer">
                <button
                  type="button"
                  class="btn btn-secondary"
                  data-dismiss="modal"
                >
                  Cancelar
                </button>
                <button type="submit" class="btn btn-primary">Guardar</button>
              </div>
            </form>
          </div>
        </div>
        <div th:replace="~{fragments/delete-modal :: deleteModal}"></div>
          </div>
        </div>

        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top"
      ><i class="fas fa-angle-up"></i
    ></a>
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
    
    <script>
      $("#deleteModal").on("show.bs.modal", function (event) {
        var button = $(event.relatedTarget);
        var url = button.data("url");
        var modal = $(this);
        modal.find("#deleteForm").attr("action", url);
      });
    </script>
  </body>
</html>
