<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Ficha de Salud - Sistema de Gestión Escolar</title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
    <th:block th:replace="~{fragments/select2-scripts :: select2-assets}"></th:block>
  </head>

  <body id="page-top" role="main">
    <div id="wrapper" role="region" aria-label="Contenedor principal">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>

      <div id="content-wrapper" class="d-flex flex-column" role="region" aria-label="Contenido principal">
        <div id="content" tabindex="-1">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>

          <div class="container-fluid" role="main">
      <div class="d-sm-flex align-items-center justify-content-between mb-4" role="heading" aria-level="1">
        <h1 class="h3 mb-0 text-gray-800">
          <i class="fas fa-heartbeat text-danger mr-2" aria-hidden="true"></i>Salud y Bienestar
        </h1>
        <a th:href="@{/students}" class="btn btn-secondary btn-sm" aria-label="Volver a Estudiantes">
          <i class="fas fa-arrow-left" aria-hidden="true"></i> Volver a Estudiantes
        </a>
      </div>

      <!-- Student Info Card -->
      <div class="card shadow mb-4">
        <div class="card-header py-3">
          <h6 class="m-0 font-weight-bold text-primary">
            Estudiante:
            <span th:text="${student.firstName + ' ' + student.lastName}"
              >Nombre</span
            >
            <small
              class="text-muted ml-2"
              th:text="${'(' + student.registrationNumber + ')'}"
              >(REG)</small
            >
          </h6>
        </div>
      </div>

      <div class="row">
        <!-- Medical Record Column -->
        <div class="col-lg-6">
          <div class="card shadow mb-4">
            <div
              class="card-header py-3 d-flex justify-content-between align-items-center"
            >
              <h6 class="m-0 font-weight-bold text-success"><i class="fas fa-file-medical text-success mr-2"></i>Ficha Médica</h6>
              <small th:if="${medicalRecord.lastUpdated}" class="text-muted">
                Act:
                <span
                  th:text="${#temporals.format(medicalRecord.lastUpdated, 'dd/MM/yyyy HH:mm')}"
                ></span>
              </small>
            </div>
            <div class="card-body">
              <form
                th:action="@{/health/student/{id}/record(id=${student.id})}"
                method="post"
                th:object="${medicalRecord}"
              >
                <div class="form-group row">
                  <label class="col-sm-4 col-form-label font-weight-bold">Grupo Sanguíneo</label>
                  <div class="col-sm-8">
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text"><i class="fas fa-tint text-danger"></i></span>
                      </div>
                      <select class="form-control" th:field="*{bloodType}">
                        <option value="">Seleccione...</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                      </select>
                    </div>
                  </div>
                </div>

                <div class="form-group">
                  <label class="font-weight-bold">Alergias</label>
                  <div class="input-group">
                    <div class="input-group-prepend">
                      <span class="input-group-text"><i class="fas fa-exclamation-triangle text-warning"></i></span>
                    </div>
                    <textarea
                      class="form-control"
                      th:field="*{allergies}"
                      rows="2"
                      placeholder="Ej: Penicilina, Maní..."
                    ></textarea>
                  </div>
                </div>

                <div class="form-group">
                  <label class="font-weight-bold">Medicamentos</label>
                  <div class="input-group">
                    <div class="input-group-prepend">
                      <span class="input-group-text"><i class="fas fa-pills text-primary"></i></span>
                    </div>
                    <textarea
                      class="form-control"
                      th:field="*{medications}"
                      rows="2"
                      placeholder="Medicamentos actuales..."
                    ></textarea>
                  </div>
                </div>

                <div class="form-group">
                  <label class="font-weight-bold">Condiciones / Enfermedades</label>
                  <div class="input-group">
                    <div class="input-group-prepend">
                      <span class="input-group-text"><i class="fas fa-stethoscope text-info"></i></span>
                    </div>
                    <textarea
                      class="form-control"
                      th:field="*{conditions}"
                      rows="2"
                      placeholder="Ej: Asma, Diabetes..."
                    ></textarea>
                  </div>
                </div>

                <hr />
                <h6 class="font-weight-bold text-gray-800">
                  Contacto de Emergencia
                </h6>
                <div class="form-group row">
                  <label class="col-sm-4 col-form-label font-weight-bold">Nombre</label>
                  <div class="col-sm-8">
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text"><i class="fas fa-user text-primary"></i></span>
                      </div>
                      <input
                        type="text"
                        class="form-control"
                        th:field="*{emergencyContactName}"
                        placeholder="Nombre completo"
                      />
                    </div>
                  </div>
                </div>
                <div class="form-group row">
                  <label class="col-sm-4 col-form-label font-weight-bold">Teléfono</label>
                  <div class="col-sm-8">
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text"><i class="fas fa-phone text-primary"></i></span>
                      </div>
                      <input
                        type="text"
                        class="form-control"
                        th:field="*{emergencyContactPhone}"
                        placeholder="Ej: +51 999 888 777"
                      />
                    </div>
                  </div>
                </div>

                <div class="form-group text-right mt-4">
                  <button type="submit" class="btn btn-success px-4 shadow-sm">
                    <i class="fas fa-save mr-1"></i> Guardar Ficha
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <!-- Vaccines Column -->
        <div class="col-lg-6">
          <div class="card shadow mb-4">
            <div
              class="card-header py-3 d-flex justify-content-between align-items-center"
            >
              <h6 class="m-0 font-weight-bold text-info"><i class="fas fa-syringe text-info mr-2"></i>Vacunación</h6>
              <button
                class="btn btn-info btn-sm"
                data-toggle="modal"
                data-target="#vaccineModal"
              >
                <i class="fas fa-plus"></i> Registrar
              </button>
            </div>
            <div class="card-body">
              <div class="table-responsive">
                <table
                  class="table table-bordered table-sm"
                  width="100%"
                  cellspacing="0"
                >
                  <thead>
                    <tr>
                      <th>Vacuna</th>
                      <th>Dosis</th>
                      <th>Fecha</th>
                      <th>Acción</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr th:each="vac : ${vaccines}">
                      <td th:text="${vac.name}">Covid</td>
                      <td th:text="${vac.doseNumber}">1</td>
                      <td th:text="${vac.administrationDate}">2025-01-01</td>
                      <td class="text-center">
                        <button
                          type="button"
                          class="btn btn-danger btn-circle btn-sm"
                          data-toggle="modal"
                          data-target="#deleteModal"
                          th:onclick="'confirmDelete(\'' + @{/health/vaccine/delete/{id}(id=${vac.id}, studentId=${student.id})} + '\')'"
                        >
                          <i class="fas fa-trash"></i>
                        </button>
                      </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(vaccines)}">
                      <td colspan="4" class="text-center text-muted">
                        Sin registros
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Add Vaccine Modal -->
      <div
        class="modal fade"
        id="vaccineModal"
        tabindex="-1"
        role="dialog"
        aria-hidden="true"
      >
        <div class="modal-dialog" role="document">
          <div class="modal-content">
            <form
              th:action="@{/health/student/{id}/vaccine(id=${student.id})}"
              method="post"
              th:object="${newVaccine}"
            >
              <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-shield-virus text-primary mr-2"></i>Registrar Vacuna</h5>
                <button
                  type="button"
                  class="close"
                  data-dismiss="modal"
                  aria-label="Close"
                >
                  <span aria-hidden="true">&times;</span>
                </button>
              </div>
              <div class="modal-body">
                <div class="form-group">
                  <label class="font-weight-bold">Nombre de Vacuna <span class="text-danger">*</span></label>
                  <div class="input-group">
                    <div class="input-group-prepend">
                      <span class="input-group-text"><i class="fas fa-syringe text-primary"></i></span>
                    </div>
                    <input
                      type="text"
                      class="form-control"
                      th:field="*{name}"
                      placeholder="Nombre de la vacuna"
                      required
                    />
                  </div>
                </div>
                <div class="form-group">
                  <label class="font-weight-bold">Número de Dosis</label>
                  <div class="input-group">
                    <div class="input-group-prepend">
                      <span class="input-group-text"><i class="fas fa-list-ol text-primary"></i></span>
                    </div>
                    <input
                      type="number"
                      class="form-control"
                      th:field="*{doseNumber}"
                      min="1"
                      placeholder="1"
                    />
                  </div>
                </div>
                <div class="form-group">
                  <label class="font-weight-bold">Fecha de Administración <span class="text-danger">*</span></label>
                  <div class="input-group">
                    <div class="input-group-prepend">
                      <span class="input-group-text"><i class="fas fa-calendar-day text-primary"></i></span>
                    </div>
                    <input
                      type="date"
                      class="form-control"
                      th:field="*{administrationDate}"
                      required
                    />
                  </div>
                </div>
                <div class="form-group">
                  <label class="font-weight-bold">Fecha de Vencimiento (opcional)</label>
                  <div class="input-group">
                    <div class="input-group-prepend">
                      <span class="input-group-text"><i class="fas fa-calendar-check text-primary"></i></span>
                    </div>
                    <input
                      type="date"
                      class="form-control"
                      th:field="*{expirationDate}"
                    />
                  </div>
                </div>
              </div>
              <div class="modal-footer justify-content-end">
                <button
                  type="button"
                  class="btn btn-secondary px-4"
                  data-dismiss="modal"
                >
                  <i class="fas fa-times mr-1"></i> Cancelar
                </button>
                <button type="submit" class="btn btn-primary px-4 shadow-sm ml-2">
                  <i class="fas fa-save mr-1"></i> Guardar
                </button>
              </div>
            </form>
          </div>
        </div>
        </div>
      </div>

        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top"
      ><i class="fas fa-angle-up"></i
    ></a>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
    <th:block th:replace="~{fragments/select2-scripts :: select2-scripts}"></th:block>

    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>
    <div th:replace="~{fragments/delete-modal :: deleteModal}"></div>
  </body>
</html>
