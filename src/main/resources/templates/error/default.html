<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Error Inesperado</title>

    <!-- Custom fonts -->
    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />

    <!-- Custom styles -->
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>
  <body id="page-top" role="main">
    <!-- Page Wrapper -->
    <div id="wrapper" role="region" aria-label="Contenedor principal">
      <!-- Content Wrapper -->
      <div
        id="content-wrapper"
        class="d-flex flex-column"
        role="region"
        aria-label="Contenido principal"
      >
        <!-- Main Content -->
        <div id="content" tabindex="-1">
          <!-- Begin Page Content -->
          <div class="container-fluid" role="main">
            <!-- Unexpected Error Alert -->
            <div class="container text-center mt-5" role="main">
              <div class="alert alert-dark" role="alert" aria-live="assertive">
                <h1 class="display-3" role="heading" aria-level="1">Error</h1>
                <h2 class="alert-heading" role="heading" aria-level="2">
                  Ha ocurrido un error inesperado
                </h2>
                <p>
                  Por favor, intenta de nuevo más tarde o contacta al
                  administrador del sistema.
                </p>
                <hr />
                <a
                  th:href="@{/}"
                  class="btn btn-secondary"
                  aria-label="Ir a la página de inicio"
                  >Ir a la página de inicio</a
                >
              </div>
            </div>
          </div>
          <!-- /.container-fluid -->
        </div>
        <!-- End of Main Content -->

        <!-- Footer -->
        <footer class="sticky-footer bg-white">
          <div class="container my-auto">
            <div class="copyright text-center my-auto">
              <span>Copyright &copy; SchoolOne 2025</span>
            </div>
          </div>
        </footer>
        <!-- End of Footer -->
      </div>
      <!-- End of Content Wrapper -->
    </div>
    <!-- End of Page Wrapper -->

    <!-- Scroll to Top Button-->
    <a class="scroll-to-top rounded" href="#page-top">
      <i class="fas fa-angle-up"></i>
    </a>

    <!-- Bootstrap core JavaScript-->
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

    <!-- Core plugin JavaScript-->
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>

    <!-- Custom scripts for all pages-->
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
  </body>
</html>
