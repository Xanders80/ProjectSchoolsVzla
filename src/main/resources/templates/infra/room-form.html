<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Formulario de Aula - Sistema de Gestión Escolar</title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
    <th:block
      th:replace="~{fragments/select2-scripts :: select2-assets}"
    ></th:block>
  </head>

  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>

      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>

          <div class="container-fluid">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
            >
              <h1 class="h3 mb-0 text-gray-800">
                <i class="fas fa-door-open mr-2 text-primary"></i
                ><span
                  th:text="${room.id != null ? 'Editar Aula' : 'Nueva Aula'}"
                  >Aula</span
                >
              </h1>
              <a th:href="@{/infra/rooms}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Volver
              </a>
            </div>

            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Información del Aula
                </h6>
              </div>
              <div class="card-body">
                <form
                  th:action="@{/infra/rooms}"
                  th:object="${room}"
                  method="post"
                  class="needs-validation"
                  novalidate
                >
                  <input type="hidden" th:field="*{id}" />

                  <div class="row">
                    <div class="col-md-4">
                      <div class="form-group">
                        <label class="font-weight-bold"
                          >Número de Aula
                          <span class="text-danger">*</span></label
                        >
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text"
                              ><i class="fas fa-hashtag text-primary"></i
                            ></span>
                          </div>
                          <input
                            type="text"
                            th:field="*{roomNumber}"
                            class="form-control"
                            placeholder="Ej: 101"
                            required
                          />
                        </div>
                      </div>
                    </div>
                    <div class="col-md-4">
                      <div class="form-group">
                        <label class="font-weight-bold"
                          >Tipo <span class="text-danger">*</span></label
                        >
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text"
                              ><i class="fas fa-door-open text-primary"></i
                            ></span>
                          </div>
                          <select
                            th:field="*{type}"
                            class="form-control"
                            required
                          >
                            <option value="">Seleccione...</option>
                            <option value="CLASSROOM">Aula Regular</option>
                            <option value="LAB">Laboratorio</option>
                            <option value="OFFICE">Oficina</option>
                            <option value="AUDITORIUM">Auditorio</option>
                            <option value="LIBRARY">Biblioteca</option>
                          </select>
                        </div>
                        <small class="form-text text-muted">
                          Para laboratorios se habilitan reservas
                        </small>
                      </div>
                    </div>
                    <div class="col-md-4">
                      <div class="form-group">
                        <label class="font-weight-bold"
                          >Capacidad <span class="text-danger">*</span></label
                        >
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text"
                              ><i class="fas fa-users text-primary"></i
                            ></span>
                          </div>
                          <input
                            type="number"
                            th:field="*{capacity}"
                            class="form-control"
                            placeholder="0"
                            required
                          />
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="form-group">
                    <label class="font-weight-bold"
                      >Edificio <span class="text-danger">*</span></label
                    >
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text"
                          ><i class="fas fa-city text-primary"></i
                        ></span>
                      </div>
                      <select
                        th:field="*{building.id}"
                        class="form-control"
                        required
                      >
                        <option value="">Seleccionar Edificio...</option>
                        <option
                          th:each="building : ${buildings}"
                          th:value="${building.id}"
                          th:text="${building.name}"
                        >
                          <i class="fas fa-city text-primary"></i>
                          <span th:text="${building.name}"></span>
                        </option>
                      </select>
                    </div>
                  </div>

                  <hr />

                  <div class="form-group text-right">
                    <button
                      type="submit"
                      class="btn btn-primary px-4 shadow-sm"
                    >
                      <i class="fas fa-save mr-1"></i> Guardar Aula
                    </button>
                    <a
                      th:href="@{/infra/rooms}"
                      class="btn btn-secondary px-4 ml-2"
                    >
                      <i class="fas fa-times mr-1"></i> Cancelar
                    </a>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>

        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top"
      ><i class="fas fa-angle-up"></i
    ></a>
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
    <th:block
      th:replace="~{fragments/select2-scripts :: select2-scripts}"
    ></th:block>
    <script>
      (function () {
        "use strict";
        window.addEventListener(
          "load",
          function () {
            var forms = document.getElementsByClassName("needs-validation");
            var validation = Array.prototype.filter.call(
              forms,
              function (form) {
                form.addEventListener(
                  "submit",
                  function (event) {
                    if (form.checkValidity() === false) {
                      event.preventDefault();
                      event.stopPropagation();
                    }
                    form.classList.add("was-validated");
                  },
                  false,
                );
              },
            );
          },
          false,
        );
      })();
    </script>
  </body>
</html>
