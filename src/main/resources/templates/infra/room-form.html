<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Formulario de Aula - Sistema de Gestión Escolar</title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>

  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>

      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>

          <div class="container-fluid">
            <h1 class="h3 mb-4 text-gray-800">Formulario de Aula</h1>

            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Información del Aula
                </h6>
              </div>
              <div class="card-body">
                <form
                  th:action="@{/infra/rooms/save}"
                  th:object="${room}"
                  method="post"
                >
                  <input type="hidden" th:field="*{id}" />

                  <div class="row">
                    <div class="col-md-4">
                      <div class="form-group">
                        <label>Número de Aula</label>
                        <input
                          type="text"
                          th:field="*{roomNumber}"
                          class="form-control"
                          required
                        />
                      </div>
                    </div>
                    <div class="col-md-4">
                      <div class="form-group">
                        <label>Tipo</label>
                        <input
                          type="text"
                          th:field="*{type}"
                          class="form-control"
                          required
                        />
                      </div>
                    </div>
                    <div class="col-md-4">
                      <div class="form-group">
                        <label>Capacidad</label>
                        <input
                          type="number"
                          th:field="*{capacity}"
                          class="form-control"
                          required
                        />
                      </div>
                    </div>
                  </div>

                  <div class="form-group">
                    <label>Edificio</label>
                    <select
                      th:field="*{building.id}"
                      class="form-control"
                      required
                    >
                      <option value="">Seleccionar Edificio</option>
                      <option
                        th:each="building : ${buildings}"
                        th:value="${building.id}"
                        th:text="${building.name}"
                      >
                        Building Name
                      </option>
                    </select>
                  </div>

                  <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Guardar Aula
                  </button>
                  <a th:href="@{/infra/rooms}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Cancelar
                  </a>
                </form>
              </div>
            </div>
          </div>
        </div>

        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top"
      ><i class="fas fa-angle-up"></i
    ></a>
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
  </body>
</html>
