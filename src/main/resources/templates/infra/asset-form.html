<!DOCTYPE html>
<html lang="es"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Formulario de Activo - Sistema de Gestión Escolar</title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>

  <body id="page-top">
    <div id="wrapper">
      <nav aria-label="Menú principal" th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></nav>
      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <header th:replace="~{fragments/sb-admin-topbar :: topbar}" aria-label="Barra superior"></header>

          <div class="container-fluid" aria-labelledby="asset-form-title">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
            >
              <h1 id="asset-form-title" class="h3 mb-0 text-gray-800">
                <i class="fas fa-boxes mr-2 text-primary"></i><span th:text="${asset.id != null ? 'Editar Activo' : 'Nuevo Activo'}">Nuevo Activo</span>
              </h1>
              <a th:href="@{/infra/assets}" class="btn btn-secondary" aria-label="Volver a la lista de activos">
                <i class="fas fa-arrow-left" aria-hidden="true"></i> Volver
              </a>
            </div>

            <div
              th:if="${errorMessage}"
              class="alert alert-danger alert-dismissible fade show"
              role="alert"
              aria-live="assertive"
            >
              <span th:text="${errorMessage}"></span>
              <button
                type="button"
                class="close"
                data-dismiss="alert"
                aria-label="Cerrar alerta"
              >
                <span aria-hidden="true">&times;</span>
              </button>
            </div>

            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Información del Activo
                </h6>
              </div>
              <div class="card-body">
                <form
                  th:action="@{/infra/assets}"
                  th:object="${asset}"
                  method="post"
                  class="needs-validation"
                  novalidate
                >
                  <input type="hidden" th:field="*{id}" />

                  <div class="row">
                    <div class="col-md-6">
                      <div class="form-group">
                        <label for="name" class="font-weight-bold"
                          >Nombre del Activo
                          <span class="text-danger">*</span></label
                        >
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-tag"></i></span>
                          </div>
                          <input
                            type="text"
                            class="form-control"
                            id="name"
                            th:field="*{name}"
                            th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                            placeholder="Ej: Proyector Epson EB-X41"
                            required
                          />
                          <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                            El nombre es obligatorio.
                          </div>
                        </div>
                      </div>
                    </div>

                    <div class="col-md-6">
                      <div class="form-group">
                        <label for="type" class="font-weight-bold"
                          >Tipo de Activo
                          <span class="text-danger">*</span></label
                        >
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-list"></i></span>
                          </div>
                          <select
                            class="form-control"
                            id="type"
                            th:field="*{type}"
                            th:classappend="${#fields.hasErrors('type')} ? 'is-invalid'"
                            required
                          >
                            <option value="">Seleccione un tipo</option>
                            <option value="Electronics">Electrónica</option>
                            <option value="Furniture">Mobiliario</option>
                            <option value="Computer">Computación</option>
                            <option value="Laboratory">Laboratorio</option>
                            <option value="Sports">Deportes</option>
                            <option value="Other">Otro</option>
                          </select>
                          <div class="invalid-feedback" th:if="${#fields.hasErrors('type')}" th:errors="*{type}">
                            El tipo de activo es obligatorio.
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="row">
                    <div class="col-md-6">
                      <div class="form-group">
                        <label for="serialNumber" class="font-weight-bold">Número de Serie</label>
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-barcode"></i></span>
                          </div>
                          <input
                            type="text"
                            class="form-control"
                            id="serialNumber"
                            th:field="*{serialNumber}"
                            th:classappend="${#fields.hasErrors('serialNumber')} ? 'is-invalid'"
                            placeholder="Ej: SN123456789"
                          />
                          <div class="invalid-feedback" th:if="${#fields.hasErrors('serialNumber')}" th:errors="*{serialNumber}"></div>
                        </div>
                        <small class="form-text text-muted"
                          >Identificador único del fabricante (Opcional)</small
                        >
                      </div>
                    </div>

                    <div class="col-md-6">
                      <div class="form-group">
                        <label for="purchaseDate" class="font-weight-bold">Fecha de Compra</label>
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-calendar-alt"></i></span>
                          </div>
                          <input
                            type="date"
                            class="form-control"
                            id="purchaseDate"
                            th:field="*{purchaseDate}"
                            th:classappend="${#fields.hasErrors('purchaseDate')} ? 'is-invalid'"
                          />
                          <div class="invalid-feedback" th:if="${#fields.hasErrors('purchaseDate')}" th:errors="*{purchaseDate}"></div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="row">
                    <div class="col-md-6">
                      <div class="form-group">
                        <label for="room" class="font-weight-bold">Ubicación (Sala)</label>
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-door-open"></i></span>
                          </div>
                          <select
                            class="form-control"
                            id="room"
                            th:field="*{room}"
                          >
                            <option value="">Sin asignar</option>
                            <option
                              th:each="room : ${rooms}"
                              th:value="${room.id}"
                              th:text="${room.name}"
                            >
                              Sala 101
                            </option>
                          </select>
                        </div>
                        <small class="form-text text-muted"
                          >Seleccione la sala donde se encuentra el activo</small
                        >
                      </div>
                    </div>
                  </div>

                  <hr />

                  <div class="form-group text-right">
                    <button type="submit" class="btn btn-primary px-4 shadow-sm">
                      <i class="fas fa-save mr-1"></i> Guardar Activo
                    </button>
                    <a th:href="@{/infra/assets}" class="btn btn-secondary px-4 ml-2">
                      <i class="fas fa-times mr-1"></i> Cancelar
                    </a>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
            </div>
          </div>
          <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
        </div>
      </div>

    <a class="scroll-to-top rounded" href="#page-top"
      ><i class="fas fa-angle-up"></i
    ></a>
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
  </body>
</html>
