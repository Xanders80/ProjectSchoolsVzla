<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Solicitud de Mantenimiento - Sistema de Gestión Escolar</title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>

  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>
      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>

          <div class="container-fluid">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
            >
              <h1
                class="h3 mb-0 text-gray-800"
                th:text="${request.id != null ? 'Editar Solicitud' : 'Nueva Solicitud de Mantenimiento'}"
              >
                Nueva Solicitud
              </h1>
              <a th:href="@{/infra/maintenance}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Volver
              </a>
            </div>

            <div
              th:if="${errorMessage}"
              class="alert alert-danger alert-dismissible fade show"
              role="alert"
            >
              <span th:text="${errorMessage}"></span>
              <button
                type="button"
                class="close"
                data-dismiss="alert"
                aria-label="Close"
              >
                <span aria-hidden="true">&times;</span>
              </button>
            </div>

            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Información de la Solicitud
                </h6>
              </div>
              <div class="card-body">
                <form
                  th:action="@{/infra/maintenance}"
                  th:object="${request}"
                  method="post"
                >
                  <input type="hidden" th:field="*{id}" />
                  <input type="hidden" th:field="*{requestedBy}" />
                  <input type="hidden" th:field="*{requestDate}" />
                  <input type="hidden" th:field="*{completionDate}" />

                  <!-- Read-only Context Fields (Only if editing) -->
                  <div class="row" th:if="${request.id != null}">
                    <div class="col-md-4">
                      <div class="form-group">
                        <label>Solicitado Por</label>
                        <input
                          type="text"
                          class="form-control"
                          th:value="${request.requestedBy != null ? request.requestedBy.username : 'N/A'}"
                          readonly
                        />
                      </div>
                    </div>
                    <div class="col-md-4">
                      <div class="form-group">
                        <label>Fecha Solicitud</label>
                        <input
                          type="text"
                          class="form-control"
                          th:value="${#temporals.format(request.requestDate, 'dd/MM/yyyy HH:mm')}"
                          readonly
                        />
                      </div>
                    </div>
                    <!-- Completion Date (Only if completed) -->
                    <div
                      class="col-md-4"
                      th:if="${request.completionDate != null}"
                    >
                      <div class="form-group">
                        <label>Fecha Completado</label>
                        <input
                          type="text"
                          class="form-control"
                          th:value="${#temporals.format(request.completionDate, 'dd/MM/yyyy HH:mm')}"
                          readonly
                        />
                      </div>
                    </div>
                  </div>

                  <div class="row">
                    <div class="col-md-6">
                      <div class="form-group">
                        <label for="room"
                          >Ubicación (Sala)
                          <span class="text-danger">*</span></label
                        >
                        <select
                          class="form-control"
                          id="room"
                          th:field="*{room}"
                        >
                          <option value="">Seleccione una sala</option>
                          <option
                            th:each="room : ${rooms}"
                            th:value="${room.id}"
                            th:text="${room.name}"
                          >
                            Sala 101
                          </option>
                        </select>
                        <small class="form-text text-muted"
                          >Seleccione el lugar donde se requiere el
                          mantenimiento</small
                        >
                      </div>
                    </div>

                    <div class="col-md-6">
                      <div class="form-group">
                        <label for="status">Estado</label>
                        <select
                          class="form-control"
                          id="status"
                          th:field="*{status}"
                        >
                          <option value="PENDING">Pendiente</option>
                          <option value="IN_PROGRESS">En Progreso</option>
                          <option value="COMPLETED">Completado</option>
                        </select>
                      </div>
                    </div>
                  </div>

                  <div class="row">
                    <div class="col-md-12">
                      <div class="form-group">
                        <label for="description"
                          >Descripción del Problema
                          <span class="text-danger">*</span></label
                        >
                        <textarea
                          class="form-control"
                          id="description"
                          th:field="*{description}"
                          rows="5"
                          required
                          placeholder="Describa detalladamente el problema..."
                        ></textarea>
                        <small
                          class="form-text text-danger"
                          th:if="${#fields.hasErrors('description')}"
                          th:errors="*{description}"
                        ></small>
                      </div>
                    </div>
                  </div>

                  <div class="alert alert-info" role="alert">
                    <i class="fas fa-info-circle"></i>
                    <strong>Nota:</strong> La solicitud será registrada a su
                    nombre.
                  </div>

                  <hr />

                  <div class="form-group">
                    <button type="submit" class="btn btn-primary">
                      <i class="fas fa-save"></i> Guardar Solicitud
                    </button>
                    <a
                      th:href="@{/infra/maintenance}"
                      class="btn btn-secondary"
                    >
                      <i class="fas fa-times"></i> Cancelar
                    </a>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top"
      ><i class="fas fa-angle-up"></i
    ></a>
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
  </body>
</html>
