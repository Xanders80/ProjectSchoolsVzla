<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Gestión de Reservas de Laboratorio</title>
    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>
  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>
      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>
          <div class="container-fluid">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
            >
              <h1 class="h3 mb-0 text-gray-800">
                <i class="fas fa-tasks mr-2 text-primary"></i>Gestión de
                Reservas
              </h1>
              <a
                th:href="@{/infra/labs/reservations}"
                class="btn btn-secondary shadow-sm"
              >
                <i class="fas fa-arrow-left fa-sm text-white-50 mr-1"></i>
                Volver
              </a>
            </div>

            <div
              th:if="${successMessage}"
              class="alert alert-success alert-dismissible fade show shadow-sm"
              role="alert"
            >
              <i class="fas fa-check-circle mr-2"></i
              ><span th:text="${successMessage}"></span>
              <button type="button" class="close" data-dismiss="alert">
                <span>&times;</span>
              </button>
            </div>

            <div
              th:if="${errorMessage}"
              class="alert alert-danger alert-dismissible fade show shadow-sm"
              role="alert"
            >
              <i class="fas fa-exclamation-triangle mr-2"></i
              ><span th:text="${errorMessage}"></span>
              <button type="button" class="close" data-dismiss="alert">
                <span>&times;</span>
              </button>
            </div>

            <!-- Pending Reservations -->
            <div class="card shadow mb-4">
              <div
                class="card-header py-3 bg-gray-100 d-flex flex-row align-items-center justify-content-between"
              >
                <h6 class="m-0 font-weight-bold text-warning">
                  <i class="fas fa-clock mr-1"></i> Reservas Pendientes
                </h6>
                <span
                  class="badge badge-warning badge-pill"
                  th:text="${#lists.size(pendingReservations)}"
                  >0</span
                >
              </div>
              <div class="card-body">
                <div class="table-responsive">
                  <table
                    class="table table-bordered table-hover"
                    width="100%"
                    cellspacing="0"
                  >
                    <thead class="bg-gray-100 text-gray-800">
                      <tr>
                        <th>Laboratorio</th>
                        <th>Docente</th>
                        <th>Fecha/Hora</th>
                        <th>Estudiantes</th>
                        <th>Propósito</th>
                        <th class="text-center">Acciones</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr th:each="res : ${pendingReservations}">
                        <td
                          class="font-weight-bold text-primary"
                          th:text="${res.room.roomNumber}"
                        ></td>
                        <td
                          th:text="${res.teacher.firstName + ' ' + res.teacher.lastName}"
                        ></td>
                        <td>
                          <div class="small">
                            <i
                              class="fas fa-calendar-alt text-gray-400 mr-1"
                            ></i>
                            <span
                              th:text="${#temporals.format(res.startTime, 'dd/MM/yyyy')}"
                            ></span>
                          </div>
                          <div class="small font-weight-bold">
                            <i class="fas fa-clock text-gray-400 mr-1"></i>
                            <span
                              th:text="${#temporals.format(res.startTime, 'HH:mm') + ' - ' + #temporals.format(res.endTime, 'HH:mm')}"
                            ></span>
                          </div>
                        </td>
                        <td class="text-center">
                          <span
                            class="badge badge-light border"
                            th:text="${res.numberOfStudents != null ? res.numberOfStudents : 'N/A'}"
                          ></span>
                        </td>
                        <td>
                          <small
                            class="text-gray-600"
                            th:text="${res.purpose}"
                          ></small>
                        </td>
                        <td class="text-center">
                          <div class="btn-group">
                            <form
                              th:action="@{/infra/labs/approve/{id}(id=${res.id})}"
                              method="post"
                              style="display: inline"
                            >
                              <button
                                type="submit"
                                class="btn btn-success btn-sm shadow-sm"
                                title="Aprobar"
                              >
                                <i class="fas fa-check fa-sm mr-1"></i> Aprobar
                              </button>
                            </form>
                            <button
                              type="button"
                              class="btn btn-danger btn-sm shadow-sm ml-1"
                              data-toggle="modal"
                              th:data-target="'#rejectModal' + ${res.id}"
                              title="Rechazar"
                            >
                              <i class="fas fa-times fa-sm mr-1"></i> Rechazar
                            </button>
                          </div>

                          <!-- Reject Modal -->
                          <div
                            class="modal fade"
                            th:id="'rejectModal' + ${res.id}"
                            tabindex="-1"
                            role="dialog"
                          >
                            <div class="modal-dialog" role="document">
                              <div class="modal-content">
                                <div class="modal-header bg-danger text-white">
                                  <h5 class="modal-title">
                                    <i class="fas fa-ban mr-1"></i> Rechazar
                                    Reserva
                                  </h5>
                                  <button
                                    type="button"
                                    class="close text-white"
                                    data-dismiss="modal"
                                  >
                                    <span>&times;</span>
                                  </button>
                                </div>
                                <form
                                  th:action="@{/infra/labs/reject/{id}(id=${res.id})}"
                                  method="post"
                                >
                                  <div class="modal-body text-left">
                                    <div class="form-group">
                                      <label class="font-weight-bold"
                                        >Motivo del Rechazo
                                        <span class="text-danger"
                                          >*</span
                                        ></label
                                      >
                                      <textarea
                                        name="reason"
                                        class="form-control"
                                        rows="3"
                                        required
                                        placeholder="Explique por qué se rechaza esta solicitud..."
                                      ></textarea>
                                    </div>
                                  </div>
                                  <div class="modal-footer">
                                    <button
                                      type="button"
                                      class="btn btn-light"
                                      data-dismiss="modal"
                                    >
                                      Cancelar
                                    </button>
                                    <button
                                      type="submit"
                                      class="btn btn-danger shadow-sm"
                                    >
                                      Confirmar Rechazo
                                    </button>
                                  </div>
                                </form>
                              </div>
                            </div>
                          </div>
                        </td>
                      </tr>
                      <tr th:if="${pendingReservations.empty}">
                        <td colspan="6" class="text-center text-muted py-4">
                          No hay reservas pendientes
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-xl-6">
                <!-- Approved Reservations -->
                <div class="card shadow mb-4">
                  <div
                    class="card-header py-3 bg-white d-flex flex-row align-items-center justify-content-between"
                  >
                    <h6 class="m-0 font-weight-bold text-success">
                      <i class="fas fa-check-circle mr-1"></i> Reservas
                      Aprobadas
                    </h6>
                  </div>
                  <div class="card-body">
                    <div class="table-responsive">
                      <table class="table table-bordered table-sm table-hover">
                        <thead class="bg-gray-100">
                          <tr>
                            <th>Lab</th>
                            <th>Docente</th>
                            <th>Fecha/Hora</th>
                            <th>Estado</th>
                          </tr>
                        </thead>
                        <tbody>
                          <tr th:each="res : ${approvedReservations}">
                            <td
                              class="font-weight-bold"
                              th:text="${res.room.roomNumber}"
                            ></td>
                            <td
                              th:text="${res.teacher.firstName + ' ' + res.teacher.lastName}"
                            ></td>
                            <td>
                              <small
                                th:text="${#temporals.format(res.startTime, 'dd/MM HH:mm')}"
                              ></small>
                            </td>
                            <td>
                              <span class="badge badge-success">Aprobado</span>
                            </td>
                          </tr>
                          <tr th:if="${approvedReservations.empty}">
                            <td colspan="4" class="text-center text-muted py-3">
                              No hay registros
                            </td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>

              <div class="col-xl-6">
                <!-- Rejected Reservations -->
                <div class="card shadow mb-4">
                  <div
                    class="card-header py-3 bg-white d-flex flex-row align-items-center justify-content-between"
                  >
                    <h6 class="m-0 font-weight-bold text-danger">
                      <i class="fas fa-ban mr-1"></i> Reservas Rechazadas
                    </h6>
                  </div>
                  <div class="card-body">
                    <div class="table-responsive">
                      <table class="table table-bordered table-sm table-hover">
                        <thead class="bg-gray-100">
                          <tr>
                            <th>Lab</th>
                            <th>Docente</th>
                            <th>Fecha</th>
                            <th>Motivo</th>
                          </tr>
                        </thead>
                        <tbody>
                          <tr th:each="res : ${rejectedReservations}">
                            <td
                              class="font-weight-bold"
                              th:text="${res.room.roomNumber}"
                            ></td>
                            <td
                              th:text="${res.teacher.firstName + ' ' + res.teacher.lastName}"
                            ></td>
                            <td>
                              <small
                                th:text="${#temporals.format(res.startTime, 'dd/MM')}"
                              ></small>
                            </td>
                            <td>
                              <small
                                class="text-truncate d-inline-block"
                                style="max-width: 150px"
                                th:text="${res.rejectionReason}"
                              ></small>
                            </td>
                          </tr>
                          <tr th:if="${rejectedReservations.empty}">
                            <td colspan="4" class="text-center text-muted py-3">
                              No hay registros
                            </td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>

    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
  </body>
</html>
