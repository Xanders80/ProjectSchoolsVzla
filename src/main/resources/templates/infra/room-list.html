<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Aulas - Sistema de Gestión Escolar</title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>

  <body id="page-top" role="main">
    <div id="wrapper" role="region" aria-label="Contenedor principal">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>

      <div
        id="content-wrapper"
        class="d-flex flex-column"
        role="region"
        aria-label="Contenido principal"
      >
        <div id="content" tabindex="-1">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>

          <div class="container-fluid" role="main">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
              role="heading"
              aria-level="1"
            >
              <h1 class="h3 mb-0 text-gray-800">
                <i class="fas fa-door-open mr-2 text-primary"></i>Lista de Aulas
              </h1>
              <a
                th:href="@{/infra/rooms/new}"
                class="btn btn-primary"
                aria-label="Agregar Nueva Aula"
              >
                <i class="fas fa-plus" aria-hidden="true"></i> Agregar Nueva
                Aula
              </a>
            </div>

            <div th:if="${successMessage}" class="alert alert-success">
              <span th:text="${successMessage}"></span>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger">
              <span th:text="${errorMessage}"></span>
            </div>

            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Aulas del Sistema
                </h6>
              </div>
              <div class="card-body">
                <div class="table-responsive">
                  <table
                    class="table table-bordered table-hover"
                    id="dataTable"
                    width="100%"
                    cellspacing="0"
                  >
                    <thead class="thead-light">
                      <tr>
                        <th>ID</th>
                        <th>Number</th>
                        <th>Tipo</th>
                        <th>Capacidad</th>
                        <th>Edificio</th>
                        <th class="text-center">Acciones</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr th:each="room : ${rooms.content}">
                        <td th:text="${room.id}">1</td>
                        <td th:text="${room.roomNumber}">101</td>
                        <td th:text="${room.type}">Classroom</td>
                        <td th:text="${room.capacity}">30</td>
                        <td th:text="${room.building?.name}">Main Building</td>
                        <td class="text-center">
                          <div class="btn-group">
                            <a
                              th:href="@{/infra/rooms/edit/{id}(id=${room.id})}"
                              class="btn btn-sm btn-warning"
                              title="Editar"
                            >
                              <i class="fas fa-edit"></i>
                            </a>
                            <button
                              type="button"
                              class="btn btn-sm btn-danger"
                              data-toggle="modal"
                              data-target="#deleteModal"
                              th:onclick="'confirmDelete(\'' + @{/infra/rooms/delete/{id}(id=${room.id})} + '\')'"
                              title="Eliminar"
                            >
                              <i class="fas fa-trash"></i>
                            </button>
                          </div>
                        </td>
                      </tr>
                      <tr th:if="${rooms.empty}">
                        <td colspan="6" class="text-center text-muted py-4">
                          <i
                            class="fas fa-door-open fa-3x mb-3 text-gray-300"
                          ></i>
                          <br />
                          No se encontraron aulas.
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                <!-- Pagination -->
                <div
                  th:if="${rooms.totalPages > 1}"
                  class="d-flex justify-content-center"
                >
                  <nav aria-label="Page navigation">
                    <ul class="pagination">
                      <li
                        class="page-item"
                        th:classappend="${rooms.number == 0} ? 'disabled'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/infra/rooms(page=${rooms.number - 1}, size=10)}"
                          aria-label="Previous"
                        >
                          <span aria-hidden="true">&laquo;</span>
                        </a>
                      </li>
                      <li
                        class="page-item"
                        th:each="i : ${#numbers.sequence(0, rooms.totalPages - 1)}"
                        th:classappend="${i == rooms.number} ? 'active'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/infra/rooms(page=${i}, size=10)}"
                          th:text="${i + 1}"
                        ></a>
                      </li>
                      <li
                        class="page-item"
                        th:classappend="${rooms.number == rooms.totalPages - 1} ? 'disabled'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/infra/rooms(page=${rooms.number + 1}, size=10)}"
                          aria-label="Next"
                        >
                          <span aria-hidden="true">&raquo;</span>
                        </a>
                      </li>
                    </ul>
                  </nav>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top"
      ><i class="fas fa-angle-up"></i
    ></a>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
    <script th:src="@{/vendor/datatables/jquery.dataTables.min.js}"></script>
    <script
      th:src="@{/vendor/datatables/dataTables.bootstrap4.min.js}"
    ></script>
    <script th:src="@{/js/demo/datatables-demo.js}"></script>
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>
    <div th:replace="~{fragments/delete-modal :: deleteModal}"></div>
  </body>
</html>
