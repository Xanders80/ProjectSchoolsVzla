<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Gestión de Laboratorios</title>
    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>
  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>
      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>
          <div class="container-fluid">
            <h1 class="h3 mb-4 text-gray-800">
              <i class="fas fa-flask mr-2 text-primary"></i>Gestión de
              Laboratorios
            </h1>

            <div class="card shadow mb-4">
              <div
                class="card-header py-3 d-flex justify-content-between align-items-center"
              >
                <h6 class="m-0 font-weight-bold text-primary">
                  Aulas Tipo Laboratorio Disponibles
                </h6>
                <div>
                  <a
                    th:href="@{/infra/labs/statistics}"
                    class="btn btn-success btn-sm mr-2"
                  >
                    <i class="fas fa-chart-bar"></i> Estadísticas
                  </a>
                  <a
                    th:href="@{/infra/labs/management}"
                    class="btn btn-warning btn-sm mr-2"
                  >
                    <i class="fas fa-tasks"></i> Gestión de Reservas
                  </a>
                  <a
                    th:href="@{/infra/labs/reservations/all}"
                    class="btn btn-info btn-sm"
                  >
                    <i class="fas fa-list"></i> Ver Todas las Reservas
                  </a>
                </div>
              </div>
              <div class="card-body">
                <div class="table-responsive">
                  <table
                    class="table table-bordered"
                    id="dataTable"
                    width="100%"
                    cellspacing="0"
                  >
                    <thead>
                      <tr>
                        <th>Número</th>
                        <th>Edificio</th>
                        <th>Capacidad</th>
                        <th>Acciones</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr th:each="room : ${labRooms}">
                        <td th:text="${room.roomNumber}"></td>
                        <td th:text="${room.building.name}"></td>
                        <td th:text="${room.capacity}"></td>
                        <td>
                          <a
                            th:href="@{/infra/labs/reserve/{id}(id=${room.id})}"
                            class="btn btn-sm btn-primary"
                          >
                            <i class="fas fa-calendar-plus"></i> Reservar
                          </a>
                        </td>
                      </tr>
                      <tr th:if="${labRooms.empty}">
                        <td colspan="4" class="text-center text-muted">
                          No se encontraron aulas configuradas como laboratorio.
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
  </body>
</html>
