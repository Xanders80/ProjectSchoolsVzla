<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Todas las Reservas de Laboratorio</title>
    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>
  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>
      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>
          <div class="container-fluid">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
            >
              <h1 class="h3 mb-0 text-gray-800">
                <i class="fas fa-list mr-2 text-primary"></i>Historial de
                Reservas
              </h1>
              <a
                th:href="@{/infra/labs/reservations}"
                class="btn btn-secondary shadow-sm"
              >
                <i class="fas fa-arrow-left fa-sm text-white-50 mr-1"></i>
                Volver
              </a>
            </div>

            <div
              th:if="${successMessage}"
              class="alert alert-success alert-dismissible fade show shadow-sm"
              role="alert"
            >
              <i class="fas fa-check-circle mr-2"></i
              ><span th:text="${successMessage}"></span>
              <button
                type="button"
                class="close"
                data-dismiss="alert"
                aria-label="Close"
              >
                <span aria-hidden="true">&times;</span>
              </button>
            </div>

            <div
              th:if="${errorMessage}"
              class="alert alert-danger alert-dismissible fade show shadow-sm"
              role="alert"
            >
              <i class="fas fa-exclamation-triangle mr-2"></i
              ><span th:text="${errorMessage}"></span>
              <button
                type="button"
                class="close"
                data-dismiss="alert"
                aria-label="Close"
              >
                <span aria-hidden="true">&times;</span>
              </button>
            </div>

            <div class="card shadow mb-4">
              <div class="card-header py-3 bg-gray-100">
                <h6 class="m-0 font-weight-bold text-primary">
                  Listado de Reservas de Laboratorio
                </h6>
              </div>
              <div class="card-body">
                <div class="table-responsive">
                  <table
                    class="table table-bordered table-hover"
                    id="dataTable"
                    width="100%"
                    cellspacing="0"
                  >
                    <thead class="bg-gray-100">
                      <tr>
                        <th>Laboratorio</th>
                        <th>Docente</th>
                        <th>Fecha</th>
                        <th>Horario</th>
                        <th>Estado</th>
                        <th class="text-center">Acciones</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr th:each="reservation : ${reservations}">
                        <td
                          class="font-weight-bold text-primary"
                          th:text="${reservation.room.roomNumber}"
                        ></td>
                        <td
                          th:text="${reservation.teacher.firstName + ' ' + reservation.teacher.lastName}"
                        ></td>
                        <td
                          th:text="${#temporals.format(reservation.startTime, 'dd/MM/yyyy')}"
                        ></td>
                        <td>
                          <span
                            class="badge badge-light"
                            th:text="${#temporals.format(reservation.startTime, 'HH:mm') + ' - ' + #temporals.format(reservation.endTime, 'HH:mm')}"
                          ></span>
                        </td>
                        <td>
                          <span
                            class="badge p-2"
                            th:classappend="${reservation.status.name() == 'APPROVED' ? 'badge-success' : (reservation.status.name() == 'PENDING' ? 'badge-warning' : (reservation.status.name() == 'REJECTED' ? 'badge-danger' : 'badge-secondary'))}"
                            th:text="${reservation.status.displayName}"
                          >
                          </span>
                        </td>
                        <td class="text-center">
                          <form
                            th:action="@{/infra/labs/cancel/{id}(id=${reservation.id})}"
                            method="post"
                            th:if="${reservation.status.name() == 'PENDING'}"
                          >
                            <button
                              type="submit"
                              class="btn btn-sm btn-outline-danger shadow-sm"
                              onclick="
                                return confirm(
                                  '¿Está seguro de cancelar esta reserva?',
                                );
                              "
                              title="Cancelar Reserva"
                            >
                              <i class="fas fa-trash"></i> Cancelar
                            </button>
                          </form>
                          <span
                            th:unless="${reservation.status.name() == 'PENDING'}"
                            class="text-muted small"
                            >No editable</span
                          >
                        </td>
                      </tr>
                      <tr th:if="${reservations.empty}">
                        <td
                          colspan="6"
                          class="text-center text-muted py-5 text-gray-500"
                        >
                          <i
                            class="fas fa-calendar-times fa-3x mb-3 text-gray-200"
                          ></i>
                          <p class="mb-0">
                            No hay reservas registradas en el historial.
                          </p>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>

    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
  </body>
</html>
