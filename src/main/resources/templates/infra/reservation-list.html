<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Todas las Reservas de Laboratorio</title>
    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>
  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>
      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>
          <div class="container-fluid">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
            >
              <h1 class="h3 mb-0 text-gray-800">
                <i class="fas fa-calendar-check mr-2 text-primary"></i>Todas las
                Reservas de Laboratorio
              </h1>
              <a
                th:href="@{/infra/labs/reservations}"
                class="btn btn-secondary"
              >
                <i class="fas fa-arrow-left"></i> Volver
              </a>
            </div>

            <div
              th:if="${successMessage}"
              class="alert alert-success alert-dismissible fade show"
              role="alert"
            >
              <span th:text="${successMessage}"></span>
              <button
                type="button"
                class="close"
                data-dismiss="alert"
                aria-label="Close"
              >
                <span aria-hidden="true">&times;</span>
              </button>
            </div>

            <div
              th:if="${errorMessage}"
              class="alert alert-danger alert-dismissible fade show"
              role="alert"
            >
              <span th:text="${errorMessage}"></span>
              <button
                type="button"
                class="close"
                data-dismiss="alert"
                aria-label="Close"
              >
                <span aria-hidden="true">&times;</span>
              </button>
            </div>

            <div class="card shadow mb-4">
              <div
                class="card-header py-3 d-flex justify-content-between align-items-center"
              >
                <h6 class="m-0 font-weight-bold text-primary">
                  Listado de Reservas
                </h6>
              </div>
              <div class="card-body">
                <div class="table-responsive">
                  <table
                    class="table table-bordered"
                    width="100%"
                    cellspacing="0"
                  >
                    <thead>
                      <tr>
                        <th>Laboratorio</th>
                        <th>Docente</th>
                        <th>Inicio</th>
                        <th>Fin</th>
                        <th>Propósito</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr th:each="reservation : ${reservations}">
                        <td th:text="${reservation.room.roomNumber}"></td>
                        <td
                          th:text="${reservation.teacher.firstName + ' ' + reservation.teacher.lastName}"
                        ></td>
                        <td
                          th:text="${#temporals.format(reservation.startTime, 'dd/MM/yyyy HH:mm')}"
                        ></td>
                        <td
                          th:text="${#temporals.format(reservation.endTime, 'dd/MM/yyyy HH:mm')}"
                        ></td>
                        <td th:text="${reservation.purpose}"></td>
                        <td>
                          <span
                            class="badge"
                            th:classappend="${reservation.status.name() == 'APPROVED' ? 'badge-success' : (reservation.status.name() == 'PENDING' ? 'badge-warning' : (reservation.status.name() == 'REJECTED' ? 'badge-danger' : 'badge-secondary'))}"
                            th:text="${reservation.status.displayName}"
                          >
                          </span>
                        </td>
                        <td>
                          <form
                            th:action="@{/infra/labs/cancel/{id}(id=${reservation.id})}"
                            method="post"
                            style="display: inline"
                          >
                            <button
                              type="submit"
                              class="btn btn-sm btn-danger"
                              onclick="
                                return confirm(
                                  '¿Está seguro de cancelar esta reserva?',
                                );
                              "
                            >
                              <i class="fas fa-times"></i> Cancelar
                            </button>
                          </form>
                        </td>
                      </tr>
                      <tr th:if="${reservations.empty}">
                        <td colspan="7" class="text-center text-muted">
                          No hay reservas registradas.
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
  </body>
</html>
