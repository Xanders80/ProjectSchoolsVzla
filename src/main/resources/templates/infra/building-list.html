<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Edificios - Sistema de Gestión Escolar</title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>

  <body id="page-top">
    <div id="wrapper">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>

      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>

          <div class="container-fluid">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
            >
              <h1 class="h3 mb-0 text-gray-800">Lista de Edificios</h1>
              <a th:href="@{/infra/buildings/new}" class="btn btn-primary">
                <i class="fas fa-plus"></i> Agregar Nuevo Edificio
              </a>
            </div>

            <div th:if="${successMessage}" class="alert alert-success">
              <span th:text="${successMessage}"></span>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger">
              <span th:text="${errorMessage}"></span>
            </div>

            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Edificios del Sistema
                </h6>
              </div>
              <div class="card-body">
                <div class="table-responsive">
                  <table
                    class="table table-bordered"
                    id="dataTable"
                    width="100%"
                    cellspacing="0"
                  >
                    <thead>
                      <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Dirección</th>
                        <th>Acciones</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr th:each="building : ${buildings.content}">
                        <td th:text="${building.id}">1</td>
                        <td th:text="${building.name}">Main Building</td>
                        <td th:text="${building.address}">123 School St</td>
                        <td>
                          <a
                            th:href="@{/infra/buildings/edit/{id}(id=${building.id})}"
                            class="btn btn-sm btn-warning"
                          >
                            <i class="fas fa-edit"></i> Editar
                          </a>
                          <a
                            href="#"
                            class="btn btn-sm btn-danger"
                            data-toggle="modal"
                            data-target="#deleteModal"
                            th:data-url="@{/infra/buildings/delete/{id}(id=${building.id})}"
                          >
                            <i class="fas fa-trash"></i> Eliminar
                          </a>
                        </td>
                      </tr>
                      <tr th:if="${buildings.empty}">
                        <td colspan="4" class="text-center text-muted">
                          No se encontraron edificios.
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                <!-- Pagination -->
                <div
                  th:if="${buildings.totalPages > 1}"
                  class="d-flex justify-content-center"
                >
                  <nav aria-label="Page navigation">
                    <ul class="pagination">
                      <li
                        class="page-item"
                        th:classappend="${buildings.number == 0} ? 'disabled'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/infra/buildings(page=${buildings.number - 1}, size=10)}"
                          aria-label="Previous"
                        >
                          <span aria-hidden="true">&laquo;</span>
                        </a>
                      </li>
                      <li
                        class="page-item"
                        th:each="i : ${#numbers.sequence(0, buildings.totalPages - 1)}"
                        th:classappend="${i == buildings.number} ? 'active'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/infra/buildings(page=${i}, size=10)}"
                          th:text="${i + 1}"
                        ></a>
                      </li>
                      <li
                        class="page-item"
                        th:classappend="${buildings.number == buildings.totalPages - 1} ? 'disabled'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/infra/buildings(page=${buildings.number + 1}, size=10)}"
                          aria-label="Next"
                        >
                          <span aria-hidden="true">&raquo;</span>
                        </a>
                      </li>
                    </ul>
                  </nav>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top"
      ><i class="fas fa-angle-up"></i
    ></a>
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>
    <div th:replace="~{fragments/delete-modal :: deleteModal}"></div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
    <script th:src="@{/vendor/datatables/jquery.dataTables.min.js}"></script>
    <script
      th:src="@{/vendor/datatables/dataTables.bootstrap4.min.js}"
    ></script>
    <script th:src="@{/js/demo/datatables-demo.js}"></script>
    <script>
      $("#deleteModal").on("show.bs.modal", function (event) {
        var button = $(event.relatedTarget);
        var url = button.data("url");
        var modal = $(this);
        modal.find("#deleteForm").attr("action", url);
      });
    </script>
  </body>
</html>
