<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Edificios - Sistema de Gestión Escolar</title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
  </head>

  <body id="page-top" role="main">
    <div id="wrapper" role="region" aria-label="Contenedor principal">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>

      <div
        id="content-wrapper"
        class="d-flex flex-column"
        role="region"
        aria-label="Contenido principal"
      >
        <div id="content" tabindex="-1">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>

          <div class="container-fluid" role="main">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
              role="heading"
              aria-level="1"
            >
              <h1 class="h3 mb-0 text-gray-800">
                <i class="fas fa-building mr-2 text-primary"></i>Lista de Edificios
              </h1>
              <a
                th:href="@{/infra/buildings/new}"
                class="btn btn-primary"
                aria-label="Agregar Nuevo Edificio"
              >
                <i class="fas fa-plus" aria-hidden="true"></i> Agregar Nuevo
                Edificio
              </a>
            </div>

            <div th:if="${successMessage}" class="alert alert-success" role="alert" aria-live="polite">
              <span th:text="${successMessage}"></span>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger" role="alert" aria-live="assertive">
              <span th:text="${errorMessage}"></span>
            </div>

            <section class="card shadow mb-4" aria-label="Tabla de edificios">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Edificios del Sistema
                </h6>
              </div>
              <div class="card-body">
                <div class="table-responsive">
                  <table
                    class="table table-bordered"
                    id="dataTable"
                    width="100%"
                    cellspacing="0"
                  >
                    <thead>
                      <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Dirección</th>
                        <th>Acciones</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr th:each="building : ${buildings.content}">
                        <td th:text="${building.id}">1</td>
                        <td th:text="${building.name}">Main Building</td>
                        <td th:text="${building.address}">123 School St</td>
                        <td>
                          <a
                            th:href="@{/infra/buildings/edit/{id}(id=${building.id})}"
                            class="btn btn-sm btn-warning"
                          >
                            <i class="fas fa-edit"></i> Editar
                          </a>
                          <button
                            type="button"
                            class="btn btn-sm btn-danger"
                            data-toggle="modal"
                            data-target="#deleteModal"
                            th:onclick="'confirmDelete(\'' + @{/infra/buildings/delete/{id}(id=${building.id})} + '\')'"
                          >
                            <i class="fas fa-trash"></i> Eliminar
                          </button>
                        </td>
                      </tr>
                      <tr th:if="${buildings.empty}">
                        <td colspan="4" class="text-center text-muted">
                          No se encontraron edificios.
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                <!-- Pagination -->
                <div
                  th:if="${buildings.totalPages > 1}"
                  class="d-flex justify-content-center"
                >
                  <nav aria-label="Page navigation">
                    <ul class="pagination">
                      <li
                        class="page-item"
                        th:classappend="${buildings.number == 0} ? 'disabled'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/infra/buildings(page=${buildings.number - 1}, size=10)}"
                          aria-label="Previous"
                        >
                          <span aria-hidden="true">&laquo;</span>
                        </a>
                      </li>
                      <li
                        class="page-item"
                        th:each="i : ${#numbers.sequence(0, buildings.totalPages - 1)}"
                        th:classappend="${i == buildings.number} ? 'active'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/infra/buildings(page=${i}, size=10)}"
                          th:text="${i + 1}"
                        ></a>
                      </li>
                      <li
                        class="page-item"
                        th:classappend="${buildings.number == buildings.totalPages - 1} ? 'disabled'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/infra/buildings(page=${buildings.number + 1}, size=10)}"
                          aria-label="Next"
                        >
                          <span aria-hidden="true">&raquo;</span>
                        </a>
                      </li>
                    </ul>
                  </nav>
                </div>
              </div>
            </section>

          </div> <!-- Cierre del container-fluid -->
        </div> <!-- Cierre de #content -->

        <!-- FOOTER: Movido fuera de #content, directamente dentro de #content-wrapper -->
        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>

      </div> <!-- Cierre de #content-wrapper -->

    <a class="scroll-to-top rounded" href="#page-top">
      <i class="fas fa-angle-up"></i>
    </a>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
    <script th:src="@{/vendor/datatables/jquery.dataTables.min.js}"></script>
    <script
      th:src="@{/vendor/datatables/dataTables.bootstrap4.min.js}"
    ></script>
    <script th:src="@{/js/demo/datatables-demo.js}"></script>
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>
    <div th:replace="~{fragments/delete-modal :: deleteModal}"></div>
  </body>
</html>
