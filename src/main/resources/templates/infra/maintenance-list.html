<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Solicitudes de Mantenimiento - Sistema de Gestión Escolar</title>

    <link
      th:href="@{/vendor/fontawesome-free/css/all.min.css}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet" />
    <link
      th:href="@{/vendor/datatables/dataTables.bootstrap4.min.css}"
      rel="stylesheet"
    />
  </head>

  <body id="page-top" role="main">
    <div id="wrapper" role="region" aria-label="Contenedor principal">
      <div th:replace="~{fragments/sb-admin-sidebar :: sidebar}"></div>

      <div
        id="content-wrapper"
        class="d-flex flex-column"
        role="region"
        aria-label="Contenido principal"
      >
        <div id="content" tabindex="-1">
          <div th:replace="~{fragments/sb-admin-topbar :: topbar}"></div>

          <div class="container-fluid" role="main">
            <div
              class="d-sm-flex align-items-center justify-content-between mb-4"
              role="heading"
              aria-level="1"
            >
              <h1 class="h3 mb-0 text-gray-800">
                <i class="fas fa-tools mr-2 text-primary"></i>Gestión de Mantenimiento
              </h1>
              <a
                th:href="@{/infra/maintenance/new}"
                class="btn btn-primary"
                aria-label="Nueva Solicitud"
              >
                <i class="fas fa-plus" aria-hidden="true"></i> Nueva Solicitud
              </a>
            </div>

            <!-- Stats Cards -->
            <div class="row mb-4" aria-label="Resumen de estado de solicitudes">
              <div class="col-xl-3 col-md-6 mb-4">
                <section class="card border-left-warning shadow h-100 py-2" aria-label="Solicitudes pendientes">
                  <div class="card-body">
                    <div class="row no-gutters align-items-center">
                      <div class="col mr-2">
                        <div
                          class="text-xs font-weight-bold text-warning text-uppercase mb-1"
                        >
                          Pendientes
                        </div>
                        <div
                          class="h5 mb-0 font-weight-bold text-gray-800"
                          aria-label="Cantidad de solicitudes pendientes"
                          th:text="${pendingCount}"
                        >
                          0
                        </div>
                      </div>
                      <div class="col-auto">
                        <i class="fas fa-clock fa-2x text-gray-300"></i>
                      </div>
                    </div>
                </section>
              </div>
            </div>

            <div
              th:if="${successMessage}"
              class="alert alert-success alert-dismissible fade show"
              role="alert"
            >
              <span th:text="${successMessage}"></span>
              <button
                type="button"
                class="close"
                data-dismiss="alert"
                aria-label="Close"
              >
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div
              th:if="${errorMessage}"
              class="alert alert-danger alert-dismissible fade show"
              role="alert"
            >
              <span th:text="${errorMessage}"></span>
              <button
                type="button"
                class="close"
                data-dismiss="alert"
                aria-label="Close"
              >
                <span aria-hidden="true">&times;</span>
              </button>
            </div>

            <div class="card shadow mb-4">
              <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                  Solicitudes Registradas
                </h6>
              </div>
              <div class="card-body">
                <div class="table-responsive">
                  <table
                    class="table table-bordered"
                    id="dataTable"
                  >
                    <thead>
                      <tr>
                        <th>ID</th>
                        <th>Ubicación</th>
                        <th>Descripción</th>
                        <th>Solicitante</th>
                        <th>Fecha Solicitud</th>
                        <th>Fecha Completado</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr th:each="request : ${requests.content}">
                        <td th:text="${request.id}">1</td>
                        <td
                          th:text="${request.room != null ? request.room.name : 'No especificada'}"
                        >
                          Sala 101
                        </td>
                        <td
                          th:text="${#strings.abbreviate(request.description, 50)}"
                        >
                          Problema con el proyector...
                        </td>
                        <td
                          th:text="${request.requestedBy != null ? request.requestedBy.username : 'N/A'}"
                        >
                          admin
                        </td>
                        <td
                          th:text="${#temporals.format(request.requestDate, 'dd/MM/yyyy HH:mm')}"
                        >
                          01/01/2024 10:00
                        </td>
                        <td
                          th:text="${request.completionDate != null ? #temporals.format(request.completionDate, 'dd/MM/yyyy HH:mm') : '-'}"
                        >
                          -
                        </td>
                        <td>
                          <span
                            class="badge"
                            th:classappend="${request.status == 'PENDING' ? 'badge-warning' :
                                                                      (request.status == 'IN_PROGRESS' ? 'badge-info' : 'badge-success')}"
                            th:text="${request.status == 'PENDING' ? 'Pendiente' :
                                                               (request.status == 'IN_PROGRESS' ? 'En Progreso' : 'Completado')}"
                            >Pendiente</span
                          >
                        </td>
                        <td>
                          <!-- Update Status Buttons -->
                          <form
                            th:if="${request.status == 'PENDING'}"
                            th:action="@{/infra/maintenance/update-status/{id}(id=${request.id})}"
                            method="post"
                            style="display: inline"
                          >
                            <input
                              type="hidden"
                              name="status"
                              value="IN_PROGRESS"
                            />
                            <button
                              type="submit"
                              class="btn btn-sm btn-info"
                              title="Iniciar"
                            >
                              <i class="fas fa-play"></i>
                            </button>
                          </form>

                          <form
                            th:if="${request.status == 'IN_PROGRESS'}"
                            th:action="@{/infra/maintenance/update-status/{id}(id=${request.id})}"
                            method="post"
                            style="display: inline"
                          >
                            <input
                              type="hidden"
                              name="status"
                              value="COMPLETED"
                            />
                            <button
                              type="submit"
                              class="btn btn-sm btn-success"
                              title="Completar"
                            >
                              <i class="fas fa-check"></i>
                            </button>
                          </form>

                          <a
                            th:href="@{/infra/maintenance/edit/{id}(id=${request.id})}"
                            class="btn btn-sm btn-warning"
                            title="Editar"
                          >
                            <i class="fas fa-edit"></i>
                          </a>
                          <button
                            type="button"
                            class="btn btn-sm btn-danger"
                            data-toggle="modal"
                            data-target="#deleteModal"
                            th:onclick="'confirmDelete(\\'' + @{/infra/maintenance/delete/{id}(id=${request.id})} + '\\')'"
                            title="Eliminar"
                          >
                            <i class="fas fa-trash"></i>
                          </button>
                        </td>
                      </tr>
                      <tr th:if="${#lists.isEmpty(requests.content)}">
                        <td colspan="7" class="text-center text-muted">
                          No hay solicitudes registradas.
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                <!-- Pagination -->
                <div
                  th:if="${requests.totalPages > 1}"
                  class="d-flex justify-content-center"
                >
                  <nav aria-label="Page navigation">
                    <ul class="pagination">
                      <li
                        class="page-item"
                        th:classappend="${requests.number == 0} ? 'disabled'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/infra/maintenance(page=${requests.number - 1}, size=10)}"
                          aria-label="Previous"
                        >
                          <span aria-hidden="true">&laquo;</span>
                        </a>
                      </li>
                      <li
                        class="page-item"
                        th:each="i : ${#numbers.sequence(0, requests.totalPages - 1)}"
                        th:classappend="${i == requests.number} ? 'active'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/infra/maintenance(page=${i}, size=10)}"
                          th:text="${i + 1}"
                        ></a>
                      </li>
                      <li
                        class="page-item"
                        th:classappend="${requests.number == requests.totalPages - 1} ? 'disabled'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/infra/maintenance(page=${requests.number + 1}, size=10)}"
                          aria-label="Next"
                        >
                          <span aria-hidden="true">&raquo;</span>
                        </a>
                      </li>
                    </ul>
                  </nav>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div th:replace="~{fragments/sb-admin-footer :: footer}"></div>
      </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top">
      <i class="fas fa-angle-up"></i>
    </a>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
    <script th:src="@{/vendor/datatables/jquery.dataTables.min.js}"></script>
    <script
      th:src="@{/vendor/datatables/dataTables.bootstrap4.min.js}"
    ></script>
    <script th:src="@{/js/demo/datatables-demo.js}"></script>
    <div th:replace="~{fragments/sb-admin-topbar :: logoutModal}"></div>
    <div th:replace="~{fragments/delete-modal :: deleteModal}"></div>
  </body>
</html>
