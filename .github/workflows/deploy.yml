name: Deploy to Production
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package -Pprod -DskipTests --file pom.xml
      - name: Run tests
        run: mvn -B test -Ptest
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: school-management-prod
          path: target/*.jar
      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "target/*.jar"
          target: "/opt/sms/"
          strip_components: 1
      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            systemctl stop school-management
            cp /opt/sms/school-management-*.jar /opt/sms/app.jar
            systemctl start school-management
            sleep 10
            systemctl status school-management
            curl -sf http://localhost:8080/actuator/health || exit 1
