name: "code-review"
version: "1.0.0"

stages:
  01_static_analysis:
    agent: "tech-lead"
    checks:
      - code_conventions
      - security_patterns
      - performance_issues
      - test_coverage
    output: "review-report.md"

  02_detailed_review:
    agent: "tech-lead"
    input: "review-report.md"
    focus_areas:
      - business_logic_correctness
      - error_handling
      - edge_cases
      - i18n_compliance
    output: "detailed-review.md"

  03_feedback:
    agent: "tech-lead"
    actions:
      - categorize_findings
      - suggest_improvements
      - provide_code_examples
    output: "feedback-report.md"

  04_resolution:
    agent: "backend-specialist"
    input: "feedback-report.md"
    actions:
      - address_findings
      - update_code
      - add_tests_if_needed
    output: "updated_code"

  05_verification:
    agent: "tech-lead"
    actions:
      - verify_fixes
      - approve_or_request_changes

killers_active:
  - error-handler
  - hallucination-guard
